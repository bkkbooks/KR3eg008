body:
  text: 卷二仲景伏氣溫病篇傷寒論師曰伏氣之病以意候之今月之內欲有伏氣假令舊有伏氣當須脈之若脈微弱者當喉中痛似傷非喉痹也病人云實咽中痛雖爾今復欲下利張路玉曰冬月感寒伏藏於經至春當發故曰以意候之今月之內言春分候也若脈微弱者其人真元素虧必不發於陽而發於陰以少陰之脈循喉嚨伏邪始發熱必上升故必喉中痛似傷腎司開闔經之熱邪不能外發勢必內攻其後下利也章虛谷曰此條仲景教人辨冬伏寒邪春發之溫病當以心意測候之也如今月之內欲有發伏氣之病者必無其氣而有其病病與時氣不合即知其病因舊有伏氣而發假令舊有伏氣者須審其脈知其邪從何處而出也若脈微弱知其邪雖化熱未離少陰循經脈而上灼當喉中痛似傷者卻非外邪入內之喉痹是內熱欲出之喉痛也何也若春時外感風邪脈浮而弦數先見發熱惡寒之外證今脈微弱則非外感而反喉痛則確知為內發之伏熱是無其氣而有其病也伏熱上行不得外散勢必又從下走故曰實咽中痛雖爾今復欲下利也然亦有兼外感者即審其脈證皆可照此辨之也觀仲景標中風傷寒暑熱等病之脈與難經同惟難經言溫病之脈行在諸經不知何經之動也各隨其經所在而取之是言溫病初由伏邪隨氣血流行在諸經中及其邪之發也不知從何經而動既發之後各隨其邪所在之經而治之其發無定處故無一定之脈象可示也今仲景又教人審脈以辨邪發之經如脈微弱即知其邪未離少陰必當有咽痛下利等證正與難經互相發明者也故如下文云邪出三陽熱勢大盛其脈浮大上關上則是脈隨證變證隨脈見其發也既無定處則無定證既無定證則無定脈故難經不標脈象也由是觀之其與外感之邪而有定證定脈者迥不同矣故仲景與難經無異也少陰病脈微細但欲寐也二三日咽痛者可與甘草湯不瘥者與桔梗湯張路玉曰陰邪為病其發必暴所以伏氣發於少陰必咽痛仲景遂以緩法治之甘草味甘其性最緩因取以治少陰伏氣發溫之最急者蓋甘先入脾脾緩則陰火之勢亦緩且生用力能瀉火故不兼別味獨用以取專功也設不瘥必是伏邪所發勢盛緩不足以濟急更加桔梗升載其邪使發於陽分之陰邪盡從陽分而散不致仍復下陷入於陰分也倘治稍失宜陰津為熱邪所耗即用祛熱救陰之藥恐無及也葉香岩曰春夏溫熱之病必自內而及外汪按此專指伏氣之病尤拙吾曰少陰為陰寒邪亦為陰以陰遇陰故得藏而不發是以傷寒之邪自太陽遞入三陰溫病之邪自少陰傳出三陽章虛谷曰風寒外閉少陰而咽痛者仲景用半夏散辛溫開泄之法矣此少陰伏熱內發循經上灼而咽痛雖不合用辛溫開泄亦不可用涼藥以遏其外出之勢故用甘草甘平和中導邪外達如不瘥更加桔梗上通其氣楊云據此則桔梗分兩宜輕蓋火鬱不得外出故痛通其氣使火外達則痛自止矣傷寒之邪自表入里故先太陽而後至少陰溫病之邪自里出表故先少陰而後出太陽歷來不辨源流故各條次序亦紊而傷寒溫病攙混不清也淦按伏氣為病皆自內而之外不止春溫一病蓋四時之氣皆有伏久而發者不可不知也少陰病下利咽痛胸滿心煩者豬膚湯主之張路玉曰下利咽痛胸滿心煩少陰之伏邪雖發陰經實為熱證邪熱充斥上下中間無所不到寒下之藥不可用矣又立豬膚湯以潤少陰之燥與用黑驢皮之意頗同陽微者用附子溫經陰竭者用豬膚潤燥同具散邪之意比而觀之思過半矣少陰病得之二三日以上心中煩不得臥黃連阿膠湯主之周禹載曰伏邪未發津液先已暗耗今得之二三日以上雖陰火不升未見咽痛等證而心煩不得臥已知陰液消耗故以芩連祛熱膠芍滋陰兩得之矣少陰病下利六七日咳而嘔渴心煩不得眠者豬苓湯主之楊云此當兼有停飲故方治如此章虛谷曰此不咽痛其邪由肺直走腸胃而下利六七日不止因而熱從下陷不得外透故逆於肺則咳而嘔乘心則煩渴不得眠以心肺皆通少陰之脈故也主以豬苓湯利小便而滋陰滋其陰則熱隨利去利其小便則瀉止而煩渴亦解矣少陰病得之二三日口燥咽乾者急下之宜大承氣湯張路玉曰伏氣之發於少陰其勢最急與傷寒之傳經熱證不同得病才二三日即口燥咽乾延至五六日始下必枯槁難為矣故宜急下以救腎水之燔灼也按少陰急下三證一屬傳經熱邪亢極一屬熱邪轉入胃腑一屬溫熱發自少陰皆刻不容緩之證故當急救欲絕之腎水與陽明急下三法同源異派章虛谷曰上五條皆邪不離少陰其病之輕重變化證之虛實不同有如此者況又傳於他經而其變證殆無窮盡觀仲景隨證設方辨別施治其義理精微有難言喻矣太陽病發熱而渴不惡寒者為溫病郭白雲曰冬傷於寒至春發為溫病冬不傷寒而春自感風溫之氣而病者亦謂之溫雄按自感溫病仲聖未論詳於葉氏列第三卷王安道曰溫病如此則知熱病亦如此是則不渴而惡寒者非溫熱病矣溫熱病而有惡風惡寒之證者重有風寒新中也周禹載曰溫病由伏邪自內發出一達於外表裡俱熱熱勢既壯郁邪耗液故發而即渴其表本無邪郁內方喜寒故不惡寒延至三五日間或腹滿或下利者即此證也與傷寒之先表后里者大異然猶系太陽以未顯他經之證明自少陰發出為表裡也葉香岩曰發熱而渴者溫病熱邪自內達外若誤汗之禍不可言沈堯封曰此條雖不言脈以後條參之其尺部必浮也章虛谷曰溫病之發而無定處少陰之表為太陽熱邪從里出表即有發熱頭痛之太陽病也不惡寒其非外感之邪可知渴者熱從內發之證也仲景恐人錯認為太陽傷風寒故特標是伏熱內發之溫病也其少陰溫病反不標者因伏氣條內已申明咽痛下利為少陰初發之溫病也雄按汪謝城孝廉云吳氏溫病條辨上焦篇首引傷寒論云太陽病但惡熱不惡寒而渴者名曰溫病桂枝湯主之今檢傷寒論卻未見此數語使此語真出仲景耶亦當辨其簡誤若系吳氏誤記尤不可不為之辨正余謂非誤記也因喻氏嘗云仲景治溫證凡用表藥皆以桂枝湯以示微發於不發之意尤在涇讀書記云此喻氏之臆說非仲景之舊章鞠通自問跳出傷寒圈子而不覺已入嘉言套中又不甘為人下遂肆改原文捏為聖訓以竊附於宮牆而不自知其誣聖誤世之罪亦可慨已汪按鞠通發憤著書力闢升散溫燥之弊功已不細然可議處尚多夢隱此書去其瑕而存其瑜乃鞠通之諍友也若發汗已身灼熱者名曰風溫風溫為病脈陰陽俱浮自汗出身重多眠睡鼻息必鼾語言難出若被下者小便不利直視失溲若被火者微發黃色劇則如驚癇時瘛瘲若火熏之一逆尚引日再逆促命期張隱菴曰名曰溫者積寒成熱而發也宜辛涼發散楊云此語誤矣非治此證之法條內無太陽病三字是無表邪也何必辛涼發散微汗出而解若誤用辛溫之藥發汗已身反灼然熱發者名曰風溫蓋發汗則陰液外泄風熱之邪更甚而身如燒灼也脈陰陽俱浮者風熱之邪自里出表故浮也風熱傷氣故汗出而身重多眠也楊云此證最易出汗故條中有自汗之文不必以辛溫誤散而然也肺氣通於鼻而主皮毛風熱在表而睡息必鼾也夫心主言肺主聲肺熱受傷故語言難出此因風熱過甚而陰氣消沮故為病如是焉若被妄下則愈亡陰液於後而小便不利於前矣津液傷則州都之官失守不能約束而失溲矣足太陽之脈入目系而出項津液內亡則目系不能轉而直視矣若加以火攻風火交熾脾土轉病身必發黃火攻之甚劇則神志散越如驚如癇時瘈時瘲矣是以一逆尚可苟延時日如再以火熏之是再逆促命期矣楊云注家皆以此條承上文而來故所注如此其實上條乃溫病提綱此條並不與上條連貫也汪按楊評極精然病名風溫而脈浮參以辛涼未為過也自汗固不必由於誤表然誤表致成此候者亦有之後文白虎加人參湯石膏亦辛甘之味沈堯封曰溫熱二病古人往往互稱醫者只須認定脈證擬何方治不必拘於名式難經云熱病之脈陰陽俱浮本條云風溫為病脈陰陽俱浮兩證脈相同也三陽合病但欲眠睡身重難以轉側本條身重多眠兩證病相似也熱病合病俱主以白虎湯則此條雖無主治似可從白虎湯擬法章虛谷曰太陽外感之邪若發汗已必熱退身涼矣今熱邪從少陰而發既經外發當清其熱乃誤發其汗反傷津氣助其邪勢故身更灼熱因而勾起其肝風鼓盪其溫邪故名曰風溫其為病也虛陽外浮熱邪漫溢故脈陰陽俱浮津液外泄自汗不止氣乏神昏則身重多眠睡內風上鼓而機竅窒塞故鼻息必鼾語言難出其非外受風邪之證可見矣若被下者謂未經誤汗非謂汗後又下也蓋邪伏少陰熱灼水枯咽乾口燥法當急下此熱已發出太陽而少陰空虛若下之傷陰則小便不利而直視失溲則氣亦脫矣如被汗下而被火攻者外火助內熱熏蒸而發黃劇則火邪擾心如驚癇肝風熾盛而瘈瘲皆敗壞之象也若止火熏之一逆尚可引日苟延若既汗又下而再逆之更促其命期也雄按彼冬溫春溫之先犯手太陰者皆曰風溫乃吸受之溫風也此伏邪內發誤汗致逆者亦曰風溫乃內動之虛風也然風溫在肺只宜清解若誤以辛熱之藥汗之亦有自汗多眠鼻鼾難語之變淦按鼻鼾是肺腎相關子母同病自汗出乃陰不內守心液外越也未必盡是少陰一經之證服桂枝湯大汗出後大煩渴不解脈洪大者白虎加人參湯主之張路玉曰此本溫熱病誤認風傷衛服桂枝湯也若風傷衛服湯後必微汗而解矣不知此本溫熱誤服桂枝湯遂至脈洪大大汗煩渴不解若誤用麻黃必變如上條之危殆蓋桂枝治自外入之風邪石膏治自內發之熱邪故白虎湯為熱邪中暍之的方專解內蒸之熱非治在經之熱也大汗傷津故加人參以救液則煩渴自解矣尤拙吾曰溫邪非發散可愈即有表證亦豈辛溫可發桂枝湯為傷寒表病而里和者設溫證邪從里發而表且未病誤用桂枝適足以助邪而耗液蓋伏寒化熱少陰之精已被劫奪更用辛熱是絕其本而資之脫也若曰少陰本寒標熱邪入其界非溫不散然溫病之發寒已變熱其欲出之勢有不待引之而自出者其不能出者必皆陰精已涸者也不然寧有不出者耶雄按先曾祖云風寒為病可以桂枝湯發汗而愈若發汗而熱反灼者乃風溫病溫即熱之謂也後人不為詳玩謂風溫為汗後壞病抑何固耶夫病本熱也加以桂枝之辛熱故液為熱迫而汗大出液去則熱愈灼故大煩渴而脈洪大連上條似論一證主以白虎加人參正內經風淫熱淫治以甘寒之旨也又醫林改錯謂發熱有汗之證從未見桂枝湯治愈一人是亦溫病也太陽與少陽合病自下利者與黃芩湯若嘔者黃芩加半夏生薑湯主之張路玉曰黃芩湯乃溫病之主方即桂枝湯以黃芩易桂枝而去生薑也蓋桂枝主在表風寒黃芩主在裡風熱不易之定法也其生薑辛散非溫熱所宜故去之溫病始發即當用黃芩湯去熱為主傷寒傳至少陽熱邪漸次入里方可用黃芩佐柴胡解之此表裡寒熱之次第也周禹載曰明言太少二陽何不用二經藥非傷寒也傷寒由表入里此則自內發外無表何以知太少二陽或脅滿或頭痛或口苦引飲或不惡寒而即熱故不得謂之表也如傷寒合病皆表病也今不但無表且有下利里證傷寒協熱利必自傳經而入不若此之即利也溫何以即利外發未久內郁已深其人中氣本虛豈能一時盡泄於外勢必下走作利矣雄按少陽膽木挾火披猖嘔是上衝利由下迫何必中虛始利飲聚而嘔乎半夏生薑專開飲結如其熱熾宜易連茹楊云此注精當非前注所及三陽合病脈浮大上關上但欲眠睡目合則汗周禹載曰溫氣發出乃至三陽皆病其邪熱溷實不言可知故其脈浮大也意邪伏少陰時則尺脈亦已大矣今因由內發外由下達上而浮大見於關以上故曰上關上也邪雖上見陽位少陰之源未靖則欲眠尚顯本證而目合則汗即為盜汗又顯少陽本證何以獨見少陽因母虛子亦虛而少陰邪火與少陽相火同升燔灼也所以稍異熱病者但目合則汗不似熱病之大汗不止也然何以不言太陽陽明二經證以浮為太陽經脈大為陽明經脈也雄按御纂醫宗金鑑正誤篇云浮大上之上字當是弦字始合三陽合病之脈至治法繆仲淳擬用百合一兩麥冬五錢知母栝蔞根白芍藥各二錢鱉甲三錢炙甘草一錢竹葉五十片楊云此條與發汗已身灼熱之風溫正是一串初起為此病汗後則為風溫證徐亞枝云楊侯嘗語余曰傷寒論當逐條分讀不必固求連綴次序其意以洄溪傷寒類方但當因證以論方不必循經而論證為直截了當蓋逐條分讀則其間脈絡貫通處自見若泥次序求連綴不免鑿矣及讀此評益服其讀書另具隻眼金匱曰溫瘧者其脈如平身無寒但熱骨節疼煩時嘔白虎加桂枝湯主之尤拙吾曰此與內經論瘧文不同內經言其因此詳其脈與證也癉瘧溫瘧俱無寒但熱俱嘔而其因不同癉瘧者肺素有熱而加外感為表寒裡熱之證緣陰氣內虛不能與陽相爭故不作寒也溫瘧者邪氣內藏少陰至春夏而始發為伏氣外出之證寒蓄久而變熱故亦不作寒也脈如平者病非外感故脈如其平時也骨節疼煩時嘔者熱從少陰出外舍於腎之所合而上並於陽明也白虎甘寒除熱桂枝則因勢而達之耳雄按喻氏謂仲景論瘧既云弦數者多熱矣而復申一義曰弦數者風發見多熱不已必至於極熱極熱則生風風生則肝木侮土而傳其熱於胃坐耗津液此非可徒求之藥須以飲食消息止其熾熱即梨汁蔗漿生津止渴之屬正內經風淫於內治以甘寒之旨也仲景伏氣熱病篇傷寒論曰陽明脈浮而緊咽燥口苦腹滿而喘發熱汗出不惡寒反惡熱身重若發汗則躁心憒憒反譫語若加燒針必怵惕煩躁不得眠若下之則胃中空虛客氣動膈心下懊憹舌上苔者梔子豉湯主之若渴欲飲水口乾舌燥者白虎加人參湯主之若脈浮發熱渴欲飲水小便不利者豬苓湯主之周禹載曰浮緊傷寒脈也何以為熱病以其發於夏不惡寒反惡熱也又何以獨言陽明以夏時濕熱上蒸邪從胃發且腹滿而喘種種皆陽明證也然咽燥非少陰證耶不知陽明為從出之途少陰其伏藏之地也夫既陽明熱病曷又為脈反浮緊正以夏時肌腠本開人本多汗風邪襲入致腠理反閉而無汗故夏之風脈每似冬之寒脈也今云汗出而脈亦浮緊者正因浮甚有力熱邪盛而致也若不知者以辛熱汗之耗其精液必至躁妄昏昧火劫溫針燥其陰血必至驚擾無寐下之必亡其陰必至胃虛邪陷心中懊憹此皆誤治將何以救之乎觀舌上苔滑者則外邪尚在以梔子解熱香豉祛邪是為合法若渴飲漿水口乾舌燥知其外邪亦入總以白虎湯為治加人參者以誤治而精液大傷也設使緊脈去而浮在發熱飲水小便不利則其浮為虛而熱已入膀胱入膀胱者曷不飲以四苓而主以豬苓耶傷寒之小便不利結於氣分熱病之小便不利由於血分者也因邪郁既深耗液日久故必以阿膠補虛滑石祛熱而無取乎白朮也沈堯封曰未經誤治之時本是白虎湯主治陽明病汗出多而渴者不可與豬苓湯以汗多胃中燥豬苓湯複利其小便故也周禹載曰渴而小便不利本當用豬苓湯然汗多在所禁也此與傷寒入腑不令溲數同意蓋邪出陽明已劫其津汗出復多更耗其液津液曾幾更可下奪耶當以白虎加人參去其熱則小便之不利者津回而自利矣沈堯封曰穀食在胃全賴津液充足方能滑潤達下若津液一枯穀食即燥結難下故陽明非燥不病然燥者五氣之一而五氣中風與熱亦能致燥易曰燥萬物者莫熯乎火又曰風自火出此三義皆因乎天者若人之致燥有二汗與小便是也苟過多則亦未有不燥者矣三陽合病腹滿身重難以轉側口不仁而面垢譫語遺溺發汗則譫語下之則額上生汗手足逆冷若自汗出者白虎湯主之雄按發汗則譫語下似脫一甚字馬元儀曰此證發汗則偏於陽而津液傷攻下則偏於陰而真氣損惟有白虎一法主解熱而不礙表裡但三陽病脈當浮大而亦有微弱不起者以邪熱抑遏不得外達待清其壅則脈自起勿謂陽衰故脈微也雄按更不可誤以為陽證見陰脈章虛谷曰此條邪熱更重瀰漫三陽而致腹滿身重難以轉側口不仁者不知味也由胃中濁壅熏蒸故又面垢也熱甚神昏則譫語遺溺若未經誤治而自汗出者主以白虎湯雄按仲淳云宜加百合此倒裝文法謂非誤發其汗之汗故名自汗出雄按尤在涇注云若自汗出句頂腹滿身重四句來若誤發其汗而致譫語雄按白虎加人參湯或可救也或下之額上生汗者是絕汗也手足逆冷陽氣將亡即所謂再逆促命期非白虎所可治也仲景外感熱病篇太陽中熱者暍是也其人汗出惡寒身熱而渴也王安道曰暑熱者夏之令也大行於天地之間人受傷而為病名曰中暑亦曰中熱一也葉香岩曰熱地如爐傷人最速趙以德曰汗出惡寒身熱而不渴者中風也渴者中暍也周禹載曰冬月有寒則能傷人名中寒夏月有熱亦能傷人名中熱此是外來之熱故曰中非即伏寒發出夏必病熱之熱也然而同用白虎者總以所傷在氣則所主在金所病在熱生金者土金生者水金病則我母我子俱病故與伏氣之在少陰發出之由陽明者無異要皆並主一湯全不因冬月之伏與夏月之中為二義也又全不以伏氣之渴與今病之渴為稍異也嗚呼聖人於此有意立方無心表異以千古之前自有此理萬世之下自有此悟也雄按古人但以寒為肅殺之氣而於暑熱甚略是闕文也徐洄溪曰凡汗出多之病無不惡寒者以其惡寒汗出而誤認為寒妄用熱劑則立危矣何報之曰汗大泄不止亡陽且令腎水竭絕津液內枯是謂亡陰急當滋水之上源三伏之義為金受囚也金遇丙丁失其清肅而壬水絕於巳癸水絕於午西北之寒清絕矣前人有謂夏月宜補者乃補天元之真氣非補熱火也令人夏食寒是也沈堯封曰此是熱病證據素問在天為熱在地為火熱者火之氣也故熱乃五氣之一而熱病即傷寒有五之一傷寒論以難經熱字恐與下文溫字相混故特指出曰暍是也感烈日之氣而病即素問寒暑燥濕風之暑病或曰暍是陽邪暑是陰邪土潤溽暑熱兼濕言也似與暍有異曰寒往則暑來與寒對待非專言熱而何古人稱暑暍熱一也若濕熱並至之病難經名曰濕溫不名暑迨至隋唐後皆指濕熱為暑於是真暑之名失而暍之名更不知為何病矣雄按北齊書後主紀六月遊南苑從官暍死者六十人千金須知云熱死曰暍是唐時尚知暑暍之為熱也雄按內經云在天為熱在地為火其性為暑又云歲火太過炎暑流行蓋暑為日氣其字從日曰炎暑曰酷暑皆指烈日之氣而言也夏至後有小暑大暑冬至後有小寒大寒是暑即熱也寒即冷也暑為陽氣寒為陰氣乃天地間顯然易知之事並無深微難測之理而從來歧說偏多豈不可笑更有調停其說者強分動得靜得為陰陽夫動靜惟人豈能使天上之暑氣隨人而判別乎況內經有陰居避暑之文武王有樾蔭暍人之事仲景以白虎湯為熱病主方同條共貫理益彰彰何後賢之不察而好為聚訟以紊道深文以晦道耶若謂暑必兼濕則亢旱之年濕難必得況兼濕者何獨暑哉蓋濕無定位分旺四季風濕寒濕無不可兼惟夏季之土為獨盛故熱濕多於寒濕然暑字從日日為天氣濕字從土土為地氣霄壤不同雖可合而為病究不可謂暑中原有濕也傷寒脈浮滑此表有熱里有寒白虎湯主之王三陽曰經文寒字當作邪字解亦熱也方中行曰世本作表有熱里有寒必系傳寫之誤夫白虎本為治熱病暑病之藥其性大寒安得里有寒者可服之理詳本文脈浮滑不但無緊且復多滑乃陽氣甚而鬱蒸此里有熱也裡熱甚必格寒於外多厥逆身涼而為亢害之證此表有寒也厥陰篇中脈滑而厥者里有熱也白虎湯主之則知此表裡二字為錯誤可知當為上下更易魏念庭曰此里尚為經絡之裡非臟腑之裡也沈堯封曰里有寒之寒字乃暍字之誤如果里有寒何以反用石膏知母乎表有熱即身熱也上節止言病名不言脈證此節詳言脈證出方主治兩節本是相承叔和校訂時此節幸有寒字之誤不被摘出若見暍字早已摘置別論中矣程郊倩云暍病脈不浮不思傷寒論之暍即難經之熱病也難經云熱病之脈陰陽俱浮浮之而滑沉之散澀此是緊要處豈可模糊讀過本條脈浮滑與難經熱病脈合則白虎的是熱病主方而寒字的是暍字之誤雄按楊素園大令云此條寒字諸家所辯未能妥貼徐君亞枝謂當作痰字解於義較協余謂徐君此解可稱千古隻眼夫本論無痰字如濕家胸中有寒之寒字亦作痰字解蓋痰本作淡會意二火搏水成痰也彼濕家火微濕盛雖渴而不能飲是為濕痰此暍病火盛爍液脈既滑矣主以白虎湯則渴欲飲水可知是為熱痰凡痰因火動脈至滑實而口渴欲飲者即可以白虎治之況暍家乎汪按靈素兩經亦但曰水曰寒無一痰字傷寒脈滑而厥者里有熱也白虎湯主之張路玉曰滑陽脈也故其厥為陽厥裡熱郁熾所以其外反惡寒厥逆往往有唇面爪甲俱青者故宜白虎以清裡而除熱也傷寒無大熱口燥渴心煩背微惡寒者白虎加人參湯主之張兼善曰白虎專治大煩大渴大燥大熱之證惟恐表證未罷而早用之若背微惡寒及時時惡風二條因其中煩渴燥熱已甚非白虎不能遏也沈堯封曰背為陽背微惡寒者陽虛證也但陽有不同真水真火是腎中之陰陽也氣血是營衛之陰陽也此條口燥渴心煩則暍熱內熾仍是白虎證惟暍熱傷其衛氣致背微惡寒故加人參補其衛也至若少陰病口中和其背惡寒者則衛陽與腎陽並傷故人參與附子並用以兩補之也雄按吳鶴皋云背微惡寒者但覺微寒而不甚也既有燥渴則白虎加參用可無疑若背惡寒而不燥渴者不可用也余謂以下條參之必有汗故可用也傷寒脈浮發熱無汗其表不解者不可與白虎湯渴欲飲水無表證者白虎加人參湯主之沈堯封曰此承上文言煩渴背惡寒固當用白虎加人參湯但亦有中暍而外復傷風寒亦能令惡寒發熱脈浮更當於有汗無汗上辨表證解不解以定此方之可用不可用耳傷寒病若吐下後七八日不解熱結在裡表裡俱熱時時惡風大渴舌上乾燥而煩欲飲水數升者白虎加人參湯主之張路玉曰詳此條表證比前較重何以亦用白虎加參耶本文熱結在裡表裡俱熱二句已自酌量惟熱結在裡所以表熱不除邪火內伏所以惡風大渴舌燥而煩欲飲水不止安得不以生津解熱為急耶雄按御纂醫宗金鑑正誤篇時時惡風作時汗惡風當遵之又沈亮宸云舌乾且燥謂視之無液也然則溫熱之審舌苔以察津液仲師已逗其倪矣太陽中暍者身熱疼重而脈微弱此以夏月傷冷水水行皮中所致也一物瓜蒂湯主之皇甫士安曰脈盛身寒得之傷寒脈虛身熱得之傷暑蓋寒傷形而不傷氣所以脈盛熱傷氣而不傷形所以脈虛雄按所云身寒者雖發熱而仍惡寒不似暑熱病之喜涼惡熱也朱奉議曰夏月發熱惡寒頭痛身體肢節痛重其脈洪盛者熱病也夏月自汗惡寒身熱而渴其脈微弱者中暑也雄按此注之熱病乃夏至後所發之伏邪也內經亦謂之暑病中暑者夏月外感之熱病亦曰中暍病有內外之殊脈有洪微之別是微弱本暍脈惟身重為濕候後條雖亦身重而口開齒燥暑熱內熾已極似宜急與甘寒救液也方中行曰夏日則飲水人之常事而曰傷何哉良由暑迫飲之過多或得之冷水澡洗暑反入內也張路玉曰此條言因熱傷冷之病乃中暍之變證喻氏謂無形之熱傷其肺金則用白虎加人參湯以救之有形之濕傷於肺金則用瓜蒂湯救之各有所主也太陽中暍者發熱惡寒身重而疼痛其脈弦細芤遲小便已洒洒然毛聳手足逆冷小有勞身即熱口開前板齒燥若發汗則惡寒甚加溫針則發熱甚數下之則淋甚成聊攝曰病有在表者有在裡者有表裡俱病者此則表裡俱病者也發熱惡寒身重疼痛者表中暍也脈弦細芤遲者中暑脈虛也小便已洒洒然毛聳手足逆冷者太陽經氣不足也小有勞身即熱者謂勞動其陽而暍即發也口開前板齒燥者里有熱也雄按即此一端可見其為熱熾津枯之候雖身重惡寒豈可再投清暑益氣湯五苓散藿香正氣丸等辛溫燥烈以重劫其陰液乎東垣虛谷之言貽誤後人不淺內經云因於暑汗煩則喘喝口開謂喘喝也以喘喝不止故前板齒燥若發汗以去表邪則陽氣外虛故惡寒甚若以溫針助陽則火熱內攻故發熱甚若下之以除裡熱則內虛而膀胱燥故淋甚雄按觀此治法之三禁則仲景雖未立方而甘涼撤熱存津之當用已可不言而喻矣趙氏方氏主用白虎加人參湯殆從三陽合病比例而出似亦近理沈堯封曰此言精氣素虧而中暍者傷寒脈結代心動悸者炙甘草湯主之一名復脈湯脈按之來而緩時一止復來者名曰結又脈來動而中止更來小數中有還者反動名曰結陰也脈來動而中止不能自還因而復動者名曰代陰也得此脈者必難治方中行曰脈結代而心動悸者虛多實少譬如寇欲退散主弱不能遣發而反自彷徨也復脈乃覈實義之名然則是湯也必欲使虛者加進而馴至於實則實者自退散而還復於元之義也喻嘉言曰脈者氣血之先仲景於津液內亡之脈名之曰結陰代陰又名無陽原有至理何可不知聊為四言俚句以明其義胃藏津液水穀之海內充臟腑外灌形骸津多脈盛津少脈衰津結病至津竭禍來脈見微弱宜先建中汗則津越下則津空津耗脈細不可妄攻小便漸減大便自通陽明內實急下救焚少緩須臾津液無存陽明似實稍用調承驅熱存津此法若神腎中真陽陰精所裁胃中真陽津液所胎陰枯津盛冽泉可溉陰精衰薄瓶罄罍哀何謂結陰無陽脈闔何謂代陰無陽脈奪經揭無陽津液欲竭較彼亡陽天地懸闊沈堯封曰此論精氣素虧而感微邪之治前節有脈證而無方治此未必即是前節主方然觀方中藥又寧必不可以治前證脈浮而芤浮為陽芤為陰浮芤相搏胃氣生熱其陽則絕方中行曰浮為氣上行故曰陽芤為血內損故曰陰胃中生熱者陰不足以和陽津液干而成枯燥也雄按沈氏云浮為邪芤為陰血虛以餘論之凡見浮芤相搏之脈多是暑熱傷津沈堯封曰衛氣為陽人之所知也津液為陽人之所未知也經云上焦出氣宣五穀味熏膚充身澤毛若霧露之溉是謂氣衛氣即津液也故在外之津液少則曰無陽不能作汗在內亡津液則曰陽絕於里要之言陽也即言衛氣也即言津液也仲景濕溫篇太陽病關節疼痛而煩脈沉而細者此名濕痹其候小便不利大便反快但當利其小便沈堯封曰傷寒論原序云撰用素難當即以素難釋之難經傷寒有五即素問寒暑燥濕風之五氣為病也故仲景於太陽論中五證並列挨次剖析此論濕痹即難經之濕溫證也素問在天為濕在地為土濕乃土之氣也故濕為五氣之一濕溫乃傷寒有五之一編傷寒者以濕暍為非傷寒置之別論然則中風亦非傷寒何以獨存卷首耶難經云濕溫之脈陽濡而弱陰小而急與此稍異又曰傷寒既以頭痛胃實等項分六經即以汗字判風寒渴字認燥熱小便不利認濕氣縱橫辨別邪無遁形矣讀者當於此等著實處留心濕家之為病一身盡疼發熱身色如熏黃倪沖之傷寒匯言此濕家為病之總綱也金錦蓋體氣素以濕為事者是為濕家條辨其痛與痹痛不同濕在關節而疼故曰痹今一身盡疼而表有熱故聊攝稱曰在經熏黃與橘子黃同是濕熱彼以熱勝者黃而明此以濕勝者黃而晦宜茵陳五苓散主之海藏以熏黃為陰黃蓋既濕勝則次傳寒中小便自利者有之雄按此由但清其熱不治其濕故次傳寒中朮附湯主之折衷沈堯封曰丹溪云如造麴然濕熱鬱久則發黃也雄按濕熱發黃名曰黃疸皆是暴病故仲景以十八日為期其餘所因甚多有谷疸酒疸女勞疸黃汗及冷汗便溏氣虛之陰黃身面浮腫睛白能餐勞倦之弱黃神志不足卒受恐嚇膽氣外泄之驚黃肝木橫肆脾胃傷殘土敗而色外越之痿黃皆與暴病不同不可概目為濕熱病矣濕家其人但頭汗出背強欲得被複向火若下之早則噦胸滿小便不利舌上如苔者以丹田有熱胸中有寒渴欲得水而不能飲則口燥煩也尤在涇曰寒濕居表陽氣不得外通而但上越為頭汗出為背強欲得被覆向火是宜用溫藥以通陽不可與攻法以逐濕乃反下之則陽更被抑而噦乃作矣或上焦之陽不布而胸中滿或下焦之陽不化而小便不利隨其所傷之處而為病也舌上如苔者本非胃熱而舌上津液燥聚如苔之狀實非苔也蓋下後陽氣反陷於下而寒濕仍聚於上於是丹田有熱而渴欲得水胸中有寒而復不能飲則口舌燥煩而津液乃聚耳雄按胸中有寒之寒字當作痰字解胸中有痰故舌上如苔其津液為痰所阻故口燥煩而痰飲乃水之凝結故雖渴而不能飲也楊云此注極明確凡傷寒論言胸中有寒者俱作痰解濕家下之額上汗出微喘小便利者死若下利不止者亦死尤在涇曰濕病在表者宜汗在裡者宜利小便苟非濕熱蘊積成實未可遽用下法楊云濕證不可妄下額汗出微喘陽已離而上行小便利下利不止陰複決而下走陰陽離決故死一作小便不利者死謂陽上浮而陰不下濟也亦通雄按張石頑云自此而推之雖額汗出微喘若大小便不利者是陰氣未脫而陽之根猶在也下雖大小便利若額上無汗不喘是陽氣不越而陰之根猶在也則非離決可以隨其虛實而救之至於下利不止雖無頭汗喘逆陽氣上脫之候亦死亦有下利不止小便反閉而額上汗出者謂之關經云關格不通頭無汗者可活有汗者死問曰風濕相搏一身盡疼痛法當汗出而解值天陰雨不止醫云此可發汗汗之病不愈者何也答曰發其汗汗大出者但風氣去濕氣在是故不愈也若治風濕者發其汗但微微似欲汗出者風濕俱去也汪按古人即表汗亦須有節度如此奈何近人必令其汗又欲令其多耶此與傷寒論桂枝湯下語亦可互參倪沖之傷寒匯言濕家不惟不可誤下亦不可誤汗惟風濕相搏一證郊倩風從前來濕傷卑下兩至搏擊一身盡為疼痛子繇此是微挾表邪法當汗出而病方解郊倩然時值淫雨隱菴不免濕氣盛行純一醫云此可發汗若發大汗而病不愈不惟風濕之邪不解而且傷真氣矣郊倩況風之乘罅也速濕之侵人也漸子繇然風在外而濕在內且大汗出而漬衣被汗轉為濕風氣雖去而濕氣仍隱伏而存留是故不愈也純一使之微微似欲汗出則正氣宣發充身澤毛若霧露之灌溉與病相應斯正氣行而邪氣卻營衛和而風濕並解矣忠可章虛谷曰治風濕者必通其陽氣調其營衛和其經絡使陰陽表裡之氣周流則其內濕隨三焦氣化由小便而去表濕隨營衛流行化微汗而解陰濕之邪既解風邪未有不志者若大發其汗陽氣奔騰風為陽邪隨氣而泄濕邪陰滯故反遺留而病不愈也此治風濕與治風寒不同者雖寒濕同為陰邪而寒清濕濁清者易散濁者黏滯故汗法大有區別也濕家病身疼痛發熱面黃而喘頭暈鼻塞而煩其脈大自能飲食腹中和無病病在頭中寒濕故鼻塞內藥鼻中則愈章虛谷曰此所謂霧露清邪中於上也三陽經脈上頭而行於身表頭中寒濕則表氣不宣故身疼發熱肺開竅於鼻而行氣於皮毛邪從鼻入濕遏其陽而上蒸則面黃氣閉則喘氣壅則頭痛鼻塞而煩皆肺氣窒塞不得下降故脈反大其與濕中於下而在陰之脈沉細者迥不同也肺通喉胃通咽邪在肺不在胃故自能飲食腹中和無病止頭中寒濕故鼻塞當用辛香苦泄之藥納鼻中如近世之痧藥雄按鼻菸亦可用古人惟用瓜蒂散使肺氣通達其濕邪化水從鼻中出則愈汪按瓜蒂末嗅則水從鼻出若湯飲則吐傷寒瘀熱在裡身必發黃麻黃連翹赤小豆湯主之章虛谷曰表邪未解濕熱內瘀身必發黃故以麻黃解表連翹赤豆等味利肺氣以清濕熱其邪在經絡故從表解之雄按余治夏月濕熱發黃而表有風寒者本方以香薷易麻黃輒效楊云夏月用香薷與冬月用麻黃其理正同傷寒身黃發熱者梔子柏皮湯主之尤在涇曰此熱瘀而未實之證熱瘀故身黃熱未實故發熱而腹不滿梔子徹熱於上柏皮清熱於下而中未及實故須甘草以和之耳沈堯封曰梔柏湯清熱利小便治濕熱之主方也程扶生以麻黃小豆湯為濕熱主方不思麻黃小豆湯發汗之方惟外兼風寒者宜之梔柏湯利小便之方也楊云分析極清若以麻連小豆湯為主方不惟梔柏湯無著落即論內但當利小便句亦無著落傷寒七八日身黃如橘子色小便不利腹微滿者茵陳蒿湯主之尤在涇曰此則熱結在裡之證也身黃如橘子色者色黃而明為熱黃也若陰黃則色黃而晦矣熱結在裡為小便不利腹滿故宜茵陳蒿湯下熱通瘀為主也陽明病發熱汗出此為熱越不能發黃也但頭汗出身無汗劑頸而還小便不利渴飲水漿者此為瘀熱在裡身必發黃茵陳蒿湯主之尤在涇曰熱越熱隨汗而外越也熱越則邪不蓄而散安能發黃哉若但頭汗出而身無汗劑頸而還則熱不得外達小便不利則熱不得下泄而又渴飲水漿則其熱之蓄於內者方熾而濕之引於外者無已濕與熱合瘀郁不解則必蒸發為黃矣茵陳蒿湯苦寒通泄使病從小便出也陽明病面合赤色不可攻之攻之必發熱色黃小便不利也沈堯封曰此是寒邪外束之濕溫證也麻連小豆湯是其主方除卻惡寒即是梔柏證更加腹微滿即是茵陳蒿證章虛谷曰上明發黃之證此又明致黃之由也面赤者熱鬱在經當以汗解若攻之傷其腑氣則在經之熱反從內走與水穀之氣鬱蒸發黃三焦閉塞而小便不利也陽明病無汗小便不利心中懊憹者身必發黃章虛谷曰雖未誤下而無汗小便不利其邪熱閉結心中懊憹與胃中水液鬱蒸而身必發黃也陽明病被火額上微汗出小便不利者必發黃喻嘉言曰濕停熱鬱而誤火之則熱邪愈熾津液上奔額雖微汗而周身之汗與小便愈不可得矣發黃之變安能免乎仲景疫病篇山陰陳坤載安注寸口脈陰陽俱緊者法當清邪中於上焦濁邪中於下焦清邪中上名曰潔也濁邪中下名曰渾也陰中於邪必內慄也表氣微虛裡氣不守故使邪中於陰也陽中於邪必發熱頭痛項強頸攣腰痛脛酸所謂陽中霧露之氣故曰清邪中上濁邪中下陰氣為慄足膝逆冷便溺妄出表氣微虛裡氣微急三焦相溷內外不通上焦怫鬱臟氣相熏口爛食斷也中焦不治胃氣上衝脾氣不轉胃中為濁營衛不通血凝不流若衛氣前通者小便亦黃與熱相搏因熱作使遊於經絡出入臟腑熱氣所過則為癰膿若陰氣前通者陽氣厥微陰無所使客氣入內嚏而出之聲嗢咽塞寒厥相逐為熱所擁血凝自下狀如豚肝陰陽俱厥脾氣孤弱五液注下下焦不闔清便下重令便數難臍築湫痛命將難全此一節言受疫之源疫者即寒暑燥濕風夾雜而成清濁不分三焦相溷其曰中上中下者是就邪之清濁而言曰陰中陽中者亦即邪之中上中下而言扼要全在中焦得治為主中焦者脾胃是也脾胃之氣有權若衛氣前通者邪可從經而汗解若營氣前通者邪可從腑而下解倘脾胃之氣不足邪必內陷傷臟五液注下便難臍痛命將難全矣為癰膿下豚肝指其重者而言未必定當如是也所以疫證最怕邪伏募原內壅不潰為難治傷寒脈陰陽俱緊惡寒發熱則脈欲厥厥者脈初來大漸漸小更來漸漸大是其候也楊云疫病乃穢邪瀰漫其脈恆模糊不清此所云漸漸大漸漸小正其候也如此者惡寒甚者翕翕汗出喉中痛熱多者目赤脈多睛不慧楊云凡疫證目睛必不了了醫復發之咽中則傷若復下之則兩目閉寒多者便清穀熱多者便膿血若熏之則身發黃若熨之則咽燥若小便利者可救之小便難者為危殆此節言疫邪初起之證與脈也陰陽俱緊惡寒發熱與傷寒同而漸小漸大之厥脈是疫之所異也因邪氣深伏正氣不得宣通所以先必惡寒而甚則又形熱狀汗出喉痛目赤也若因惡寒而發汗則助熱上蒸而咽傷若因內熱而下之則陽氣內陷而目閉陰邪多則便清穀陽邪多則便膿血熏之則濕熱鬱蒸而身黃熨之則熱燥津液而咽燥總因邪伏募原故汗下熏熨皆誤也其可救與不救當於小便利不利驗之也楊云溫病小便利則陰氣未竭疫證小便利則腑氣尚通邪有出路故俱可治傷寒發熱頭痛微汗出發汗則不識人熏之則喘不得小便心腹滿下之則短氣小便難頭痛背強加溫針則衄此節言清邪之中上者故陽分之證居多清邪中上直入募原也其發熱頭痛微汗為邪熱熏蒸非在表也故發汗則熱盛而神昏楊云汗為心液過汗則心虛而邪蔽清陽熏之則熱壅而作喘楊云熏之則以熱益熱而傷水之上源不得小便心腹滿者氣不通也亦非在裡短氣小便難頭痛背強者下傷津液也衄者溫針傷絡也楊云邪熱入營故衄治當先達募原不致此變傷寒發熱口中勃勃氣出頭痛目黃衄不可制貪水者必嘔楊云水積而不運故嘔惡水者厥楊云熱盛而無制故厥若下之咽中生瘡楊云熱遺於上故生瘡假令手足溫者必下重便膿血楊云四末屬脾溫則熱邪充斥脾胃故下膿血頭痛目黃者若下則兩目閉楊云溫邪非盪滌所能驅而反虛其正故目閉貪水者脈必厥其聲嚶咽喉塞楊云亦水積泛溢之象若發汗則戰慄陰陽俱虛楊云邪在裡不在表汗之則徒虛其表惡水者若下之則里冷不嗜食大便完穀出楊云惡水則濕盛熱微下之則傷其中氣若發汗則口中傷舌上白苔楊云津液外竭則穢邪上蒸煩躁脈數實楊云熱盛於內不大便六七日後必便血若發汗則小便自利也楊云太陽膀胱主津液汗之則正虛而不能約束此節言濁邪之中下者故陰分之證居多濁邪中下者非下受也仍從募原分布謂陰邪歸陰也邪並於陰則陰實陽虛故有勃勃氣出頭痛目黃衄不可制貪水咽瘡下重便膿血諸證此陰實也其目閉脈厥聲嚶咽塞戰慄不嗜食大便完穀小便自利者此陽虛也實為真實虛為假虛故非偏陰偏陽可治病人無表裡證發熱七八日雖脈浮數者可下之假令已下脈數不解合熱則消穀善飢至八七日不大便者有瘀血也宜抵當湯若脈數不解而下利不止必協熱而便膿血也此疫邪之分傳者病無表裡證邪在募原此指初起而言脈數者熱盛於內也浮者熱蒸於外也發熱七八日而不從汗解其內熱已深故曰可下此指見在而言假令已下是指下後言也若下後脈數不解熱傳於陽則消穀善飢為衛氣前通也熱傳於陰必傷血成瘀為營氣前通也宜抵當湯即下如豚肝之類若脈數不解而下利便膿血者已成脾氣孤絕五液注下為不治之證也勿作尋常協熱利看病在陽應以汗解之反以冷水潠之若灌之其熱被卻不得去彌更益煩肉上粟起意欲飲水反不渴者服文蛤散楊云此條溫熱俱有之不獨疫病若不瘥者與五苓散寒實結胸無熱證者與三物小陷胸湯白散亦可服此疫邪之傳表者卻字疑是劫字之誤徐亞枝云卻不得前也熱被冷抑不得外出轉而內攻故彌更益煩卻字似非誤楊云是文蛤散當屬文蛤湯病在陽者謂疫邪已傳陽分也傳於陽當從汗解潠噴也灌溉也疫邪熱極原可飲冷水得大汗而解者乃以之潠灌皮毛內熱被冷水外劫故內煩益甚肉上粟起也欲飲而不渴者內熱為外水所制也文蛤性寒氣燥合之麻杏石甘去外水而清內熱五苓散亦具利水徹熱之功小陷胸湯及亦可服七字疑衍傷寒噦而腹滿視其前後知何部不利利之則愈此疫邪之傳裡者噦在傷寒多寒在疫證為熱況見有腹滿前後不利可據其為邪氣壅蔽無疑前後二便也利二便即疏里法也得病六七日脈遲浮弱惡風寒手足溫醫二三下之不能食而脅下滿痛面目及身黃頸項強小便難者與柴胡湯後必下重本渴而飲水嘔者柴胡湯不中與也食谷者噦此疫邪之越於三陽者得病六七日惡風寒而脈浮弱非表虛也手足溫而脈遲非裡寒也合之為疫邪內伏不潰之證醫者重於疏里乃二三下之不能食小便難不無傷中而脅下滿痛少陽也面目及身黃陽明也頸項強太陽也邪已越於三陽斯時但於清解熱毒劑中按經據證略加引經達表之藥足矣若拘於脅痛為少陽與柴胡湯參甘薑棗錮蔽疫邪必下重作利也若先渴後嘔為水飲內停非少陽喜嘔柴胡湯必不可與食谷者噦亦屬邪蔽使然非內寒也末句之義似有脫簡太陽病未解脈陰陽俱停先必振慄汗出而解但陽脈微者先汗出而解但陰脈微者下之而解若欲下之宜調胃承氣湯此疫邪之越於太陽者太陽病不解系疫邪浮越非太陽經病也停勻也脈陰陽俱停是尺寸浮沉遲速大小同等也其正氣有權足以化邪故從汗解振慄者戰汗也脈微謂邪氣衰也陽邪先退先從汗解陰邪先退先從下解汗法不一而下法宜調胃承氣以疫邪雖熱不必盡實也太陽病下之而不愈因復發汗以此表裡俱虛其人因致冒冒家汗出自愈所以然者汗出表和故也得里未和然後下之此言疫邪傳表先下後汗之誤疫邪達表當從汗解乃拘於疏里而先下之徒虛其里故不愈因復發汗是又虛其表故汗出而作冒也必俟表氣已和再和裡氣疫證汗後往往有宜下者有下後必汗出而始解者總由邪氣分傳而無一定之治法也太陽病下之其脈促不結胸者此為欲解也脈浮者必結胸也脈緊者必咽痛脈弦者必兩脅拘急脈細數者頭痛未止脈沉緊者必欲嘔脈沉滑者協熱利脈浮滑者必下血此言疫邪誤下之變治疫雖宜疏里但既越於太陽自當從表一誤下之其變有不可勝言者促為陽盛下之必致結胸不結者陽邪外散也為欲解浮為在表下之則內陷為結胸緊為邪實下之則邪上浮為咽痛弦者挾風下之則引風入肝故兩脅拘急細數者熱鬱於內也下之則邪火上衝故頭痛未止沉緊多飲下之必動其飲故欲嘔沉滑者熱為濕滯也下之則濕熱下流故協熱利浮滑者熱盛於表也下之則熱邪內攻故下血陽毒之為病面赤斑斑如錦紋咽喉痛唾膿血五日可治七日不可治升麻鱉甲湯主之陽毒者疫邪犯於陽分也陽邪上壅故面赤熱極傷血故遍體斑斑如錦紋也咽喉痛唾膿血皆邪熱爍津有立時腐敗之勢五日經氣未周毒猶未遍故可治七日則邪氣遍而正氣消矣故曰不可治方用升麻鱉甲者所以解陽分之毒即所以救陰分之血也陰毒之為病面目青身痛如被杖咽喉痛五日可治七日不可治升麻鱉甲湯去雄黃蜀椒主之陰毒者疫邪入於陰分也陰中於邪故面目青邪閉經絡故身痛如被杖咽喉痛者陰分熱毒上壅也故其日數與陽經同而治法原方去雄黃蜀椒者陰分已受熱邪不堪再用熱藥也雄按王安道云陰者非陰寒之病乃感天地惡毒異氣入於陰經故曰陰毒耳後人謂陰寒極盛稱為陰毒引仲景所敘面目青身痛如被杖咽喉痛數語卻用附子散正陽散等藥竊謂陰寒極盛之證固可名為陰毒然終非仲景所以立名之本意後人所敘陰毒與仲景所敘陰毒自是兩般豈可混論蓋後人所敘陰毒是內傷生冷或暴寒所中或過服寒涼藥或內外俱傷於寒而成非天地惡毒異氣所中也又趙養葵云此陰陽二毒是感天地疫癘非常之氣沿家傳染所謂時疫也又按雄黃蜀椒二物用治陽毒解者謂毒邪在陽分以陽從陽欲其速散也余謂雄黃尚屬解毒之品用之治毒理或有之至蜀椒豈面赤發斑咽痛唾血所可試乎必有錯簡未可曲為之說也楊云通人之論傷寒論中此類甚多俱不必強作解事也又按倪沖之傷寒匯言附載袁雲龍云仲景之書前敘六經諸條其中文義前後起止多有缺失歷代醫哲並未深勘至於陽毒陰毒二條更可詫異俱用升麻鱉甲湯陰毒但無雄黃蜀椒此坊刻之偽本也宋龐安常陰毒陽毒概用全方陰毒不去椒黃於理稍近余於萬曆乙亥得南陽舊本其陰毒條於去雄黃下作倍蜀椒加半主之於理為是蓋陽毒陰毒二證良由平素將息失宜耗疲精髓逆亂氣血所以卒受山林水澤瘴厲惡氣所中感而成疾余當壯年北遊燕邸以及遼陽之外南遊閩廣黔甸以及交阯之區大抵南方多陽毒北方多陰毒時醫按法施治曾無一驗中州等處有人患此亦罕能救細按二證俱有咽喉痛三字以余竊論瘍科書有鎖喉風纏喉風鐵蛾纏三證其狀相似有面色赤如斑者有面色青而悽慘者有吐膿血者有身痛如被杖者有氣喘急促者有發譫語煩亂者雖有兼證如此總以咽喉閉痛為苦卒發之間三五日可治至七日不減即無生理豈非陽毒陰毒二證之類乎再察其脈緩大者生細數緊促者死余見此二證不論陽毒陰毒概用喉科方以蓬砂二錢火硝六分米醋一盞薑汁小半盞用鵝翎探入喉中吐痰碗許活者百數據袁公之論則陽毒為陽邪陰毒為陰邪矣陰邪固宜倍蜀椒之半而以蜀椒施之陽邪終嫌未妥改從喉科法引吐卻穩當以余度之陽毒即後世之爛喉痧耳叔和謂之溫毒是已治法忌用溫散宜用清化陳繼宣疫痧草專論此證論曰百合病者百脈一宗悉致其病也意欲食復不能食常默然欲臥不能臥欲行不能行飲食或有美時或有不用得藥則劇吐利如有神靈者身形如和其脈微數每溺時頭痛者六十日乃愈若溺時頭不痛淅淅然者四十日愈若溺快然但頭眩者二十日愈其證或未病而預見或病四五日而出或二十日或一月微見者各隨證治之楊云金匱中論此證最為明顯完善百合病者皆緣時疫新愈其三焦腠理榮衛之交餘熱未清正氣困乏不能流暢如人在雲霧之中倏清倏渾如日月被蝕之後或明或暗故有種種不可名言之狀而其口苦小便赤脈微數乃餘熱的證也病不在經絡臟腑楊云此句欠酌治不能補瀉溫涼惟以清氣為主氣歸於肺而肺朝百脈一宗者統宗於一即悉致其病之謂也溺時頭痛者小便由於氣化水去則火上衝也其病為重六十日愈月再周而陰必復也溺時淅淅然者膀胱腑氣一空表氣亦因之失護也但頭眩者陽氣不能上達也熱漸衰病漸輕故愈日漸速也曰其證指溺時頭痛諸證而言曰未病預見謂未成百合病先見頭痛等證也百合清熱養陰專潤肺氣治以百合即以百合名病也雄按此病仲景以百合主治即以百合名其病其實餘熱逗留肺經之證凡溫暑濕熱諸病後皆有之不必疫也肺主魄魄不安則如有神靈肺失肅清則小便赤百合功專清肺故以為君也楊云前注已平正通達讀此更親切不易覺前注尚隔一層余嘗謂孟英學識前無古人試取其所注與古人所注較論之當知余言之非阿所好也憶辛丑暮春於役蘭溪在嚴州舟次見一女子患此證其父母以為祟也余詢其起於時證之後察其脈數第百合無覓處遂以葦莖麥冬絲瓜子冬瓜皮知母為方汪按百合本治肺之品從此悟入可謂在人意中出人意外矣服之一劑知二劑已百合病見於陰者以陽法救之見於陽者以陰法救之見陽攻陰復發其汗此為逆見陰攻陽乃復下之此亦為逆此推究致百合病之源見於陰者即陰中於邪也陰既受邪不即與陽氣通調則陰邪愈閉法當攻陽以救其陰也見於陽者即陽中於邪也陽既受邪不即與陰氣通調則陽邪不化法當攻陰以救其陽也若不攻陰救陽復發其汗是為見陽攻陽不知攻陽救陰復下之是為見陰攻陰二者均之為逆皆因治不如法陰陽未能透解所以致有百合之病若於百合病中並無汗下之證毋用汗下之法也下之汗吐下皆此意此處陰陽二字但就營衛講不說到氣血臟腑上百合病發汗後者百合知母湯主之得之汗後者其陽分之津液必傷餘熱留連而不去和陽必以陰百合同知母泉水以清其餘熱而陽邪自化也按初病邪重故上節言救言攻此病後餘邪當用和法百合病吐之後者百合雞子黃湯主之其得之吐後者吐從上逆較發汗更傷元氣陰火得以上乘清竅為之矇蔽矣故以雞子黃之純陰養血者佐百合以調和心肺是亦用陰和陽矣百合病下之後者百合滑石代赭湯主之其得之於下後者下多傷陰陰虛則陽往乘之所以有下焦之熱象百合湯內加滑石代赭取其鎮逆利竅以通陽也是謂用陽和陰法百合病不經吐下發汗病形如初者百合地黃湯主之不經吐下發汗正雖未傷而邪熱之襲於陰陽者未必透解所以致有百合病之變也病形如初指百合病首節而言地黃取汁下血分之瘀熱故云大便當如漆非取其補也百合以清氣分之餘熱為陰陽和解法百合病一月不解變成渴者百合洗方主之百合病至一月不解纏綿日久變成渴者津液消耗求水以自滋也渴而不致下消病猶在肺肺主皮毛故以百合湯洗之使毛脈合行精氣於腑也食煮餅假麥氣以助津液勿以鹽豉恐奪津增渴也百合病渴不瘥者栝蔞牡蠣散主之楊云此條證比上條較重雄按尤在涇曰病變成渴與百合洗方而不瘥者熱盛而津液傷也栝蔞根苦寒生津止渴牡蠣鹹寒引熱下行不使上鑠也此注已極該括陳注較遜故從尤本百合病變發熱者百合滑石散主之變發熱者餘邪郁久淫於肌表熱歸陽分也百合清金退熱加滑石以利竅通陽日當微利指小便利言謂熱從小便去也狐蜮之為病狀如傷寒默默欲眠目不得閉臥起不得安蝕於喉為蜮蝕於陰為狐不欲飲食惡聞食臭也其面目乍赤乍黑乍白蝕於上部則聲嗄甘草瀉心湯主之蝕於下部則咽乾苦參湯洗之蝕於肛者雄黃熏之百合病是餘熱留連於氣機者狐蜮病是餘毒停積於幽陰者狐蜮水蟲也原疫邪不外濕熱久留不散積而生蟲顧聽泉云疫邪久留人不活矣久留上宜加餘邪二字喉與二陰為津液濕潤之處故蟲生於此也聲嗄因知其蝕於喉咽乾而知其蝕於陰者因其熱鬱於下津液不能上升也餘熱內郁故狀似傷寒內熱故默默欲眠內煩故目不得閉臥起不安面目乍赤乍黑乍白以熱邪隱見不常非蟲動也苦參雄黃皆燥濕殺蟲之品甘草瀉心不特使中氣運而濕熱自化抑亦苦辛雜用足勝殺蟲之任也略參尤氏病者脈數無熱微煩默默但欲臥汗出初得之三四日目赤如鳩眼七八日目四眥黑若能食膿已成赤豆當歸散主之此疫邪熱毒蘊伏於內也故有脈數身不熱微煩欲臥之證初得之汗出表氣尚通也至三四日目赤如鳩眼熱傷血分也七八日目四眥黑血已腐敗也能食者病不在胸腹膿成於下也赤小豆清熱去濕兼以解毒當歸和血化膿使毒從下解也先輩喻嘉言將辨脈篇中清邪中上焦濁邪中下焦一節為仲景論疫根據可謂獨具隻眼者矣其治法以逐穢為第一義上焦如霧升而逐之兼以解毒中焦如漚疏而逐之兼以解毒下焦如瀆決而逐之兼以解毒此論識超千古雄按林北海亦云喻氏論疫高出千古直髮前人所未發蓋仲景於吐利霍亂等不過感一時冷熱之氣者猶且論及而謂疫病之為流行大毒者反不之及耶然則傷寒論中之必有疫證是非臆說坤學識淺陋不敢妄自蒐羅擾亂經旨但將傷寒金匱中證治與風寒等法不合寓有毒意者均歸之疫雄按守真論溫風逵論暑又可論疫立言雖似創闢皆在仲景範圍內也楊按此篇搜輯甚佳俱古人所未及然原論不可解處甚多其用方與病不相登對處亦有之讀者師其意而於其不可解者勿強事穿鑿則善矣汪按此評大妙如此方不為昔人所愚所謂盡信書不如無書也
