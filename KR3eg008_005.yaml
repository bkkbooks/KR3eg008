body:
  text: 卷五方論甘草湯甘草二兩水三升煮取一升半去滓溫服七合日二服王晉三曰一藥治病是曰奇方徐洄溪曰大甘為土之正味能制腎水越上之火王朴莊曰自靈素至漢晉宋齊諸古方凡云一兩者以今之七分六釐准之凡云一升者以今之六勺七抄准之汪按唐人之方則一兩當古之三兩雄按鞠通凡引古方輒改定其分兩而輕重甚未當也學者審之雄按傷寒類要治傷寒心悸脈結代聖濟總録治舌腫塞口外科精要治一切癰疽諸發及丹石煙火藥發兵部手集治懸癰直指方治痘瘡煩渴及蟲毒藥毒金匱玉函治小兒撮口及小兒羸瘦得效方治小兒遺溺皆以一味甘草為方妙用良多總不外乎養陰緩急清熱化毒也汪按亦兼取和中利水桔梗湯桔梗一兩甘草二兩水三升煮取一升去滓分溫再服鄒潤安曰腎家邪熱循經而上肺不任受遂相爭競二三日邪熱未盛故可以甘草瀉火而愈若不愈是肺竅不利氣不宣泄也以桔梗開之肺竅既通氣遂宣泄熱自透達矣雄按雖以桔梗名湯而倍用甘草以為駕馭後人改稱甘桔湯是矣但須審證而投不可泥為通治咽痛之方也黃錦芳醫案求真嘗論及之醫者不可不知豬膚湯豬膚一斤雄按以豬皮去其肉肥刮如紙薄杭人能造名曰肉鮓可以充饌水一斗煮取五升去滓加白蜜一升白粉五合即是米粉熬香和令相得溫分六服王晉三曰腎應彘而肺主膚腎液下泄不能上蒸於肺致絡燥而為咽痛者又非甘草所能治矣當以豬膚潤肺腎之燥解虛煩之熱白粉白蜜緩中俾豬膚比類而致津液從腎上入肺中循喉嚨復從肺出絡心注胸中而上中下燥邪解矣黃連阿膠湯黃連四兩黃芩一兩芍藥二兩阿膠三兩雞子黃二枚水五升先煮三物取二升去滓內膠煬盡小冷內雞子黃攪令相得溫服七合日三服鄒潤安曰尤氏云陽經之寒變為熱則歸於氣陰經之寒變為熱則歸於血陽經或有歸於血者惟陰經之熱則必不歸於氣故三陰有熱結證不用調胃承氣小承氣而獨用大承氣諸下利證不已必便膿血是其驗也心中煩不得臥熱證也至二三日以上乃心中煩不得臥則非始即屬熱矣始即屬熱心中煩不得臥者為陰虛陰虛則不得瀉火今至二三日以上始見則為陽盛陽盛則宜瀉火然致此陽盛亦必其陰本虛故阿膠芍藥雞子黃無非救陰之品瀉火則惟恃芩連而芩止一兩連乃四兩此黃連之任獨冠一方而為補劑中瀉藥矣豬苓湯豬苓去皮茯苓澤瀉滑石阿膠各一兩水四升先煮四味取二升去滓內阿膠煬消溫服七合日二周禹載曰熱盛膀胱非水能解何者水有止渴之功而無祛熱之力也故用豬苓之淡滲與澤瀉之鹹寒與五苓不異而此易術以膠者彼屬氣此屬血也易桂以滑石者彼有表而此為消熱也然則所蓄之水去則熱消矣潤液之味投則渴除矣鄒潤安曰松之概挺拔徑正楓之概柔弱易搖松之理粗疏楓之理堅細松之葉至冬益蒼翠而不凋楓之葉至冬遂鮮赤而即落是其一柔一剛顯然殊致茯苓屬陽治停蓄之水不從陽化者豬苓屬陰治鼓蕩之水不從陰化者是故仲景以豬苓名方者其所治之證曰少陰病下利咳而嘔渴心煩不得眠者豬苓湯主之若五苓散則其治有渴者有不渴者至茯苓入他方所治之病則不渴者居多蓋渴者水氣被陽逼迫欲得陰和而不能也與之豬苓使起陰氣以和陽化水譬之楓葉已丹遂能即落也大承氣湯厚朴去皮炙八兩枳實炙五枚大黃四兩酒洗芒硝三合水一斗先煎二物取五升去滓內大黃煮取二升去滓內硝更上微火一二沸溫再服得下余勿服鄒潤安曰柯氏云厚朴倍大黃為大承氣大黃倍厚朴為小承氣是承氣者在枳朴應不在大黃矣但調胃承氣湯不用枳朴亦名承氣何也且三承氣湯中有用枳朴者有不用枳朴者有用芒硝者有不用芒硝者有用甘草者有不用甘草者惟大黃則無不用是承氣之名固當屬之大黃況厚朴三物湯即小承氣湯厚朴分數且倍於大黃而命名反不加承氣字猶不可見承氣不在枳朴乎自金元人以順釋承而大黃之功不顯考本經首推大黃通血再以六微旨大論亢則害承乃制之義參之則承氣者非血而何夫氣者血之帥故血隨氣行亦隨氣滯氣滯血不隨之滯者是氣之不足非氣之有餘惟氣滯並波及於血於是氣以血為窟宅血以氣為禦侮遂連衡宿食蒸逼津液悉化為火此時惟大黃能直搗其巢傾其窟穴氣之結於血者散則枳朴遂能效其通氣之職此大黃所以為承氣也雄按此余夙論如此鄒氏先得我心汪按大黃本血分之藥故知此說確不可易白虎湯石膏一斤知母六兩甘草炙二兩粳米六合水一斗煮米熟湯成去滓溫服一升日三服方中行曰白虎者西方之金神司秋之陰獸虎嘯穀風冷涼風酷暑消神於解熱莫如白虎石膏知母辛甘而寒辛者金之味寒者金之性辛甘體寒得白虎之體焉甘草粳米甘平而溫甘取其緩溫取其和緩而且和得伏虎之用焉飲四物之成湯來白虎之嗥嘯陽氣者以天地之疾風名也風行而虎嘯者同氣相求也虎嘯而風生者同聲相應也風生而熱解者物理必至也抑嘗以此合大小青龍真武而論之四物者四方之通神也而以命名蓋謂化裁四時神妙萬世名義兩符實自然而然者也方而若此可謂至矣然不明言其神而神卒莫之掩者君子慎德此其道之所以大也汪按飲四物之成湯以下數行語多支離牽強必宜削去夫白虎湯清熱乃甘雨非涼風也既備四方之神朱鳥一方何以獨缺且熱劑而名真武名與實爽矣醫者不能研究醫理乃附會經義以自文其淺陋甚且衍先天論太極以欺人實則無關於辨證處方也自明以來庸醫陋習大率如此學者戒之白虎加人參湯原方加人參三兩煮服同前法鄒潤安曰傷寒脈浮發熱無汗其表不解者不可與白虎湯汪按洄溪云無汗二字最為白虎所忌渴欲飲水無表證者白虎加人參湯主之可見白虎加人參湯之治重在渴其時時惡風則非常常惡風矣背微惡寒則非遍身惡寒矣常常惡風遍身惡寒者謂之表證也時時惡風背微惡寒者表邪已經化熱特尚未盡耳謂之無表證可也然熱邪充斥津液消亡用栝蔞根生津止渴可也何以必用人參靈樞決氣篇腠理發泄汗出溱溱是謂津津為水陰屬也能外達上通則陽矣夫是之謂陰中之陽人參亦陰中之陽惟其入陰故能補陰惟其為陰中之陽故能入陰使人陰中之氣化為津不化為火是非栝蔞根可為力矣雄按朱奉議云再三汗下熱不退者以此湯加蒼朮一錢如神黃芩湯黃芩三兩甘草炙芍藥各二兩大棗十二枚水一斗煮取三升去滓溫服一升日再夜一服鄒潤安曰或問黃芩湯治何等證其證腹痛與否若腹痛何以用黃芩若腹不痛何以用芍藥汪按腹痛因乎熱者甚多謂腹痛必因寒者前人拘滯之見也曰其證身熱不惡風亦不惡熱或下利或嘔腹則不痛蓋芍藥甘草大棗桂枝湯里藥也以不惡風故不用薑桂黃芩甘草大棗小柴胡里藥也以不往來寒熱故不用柴胡以其常熱故不用人參若不嘔則並不用半夏生薑至芍藥則並不因腹痛而用以桂枝湯證原無腹痛也亦不心下痞硬故不去大棗也又厥陰篇云傷寒脈遲與黃芩湯除其熱腹中則冷不能食可知黃芩湯證之脈必數黃芩所治之熱必自里達外不治但在表分之熱矣然仲景用黃芩有三耦焉氣分熱結者與柴胡為耦血分熱結者與芍藥為耦濕熱阻中者與黃連為耦以柴胡能開氣分之結不能泄氣分之熱芍藥能開血分之結不能清迫血之熱黃連能治濕生之熱不能治熱生之濕譬之解鬥但去其鬥者未平其致鬥之怒鬥終未已也故黃芩協柴胡能清氣分之熱協芍藥能泄迫血之熱協黃連能解熱生之濕也汪按前人方解不過望文生義必如鄒氏諸條始覺有味可咀矣黃芩加半夏生薑湯原方加半夏半升生薑三兩煮服法同前鄒潤安曰嘔而脈數口渴者為火氣犯胃不宜加此雄按章虛谷云生薑性熱僅能治寒不可泛施於諸感也汪按傷寒一百十三方用姜者五十七則此味原非禁劑然溫暑證最宜慎用用之不當或致殺人洄溪謂雖與芩連同用亦尚有害是也又古時未有炮製之法凡方用半夏無不兼用姜者義取製半夏之毒其所以治病者功在半夏不在姜也今所用半夏必先已薑製可不必兼用姜矣後人不察但見古方用姜者不少遂不論何證隨手妄施其中必有誤人而不自覺者戒之梔子豉湯梔子十四枚香豉四合綿裹水四升先煮梔子得二升半內豉煮取升半去滓分為二服溫進一服得吐止後服徐洄溪曰此劑分兩最小凡治上焦之藥皆然按此湯加減七方既不注定何經亦不專治何誤總由汗吐下之後正氣已虛尚有痰涎滯氣凝結上焦非汗下之所能除雄按溫暑濕熱之證每有痰涎滯氣凝結上焦不必在汗吐下後也既非汗下可除尤忌妄投補劑經所云在上者因而越之則不動經氣而正不重傷此為最便乃不易之法也古方梔子皆生用故入口即吐後人作湯以梔子炒黑不復作吐全失用梔子之意然服之於虛煩證亦有驗想其清肺除煩之性故在也汪按欲取吐者必宜生用一物瓜蒂湯瓜蒂二個銼水一升煮取五合去滓頓服尤在涇曰暑之中人也陰虛而多火者暑即寓於火之中為汗出而煩渴宜白虎加人參以清熱生陰陽虛而多濕者暑即伏於濕之內為身熱而疼重故暑病恆以濕為病而治濕即所以治暑瓜蒂苦寒能吐能下去身面四肢水氣水去而暑無所依將不治而自解矣此治中暑兼濕者之法也炙甘草湯一名復脈湯甘草四兩炙生地黃一斤麥冬麻仁各半斤桂枝生薑各三兩人參阿膠各二兩大棗三十枚方中行曰地黃上不當有生字清酒七升水八升先煮八味取三升去滓內膠煬消盡溫服一升日三沈亮宸曰此湯為千古養陰之祖方也鄒潤安曰地黃分數獨甲於炙甘草湯者蓋地黃之用在其脂液能榮養筋骸經脈乾者枯者皆能使之潤澤也功能復脈故又名復脈湯脈者原於腎而主於心心血枯槁則脈道泣澀此傷寒論所以脈結代與心動悸並稱金匱要略又以脈結悸與汗出而悶並述至肺痿之心中溫溫液液涎唾多則陰皆將盡之孤注陽僅膏覆之殘焰惟此湯可增其殼內絡外之脂液也瓜蒂散瓜蒂熬黃赤小豆各一分汪按赤小豆乃小粒赤豆俗名米赤者是也勿誤用相思子各別篩為散已合治之取一錢匕以香豉一合用熱湯七合煮作稀糜去滓取汁和散溫頓服之不吐者少少加得快吐為止諸亡血虛家不可與之盧子繇曰瓜象實在須蔓間也蒂瓜之綴蔓處也性遍蔓延末繁於本故少延輒腐爾雅云其紹瓞疏云繼本曰紹形小曰瓞故近本之瓜常小近末之瓜轉大也凡實之吮抽津液惟瓜稱最而吮抽津液之樞惟蒂是以瓜蒂具徹下炎上之用乃蒂味苦而瓜本甘以見中樞之所以別於上下內外誠湧泄之宣劑通劑也麻黃連軺赤小豆湯麻黃連軺甘草炙生薑各二兩赤小豆生梓白皮各一升杏仁四十個大棗十二枚潦水一斗先煮麻黃再沸去上沫內諸藥煮取三升分溫三服半日服盡鄒潤安曰本經臚列連翹之功以寒熱起以熱結終此條瘀熱在裡句適與連翹功用不異郭景純爾雅注一名連苕苕軺聲同字異耳而今本傷寒論注曰連軺即連翹根遂以本經有名未用翹根當之陶隱居云方藥不用人無識者故唐本草去之豈仲景書有此六朝人皆不及見至王海藏忽見之耶噫亦必無之事矣梔子柏皮湯梔子十五枚黃柏二兩甘草一兩水四升煮取升半去滓分溫再服鄒潤安曰梔子大黃湯茵陳蒿湯大黃硝石湯梔子柏皮湯證其標皆見於陽明陽明者有在經在腑之分發熱汗出懊憹皆經證也腹滿小便不利皆腑證也梔子大黃湯證經多而腑少茵陳蒿湯證有腑而無經梔子柏皮湯證有經而無腑大黃硝石湯證經少而腑多雄按金鑑云此方之甘草當是茵陳蒿必傳寫之訛也茵陳蒿湯茵陳蒿六兩梔子十四枚大黃二兩水一斗先煮茵陳減六升內二味煮取三升去滓分溫三服小便當利溺如皂角汁狀色正赤一宿腹減病從小便去也徐洄溪曰先煮茵陳則大黃從小便出此祕法也鄒潤安曰新感之邪為素有之熱結成黃疸此證已所謂因陳矣故傷寒金匱二書幾若無疸不因陳者然梔子柏皮湯證有外熱而無裡熱麻黃連翹赤小豆湯證有裡熱而無外熱小建中湯證小便自利小柴胡湯證腹痛而嘔小半夏湯證小便色不變而噦桂枝加黃耆湯證脈浮梔子大黃湯證心中懊憹硝石礬石散證額上黑日晡發熱則內外有熱但頭汗出齊頸而還腹滿小便不利口渴為茵陳蒿湯證矣第腹滿之治在大黃內熱之治在梔子惟外復有熱但頭汗出小便不利始為茵陳的治其所以能治此者以其新葉因陳干而生清芬可以解鬱熱苦寒可以泄停濕也蓋陳干本能降熱利水復加以葉之如絲如縷挺然於暑濕蒸逼之時先草木而生後草木而凋不必能發散而清芳揚溢氣暢不斂則新感者遂不得不解自是汗出不止於頭矣故曰發熱汗出此為熱越不能發黃也抵當湯水蛭熬虻蟲去翅足熬桃仁去皮尖各三十個大黃三兩酒浸上為末以水五升煮取三升去滓溫服一升不下再服徐洄溪曰凡人身瘀血方阻尚有生氣者易治阻之久則無生氣而難治蓋血既離經與正氣全不相屬投以輕藥則拒而不納藥過峻又能傷未敗之血故治之極難水蛭最喜食人之血而性又遲緩善入遲則生血不傷善入則堅積易破借其力以攻積久之滯自有利而無害也雄按王肯堂云人溺蜂蜜皆制蛭毒章虛谷曰經言陽絡傷則血外溢陰絡傷則血內溢外溢則吐衄內溢則便血蓋陰陽手足十二經交接皆由絡貫通接連細絡分布周身而血隨氣行必由經絡流注表裡循環是故絡傷則血不能循行隨陰陽之部而溢出其傷處即瘀阻阻久而蓄積無陽氣以化之乃成死血矣故仲景用飛走蟲藥引桃仁專攻絡結之血大黃本入血分再用酒浸使其氣浮隨蟲藥循行表裡以導死血歸腸腑而出豈非為至妙至當之法哉由是類推失血諸證要必以化瘀調經絡為主矣余每見有初治即用呆補之法使瘀結絡閉不能開通終至於死良可慨也雄按王清任論虛勞亦主瘀阻蓋本大黃䗪蟲丸之義而言也文蛤散文蛤五兩為散以沸湯和一錢匕服湯用五合文蛤湯文蛤石膏各五兩麻黃甘草生薑各三兩杏仁五十粒大棗十二枚水六升煮取二升溫服一升汗出即愈鄒潤安曰文蛤即海蛤之有紋理者吳人謂之花蛤雄按王晉三云若黯色無紋者服之令人狂走赴水夏小正季秋之月雀入於海為蛤安氏云雀羽蟲也羽蟲屬火火炎上故鳥上飛曷為入海而為蛤蓋九月火伏於戌十月純陰金水之令故羽蟲感之而化也蛤屬水水性下故下潛秋冬水勝火雀為蛤象火之伏於水也又離為火為雉為蚌雀雉之類蛤蚌之類外剛內柔皆離之變化也因而思傷寒論反以冷水潠灌之證非火厄於水而何金匱要略吐後渴欲得水之條非火之溺於水而何惟其火在水中而病故以火入水中而生者治之然厄於水者惡水惡水則火與水未相浹也故直以是使水中之火仍暢茂得生而可已溺於水者喜水喜水則火與水漸相浹矣故必合麻杏甘膏加薑棗以清發之乃能已也五苓散澤瀉一兩六銖豬苓茯苓白朮各十八銖方中行曰術上不當有白字雄按二十四銖為一兩每銖重四分二釐弱六銖為錙即二錢五分十八銖即七錢五分也桂枝半兩為末以白飲和服方寸匕日三多服暖水汗出愈沈果之曰中風發熱六七日不解而煩有表裡證渴欲飲水水入即吐者名曰水逆五苓散主之蓋表證為太陽不足故用桂以宣陽氣通津液於周身即內經水精四布五經並行之旨非用之以通水道下出也里證為三焦之氣化不宣故用瀉朮二苓以通三焦之閉塞非開膀胱之溺竅也夫下焦之氣化不宣則腹膨而小便不利水蓄膀胱是為胞痹此乃水蓄於膀胱之外不能化入膀胱故用五苓以化之至小便不利汗出而渴者亦主以是方而不渴者茯苓甘草湯主之蓋渴為陽氣不足水不上升也不升則不降故用桂以升之二苓澤瀉以降之而用術以為中樞乃注者莫不以渴為熱入膀胱津液被劫所致如果熱入而復用桂術以溫液耗津又加苓澤以滲之是熱之又熱耗之又耗速之斃矣且不渴者反不用五苓而用茯苓甘草湯可知不渴則無須桂術之蒸騰津液而桂術之非治太陽而治三焦更不待言矣小陷胸湯栝蔞實大者一枚黃連一兩半夏半升水六升先煮栝蔞取三升去滓納諸藥煮取二升去滓分溫三服鄒潤安曰觀仲景之用栝蔞實在此湯曰小結胸正在心下按之則痛在栝蔞薤白白酒湯曰喘息咳唾胸背痛短氣而其脈一則曰浮滑一則曰寸口沉遲關上小緊數是皆陰中有陽且踞於陽位者也夫胸背痛較按之方痛則甚痹則較結為輕咳唾喘息是其勢為上衝而居於心下按之才痛似反靜而不動此其機總緣氣與飲相阻寒與熱相糾熱甚於寒者其束縛反急而為結寒甚於熱者其蔽塞自盛而為痹是故結胸之病伏胸痹之病散伏者宜開散者宜行故一則佐以連夏之逐飲泄熱一則佐以薤酒之滑利通陽栝蔞實之裹無形攢聚有形使之滑潤而下則同能使之下似是治實之方僅能使之下不能使其必通又非純乎治實之道矣何以知不能使之必通蓋有停飲痛甚至不得臥即當加半夏若兼胸滿脅下逆搶心則仍加枳朴桂枝倘竟能通又何必如是哉是知栝蔞實之治大旨在火與痰結於陽位不純乎虛亦不純乎實者皆能裹之而下此其擅長矣百合散桔梗貝母各三分巴豆一分去皮心膜熬黑研如脂雄按古人以六銖為一分分字去聲即二錢五分也為末內巴豆更於臼中杵之以白飲和服強人半錢羸者減之病在膈上必吐在膈下必利不利進熱粥一杯利過不止進冷粥一杯汪按半錢者以銅錢取藥末僅沒錢文之半即半錢匕而省匕字非若今人以五分為半錢也鄒潤安曰寒實結胸無熱證者治以白散散中用桔梗為疏通氣分之主夫開導胸中之氣仲景於大承氣湯梔子厚朴等湯莫不用枳朴此偏不用何哉蓋病有上下治有操縱結在上者宿痰停飲也故凡結胸無論熱實寒實寧用甘遂葶藶巴豆不用枳朴如大陷胸湯丸白散是也結在中下始熱與實浹氣隨熱化則於蕩滌邪穢中疏利其與邪為伍之氣大小承氣諸湯是也況桔梗之用使氣上越而不使氣下泄今病在至高固宜操上而縱下不使中下無過之地橫被侵陵故曰病在膈上必吐在膈下必利也熱邪與停飲結治以栝蔞而佐之者反用半夏黃連寒邪與停飲結治以巴豆而佐之者反用桔梗貝母於寒因熱用熱因寒用之中反佐以取之可謂精義入神以致用者矣調胃承氣湯大黃四兩去皮清酒浸甘草二兩炙芒硝半升水三升先煮大黃甘草取一升去滓內芒硝更上火微煮令沸少少溫服之徐洄溪曰芒硝善解結熱之邪大承氣用之以解已結之熱邪此方用之以解將結之熱邪其能調胃則全賴甘草也升麻鱉甲湯升麻當歸甘草各二兩蜀椒炒去汗一兩鱉甲手指大一片炙雄黃半兩研水四升煮取一升頓服之老小再服取汗金匱要略陽毒用此方陰毒去雄黃蜀椒肘後千金方陽毒用升麻湯無鱉甲有桂陰毒用甘草湯即本方無雄黃活人書陽毒升麻湯用犀角射干黃芩人參無當歸蜀椒鱉甲雄黃徐洄溪曰蜀椒辛熱之品陽毒用而陰毒反去之疑誤活人書加犀角等四味頗切當百合知母湯百合七枚知母三兩先以水洗百合漬一宿當白沫出去其水別以泉水二升煎取一升去滓別以泉水二升煎知母取一升後合煎取一升五合分溫再服王朴莊曰百合入藥以野生極小者為勝百合雞子黃湯百合七枚雞子黃一枚先煎百合如前法了內雞子黃攪勻煎五分溫服百合滑石代赭湯百合七枚擘滑石三兩碎綿裹代赭石如彈丸大一枚碎綿裹先煎百合如前法別以泉水二升煎滑石代赭取一升去滓後合和重煎取一升五合分溫再服百合地黃湯百合七枚擘生地黃汁一升先煮百合如前法了內地黃汁煎取一升五合分溫再服中病勿更服大便當如漆百合滑石散百合一兩灸滑石三兩為散飲方寸匕日三服當微利者止服熱則除鄒潤安曰玩百合知母湯可以見汗則傷氣邪搏於氣分為消渴熱中也玩百合雞子黃湯可以見吐則傷上邪擾於心為煩懊不寐也玩百合代赭湯可以見下則傷血邪搏於血分為血脈中熱也玩百合地黃湯可以見不經吐下發汗則系百脈一宗悉致其病無氣血上下之偏矣所謂百脈一宗者何平人氣象論曰胃之大絡名曰虛里出於左乳下其動應衣為脈宗氣是最近於心乃著邪焉是以見證行臥不安如有神靈皆心中輾轉不適之狀口苦小便數身形如和其脈微數皆心中熱鬱氣悗之徵以此例之本經百合主邪氣腹滿心痛蓋有若合符節者而治法始終不外百合則以心本不任受邪心而竟為邪擾則不責將之謀慮不審即責相之治節不行今邪阻於上而不下行為肺之不主肅降無能遁矣故欲徵其愈期極宜驗其小便凡溺時必肺氣下導小便乃出今氣拄於頭即欲下行上先有故則肺形之軒舉不隨氣之支結不降亦又何疑乃頭中之不適復分三等其最甚者至氣上拄而為痛其次則不痛而為淅淅然又其次則因小便通而快然即此驗其軒舉支結之淺深微甚既瞭如指掌矣況合之以百合地黃湯下云大便當如漆百合滑石散下云微利者止服熱則除則百合之利大小便又與本經吻合矣栝蔞牡蠣散栝蔞根牡蠣熬等分為細末飲服方寸匕日三服鄒潤安曰百合病至一月不解而變成渴以百合湯洗之而仍不瘥則病為傷中上之陰無疑雖然僅曰渴不曰欲飲水且不煩不熱究竟病無駐足之所僅渴之一端為得所依借耳於此見昔之百脈一宗悉致其病者今則上焦已化而在下者尚未化也上焦已化百脈之病已蠲其半百合遂無所用之而下焦之未化者不得不選用牡蠣使之召陽歸陰而其主腦尤在治上焦之已化者故方中配以從陽化陰之栝蔞根兩物等分標名則升栝蔞於牡蠣之上為一方之統攝也甘草瀉心湯甘草四兩炙黃芩人參乾薑各三兩半夏半升黃連一兩大棗十二枚傷寒論無人參水一斗煮取六升去滓再煎取三升溫服一升日三王晉三曰甘草瀉心非瀉結熱因胃虛不能調劑上下水寒上逆火熱不得下降結為痞故君以甘草大棗和胃之陰乾薑半夏啓胃之陽坐鎮下焦客氣使不上逆仍用芩連將已逆為痞之氣輕輕瀉卻而痞乃成泰矣赤豆當歸散赤小豆三升浸令芽出曝乾當歸十分杵為散漿水服方寸匕日三汪按赤小豆乃赤豆之小種今藥肆以半紅半黑之相思子為赤小豆醫者亦多誤用然相思子不能出芽即此方可證其訛二妙散茅山蒼朮生用川黃柏炒黑為末搗生薑煎沸湯調服王晉三曰此偶方之小制也蒼朮生用入陽明經能發二陽之汗黃柏炒黑入太陰經能除至陰之濕一生一熟相為表裡治陰分之濕熱有如鼓應桴之妙生薑瀉心湯生薑四兩甘草炙人參黃芩各三兩半夏半升黃連乾薑各一兩大棗十二枚水一斗煮取六升去渣煎取三升溫服一升日三徐洄溪曰汗後而邪未盡必有留飲在心下其證甚雜而方中諸藥一一對證內中又有一藥治兩證者亦有兩藥合治一證者錯綜變化攻補兼施寒熱互用皆本內經立方諸法其藥性又皆與神農本草所載無處不合學者能於此等方講求其理而推廣之則操縱在我矣半夏瀉心湯半夏半升黃芩乾薑甘草炙人參各二兩黃連一兩大棗十二枚水一斗煮取六升去渣再煎取三升溫服一升日三方中行曰半夏乾薑辛以散虛滿之痞黃芩黃連苦以泄心膈之熱人參甘草甘以益下後之虛大棗甘溫潤以滋脾胃之液曰瀉心者言滿在心膈而不在胃也大黃黃連瀉心湯大黃二兩黃連一兩麻沸湯二升漬之須臾絞去滓分溫再服尤在涇曰成氏云此導虛熱之方也按所謂虛熱者對燥矢而言也蓋邪熱入里與糟粕相結則為實熱不與糟粕相結則為虛熱非陰虛陽虛之謂本方以大黃黃連為劑而不用枳朴等藥者蓋以泄虛熱非以蕩實熱也雄按不但不用枳朴等藥也二味僅以麻沸湯漬須臾即絞其味甚薄乃可泄虛熱若久漬味厚雖無枳朴亦能下走腸胃也汪按尤氏解釋極精妙夢隱更以煎法釋之亦妙附子瀉心湯大黃二兩酒浸黃連炒黃芩炒各一兩附子一枚去皮別煮取汁以麻沸湯二升漬三味須臾絞去渣內附子汁分溫再服徐洄溪曰前方乃法之最奇者不取煎而取泡欲其輕揚清淡以滌上焦之邪此法更精附子用煎三味用泡扶陽欲其熱而性重開痞欲其生而性輕也雄按觀此可知用藥之道鄒潤安曰心之為體於卦象離今被邪逼則外陽內伐內陰沸騰故半夏甘草生薑三瀉心湯治陰邪之未化者也大黃黃連附子二瀉心湯治陰邪之已化者也陰邪已化不逼心陽則在內之沸亂略定惟在外之邪氣尚阻則取二黃之泄熱蕩去其邪邪去正自安矣惡寒汗出者在上之陰邪才化在下之陰氣覆逆故輕取二黃之氣以蕩熱除穢重任附子之威以追逐逆陰使之異趨同歸相成而不相背也其未化者陽餒朒於陽位而恣肆於陰分邪盤踞於清道而潰泄於下焦非乾薑半夏生薑之振散陰霾不足以廓清心之外郭非人參黃連之養陰泄熱不足以安擾心之內訌也又曰余治瘧發時先嘔者用半夏瀉心吐瀉交作者用生薑瀉心胸痞下利者用甘草瀉心皆應如桴鼓小承氣湯大黃四兩厚朴二兩枳實三枚水四升煮取一升二合去滓分溫二服初服湯當更衣不爾者盡飲之若更衣勿服雄按於大承氣湯既去芒硝而減枳朴復以大黃同煎而緩其蕩滌之性古人謂之和胃之劑故曰小承氣湯牛黃清心丸陝西牛黃二分五釐鏡面硃砂一錢五分生黃連五錢黃芩山梔各三錢鬱金二錢為末蒸餅為糊丸如黍米大每服七八丸王晉三曰此丸古有數方其義各別若治溫邪內陷包絡神昏者惟萬氏此方為妙蓋溫熱入於心包絡邪在裡矣草木之香僅能達表不能透里必借牛黃幽香物性乃能內透包絡與神明相合然尤在佐使之品配合咸宜萬氏用芩連山梔以瀉心火鬱金以通心氣辰砂以鎮心神合之牛黃相使之妙是丸調入犀角羚羊角金汁甘草人中黃連翹薄荷等湯劑中頗建奇功雄按周公謹云局方牛黃清心丸止是前八味至蒲黃而止自山藥以後凡二十一味乃補虛中山芋丸當時不知何以誤併為一因循不曾改正貽誤後人匪細凡此之類讀書者不可不知也一方用牛黃雄黃黃連黃芩梔子犀角鬱金硃砂各一兩真珠五錢冰片麝香各二錢五分研煉蜜丸每重一錢金箔為衣蠟匱功效較萬方為勝汪按萬方太輕此方較有力至寶丹生烏犀角生玳瑁琥珀鏡面硃砂研飛雄黃研飛各一兩西牛黃五錢龍腦研麝香研各一錢安息香一兩五錢為末酒研飛淨一兩熬膏用水安息尤妙金箔銀箔各五十片研細為衣先將犀玳為細末入余藥研勻將安息香膏重湯煮凝成後入諸藥中和搜成劑丸如梧子大蠟護臨服剖用人參湯化下三丸至五丸本事方有人參南星天竺黃王晉三曰此治心臟神昏從表透里之方也黃犀玳珀以有靈之物內通心竅朱雄二箔以重墜之品安鎮心神佐以腦麝安息搜剔幽隱諸竅東垣云冰雄牛麝入骨髓透肌膚抱朴子言金箔雄黃合餌為地仙若與丹砂同用為聖金餌之可以飛升故熱入心包絡舌絳神昏者以此丹入寒涼湯藥中用之能祛陰起陽立展神明有非他藥所可及徐氏云安神定魄必備之方真神丹也若病因頭痛而即神昏不語者此肝虛魂升於頂當用牡蠣救逆以降之又非至寶丹所宜輕試涼膈散一名連翹飲子連翹四兩大黃酒浸芒硝甘草各二兩黃芩酒炒薄荷梔子各一兩為粗末每服三五錢加竹葉七片水一碗半煎一碗去滓入生白蜜一匙微煎溫服與四物各半服能和營泄熱名雙和散本事方加赤芍乾葛治諸熱纍效玉機云輕者宜桔梗湯汪按此方與第二方桔梗湯名同實異即本方去硝黃加桔梗舟楫之品浮而上之去膈中無形之熱且不犯中下二焦也雄按此方加減法詳宣明論徐洄溪曰此瀉中上二焦之火即調胃承氣加疏風清火之品也余師愚曰熱淫於內治以鹹寒佐以苦甘故以連翹黃芩竹葉薄荷升散於上大黃芒硝推蕩其中使上升下行而膈自清矣余謂疫疹乃無形之熱投以硝黃之猛烈必致內潰因去硝黃加生石膏桔梗使熱降清升而疹自透亦上升下行之義也雄按法本宣明剪裁甚善犀角地黃湯暹羅犀角磨汁連翹各三錢生地五錢生甘草五分水二鍾武火煎三物至八分去滓入犀汁和服王晉三曰溫熱入絡舌絳煩熱八九日不解醫反治經寒之散之攻之熱勢益熾得此湯立效者非解陽明熱邪解心經之絡熱也按本草犀角地黃能走心經專解營熱連翹入心散客熱甘草入心和絡血以治溫熱證熱邪入絡功勝局方導赤散生地木通甘草梢各等分雄按生地木通不應等分水煎服或加淡竹葉汪按古方淡竹葉即竹葉也淡竹乃竹名耳今藥肆所售淡竹葉草是小青之別種性能涼胃不能清心醫人每多誤用雄按本方去甘草加黃芩蜜丸名火府丹亦治心熱溺澀淋渴等證本方加升麻黃連丹皮名升麻清胃湯輕清涼血乃秦皇士透化斑疹之良劑理中丸人參甘草炙術乾薑各三兩搗篩為末蜜和為丸如雞子黃大以沸湯數合和一丸研碎溫服之日三四服夜二服腹中未熱益至三四丸雄按未熱二字須著眼腹中不冷者其可服乎然不及湯湯法以四味依兩數切用水八升煮取三升去渣溫服一升日三徐洄溪曰此仲景治寒多霍亂之方也蓋亦傷寒之類後人以暑月之吐利當之而亦用此方更造為大順散者皆無稽之論也四君子湯人參白朮炒茯苓各二錢甘草炙一錢生薑三片大棗二枚水煎溫服徐洄溪曰此補脾之主方玉女煎生石膏三五錢熟地三五錢或一兩麥冬二錢知母牛膝各一錢五分水一鍾半煎七分服雄按陳修園力闢此方之謬然用治陰虛胃火熾盛之齒痛頗有捷效若治溫熱病地黃宜生牛膝宜刪葉氏引用決不泥守成方近讀景嶽發揮果與陳氏之論印合四物湯生地當歸各三兩芎藭一兩五錢芍藥二兩㕮咀每服四錢水二盞煎八分去滓溫服張路玉曰四物為陰血受病之專藥非調補真陰之藥也汪按調補真陰宜集靈膏不宜四物而人多誤會小柴胡湯柴胡半斤黃芩人參甘草炙生薑各三兩半夏半升大棗十二枚水一斗二升煮取六升去滓再煎取三升溫服一升日三尤拙吾曰熱入血室三條其旨不同第一條是血舍空而熱乃入者空則熱不得聚而遊其部故脅滿痛第二條是熱邪與血俱結於血室者血結亦能作寒熱柴胡亦能去血結不獨和解之謂矣第三條是熱邪入而結經尚行者經行則熱亦行而不得留故必自愈無犯胃氣及上二焦病在血而不在氣在下而不在上也若誅伐無過變證隨出烏能自愈耶沈再平曰今人治瘧必用此湯若非此湯即不足以為治者故致輾轉淹滯變生不測竟能殞命則知瘧本非死證惟概以柴胡治瘧者殺之也夫柴胡為少陽表藥若其瘧果發於少陽而以柴胡治之無不立愈若系他經用之則必使他經之邪輾轉而入少陽遷延以斃乃既死猶曰柴胡為治瘧主藥吾開手即用之不知其何以死病家亦以柴胡治瘧而竟不效真其命之當死也彼此昏迷不得一悟良可浩嘆雄按內經論瘧既分六經又分臟腑並不泥定少陽一經醫家繹之雄按本方柴半各八兩准今得六錢零八釐參草苓姜各三兩准今得二錢二分八釐棗十二枚以水一斗二升准今得八合零四抄煮至減半去滓再煎至減半夫煎而又煎只取四分之一其湯之濃郁甘柔可知喻氏謂和藥取其各藥氣味之相和余謂和者取其氣緩味厚斯為補正托邪之劑故惟風寒正瘧邪在少陽者可以按法而投則參甘薑棗補胃充營半夏利其樞柴芩解其熱病無不愈矣猶之今人於瘧發之先飽啖羊肉酒飯亦能取效汪按瘧疾寒來之時強食過飽往往一寒不能復熱而死吾見甚多不可不戒蓋風寒自表而受胃腑空虛自能安穀治必先助中氣托邪外出即御外邪杜其內入誠一舉兩全之策也若溫熱暑濕諸瘧邪從口鼻而受肺胃之氣先已窒滯病發即不飢惡谷脘悶苔黃苟不分別但執此湯奉為聖法則參甘薑棗溫補助邪驟則液涸神昏緩則邪留結痞且有耗傷陰血而成瘧勞者即不用全方而專以柴胡為治瘧主藥亦惟營陰充裕或溫熱暑濕之邪本不甚重及兼感風寒之表邪者始可見功汪按治正瘧必宜此湯溫暑亦有正瘧不獨風寒方用黃芩是清熱非祛寒也且柴胡主少陽半表半裡黃芩里藥亦非以治表邪但當辨其是否正瘧耳若似瘧非瘧妄用柴胡必提成長熱不退或兩耳大痛甚至神昏更或引動肝風痙厥立至生平見之屢矣故倪涵初所定三方亦愈病者稀而加病者多也汪按瘧疾強止變成臌脹者多不救而人但知其臌脹而死未嘗歸咎於治瘧之不善故醫者終身誤人而不自知雖告之不信也世人凡患瘧不究病因輒以薑棗湯灌之其弊類此羊肉亦然凡屬時瘧雖愈後亦忌食食則必復此時瘧之所以異於正瘧也可不察哉桂枝紅花湯傷寒桂枝湯加紅花原方桂枝芍藥生薑各三兩甘草炙二兩大棗十二枚蔥豉湯蔥白一握香豉三合水煎入童子小便一合日三服雄按蘆根桑葉滑石蔗漿之類皆可隨證佐用張路玉曰本方藥味雖輕功效最著凡虛人風熱伏氣發溫及産後感冒靡不隨手獲效尤拙吾曰溫邪之發陰必先傷設有當行解散者必兼滋陰之品於其中昔人於蔥豉湯內加童便於梔豉湯中加地黃麥冬亦此意也雄按二方加減古法最詳華岫云曰在內之溫邪欲發在外之新邪又加蔥豉湯最為捷徑表分可以肅清鄒潤安曰梔子與蔥白一系泄熱一系通陽泄熱者縱通陽者橫縱則能通上下之道此所以宜於汗吐下後表邪已解之時橫則能達外內之情此所以宜於病初起卒難辨識之際而豆豉擅開發上焦鬱抑宣導陰濁逗留故在先在後咸藉以奏功也雄按葉氏春溫篇於新邪引動伏邪亦主是方蓋此湯為溫熱初病開手必用之劑鞠通不察舍近而圖遠遂為喻氏臆說所惑以桂枝湯為初感之治仍不能跳出傷寒圈子矣意欲紹述仲聖乎則祖上之門楣不可誇為自己之閥閲也拘守其跡豈是心傳尤氏云桂枝湯為傷寒表病而里和者設設溫病伏寒變熱少陰之精已被劫奪雖有新舊合邪不可更用辛溫助熱而絶其本也吳氏殆未之聞耶清心涼膈散一名桔梗湯即涼膈散去硝黃加桔梗余氏又加生石膏為治疫疹初起之良劑葦莖湯葦莖二斤薏苡仁瓜瓣各半斤桃仁五十枚水一斗先煮葦莖得五升去滓納諸藥煮取二升服一升再服雄按鄒氏續疏云葦莖形如肺管甘涼清肺且有節之物生於水中能不為津液閡隔者於津液之閡隔而生患害者尤能使之通行薏苡色白味淡氣涼性降秉秋生之全體養肺氣以肅清凡濕熱之邪客於肺者非此不為功也瓜瓣即冬瓜子冬瓜子依於瓤內瓤易潰爛子不能浥則其能於腐敗之中自全生氣即善於氣血凝敗之中全入生氣故善治腹內結聚諸癰而滌膿血濁痰也桃仁入血分而通氣合而成劑不僅為肺癰之妙藥竟可廖肺痹之危疴瀉白散桑白皮地骨皮各一兩甘草五錢為粗末每服一二錢入粳米百粒水煎徐洄溪曰此方能治肺中之飲雄按此瀉去肺熱而保定肺氣之方也若肺不傷於熱而傷於風寒者誠有如鞠通所謂必將邪氣戀定而漸成勞怯矣故用藥必先議病也葶藶大棗瀉肺湯葶藶熬令黃色搗丸如雞子大大棗十二枚水三升煮棗取二升去棗內葶藶煮取一升頓服雄按外臺用葶藶杏仁各一升大棗六十枚合杵如膏加蜜作丸桐子大桑白皮湯下六七十丸以大便通利為度本事方無杏仁有陳皮桔梗棗肉丸梧子大每服五七丸飲下名棗膏丸元戎於本方加麻黃五味子汪按此二味並用似嫌夾雜並治痰實飲閉而為喘脹者余治虛弱人患實痰哮喘者用葶藶炒黃煎湯去渣以湯煮大棗食之亦變峻劑為緩劑之一法也竹葉石膏湯竹葉二握生石膏一斤半夏半斤洗人參三兩甘草二兩炙麥門冬一斤粳米半斤雄按陳修園曰傷寒論用人參者有數方皆因汗吐下之後亡其津液故取甘涼以救其陰也水一斗先煮六味取六升去滓內粳米煮米熟湯成去米溫服一升日三集驗此方加生薑治嘔最良雄按余用此方治暑瘧極妙徐洄溪曰此治傷寒解後虛贏少氣之善後方也蓋大病之後必有留熱治宜清養後人俱概用峻補以留其邪則元氣不能驟復愈補愈虛矣雄按此理惟喻氏知之葉氏精之清燥救肺湯經霜桑葉三錢去筋杏仁七分去皮尖炒黃麥門冬一錢二分生石膏二錢五分人參七分阿膠八分胡麻仁一錢枇杷葉去毛筋一片甘草一錢水一碗煎六分食遠服痰多加貝母栝蔞血枯加生地熱甚加犀角羚羊角或加牛黃柯韻伯曰古方用香燥之品以治氣鬱不獲奏效者以火就燥也惟繆仲淳知之故用甘涼滋潤之品以清金保肺立法喻氏宗其旨集諸潤劑而制此湯用意深矣汪按此治秋燥證之神方勝於東垣清燥湯多矣妙香丸一名大聖丸巴豆三百十五粒去皮心膜炒熟研如面牛黃研膩粉研龍腦研麝香研各三兩辰砂飛九兩金箔九十片研研勻煉黃蠟六兩入白蜜三分同煉令勻為丸每兩作三十丸白湯下二丸日二宣明有水銀硼砂此丸治驚癇百病亦治傷寒潮熱積熱結胸發黃狂走躁熱大小便不通徐氏云三分一丸難於下咽宜作一分一丸每服三丸為妥六一散一名天水散膩白滑石六兩水飛甘草一兩炙為細末每服三錢溫水或新汲水調下日三暑濕內侵風寒外襲者豆豉五十粒蔥白五寸水一盞煮汁調下即解甚者三服必愈催生下乳溫水擂胡麻漿調下並可下死胎解斑蟊毒加辰砂少許名益元散加黃丹少許名紅玉散加青黛少許名碧玉散加薄荷葉末少許名雞蘇散李瀕湖曰熱散則三焦寧而表裡和濕去則闌門通而陰陽利完素以之治七十餘證贊為凡間仙藥不可缺之雄按小溲清長者勿服大順散甘草三十斤銼寸長乾薑杏仁去皮尖肉桂去粗皮各四斤先將甘草同白砂炒及八分黃熟王晉三曰白砂即河砂或云是白砂糖非次入乾薑同炒令姜裂次入杏仁又同炒候不作聲為度篩去砂後入肉桂一處搗為散每服二錢水煎溫服如煩躁井華水調下不拘時沸湯調亦可王安道曰此方甘草最多乾薑杏仁肉桂次之除肉桂外三物皆炒者原其初意本為冒暑伏熱引飲過多脾胃受濕嘔吐水穀不分臟腑不調所立蓋溫中藥也內有杏仁不過取其能下氣耳若以之治靜而得之之證吾恐不能解而反增內煩也世俗不明類曰夏月陰氣在內此等方為必用之藥籲誤矣夫陰氣非寒氣也蓋夏月陽氣發散於外而陰氣則在內耳豈可視陰氣為寒氣而用溫熱之藥乎陰果為寒何以夏則飲水耶汪按若夏月必宜溫藥則冬月必宜涼藥乎且大熱煩躁而更以薑桂之燥熱助之不得已而用井華水欲使相濟不知井華水之力不能制也尤為進退無據矣徐洄溪曰此治暑月內傷飲冷證非治暑也又甘草多於諸藥八倍亦非法此等病百不得一偶用之耳而製藥四十二斤又止服二錢其意何居其方本不足取而世之庸醫竟以此治燥火之暑病殺人無算可勝悼哉紫雪丹黃金一百兩徐云以飛金一萬頁代之尤妙寒水石磁石石膏滑石各三斤以上並搗碎用水一斛煮至四斗去滓入下藥羚羊角屑犀角屑青木香沉香各五斤丁香一兩徐云宜用二兩元參升麻各一斤甘草八兩炙以上入前藥汁中再煮取一斗五升去滓入下藥朴硝十斤硝石四斤徐云二硝太多宜用十分之一二味入前藥汁中微火上煎柳木篦攪不住候有七升投在木盆中半日欲凝入下藥硃砂三兩麝香當門子一兩二錢五分二味入前藥中攪調令勻瓷器收藏藥成霜雪而色紫新汲水調下雄按雞峰方無磁石滑石硝石其二角只用各十兩丁沉木香各五兩升麻六兩朴硝二斤麝香卻用三兩餘六味同又薛公望雲方中黃金不用亦可汪按宜用飛金箔不可去徐洄溪曰邪火毒火穿經入臟無藥可治此能消解其效如神禹餘糧丸即針砂丸又名蛇含石丸蛇含石即蛇黃大者三兩以新鐵銚盛入炭火中燒石與銚子一般紅用鉗取蛇黃傾入醋中候冷研極細末聽用禹餘糧三兩真針砂五兩以水淘淨炒乾入餘糧一處用米醋二升就銚內煮醋乾為度後用銚並藥入炭火中燒紅鉗出傾藥淨磚上候冷研細以三物為主其次量人虛實入下項藥羌活川芎木香茯苓牛膝桂心白豆蔻大茴蓬朮附子乾薑青皮三稜白蒺藜當歸酒浸一宿各五錢為末入前藥拌勻以湯浸蒸餅捩去水和藥再杵為丸梧子大食前溫酒白湯任下三十丸至五十丸最忌鹽一毫不可入口否則發疾愈甚但試服藥即於小便內旋去不動臟腑而能去病日三服兼以溫和調補氣血藥助之真神方也雄按此乃治水腫寒積之方今人輒用以治脹然脹有寒熱二證設熱脹誤服貽害非輕丹溪云溫熱之藥太多宜有加減不可徒執其方魏玉橫云陰虛內熱而為䐜脹誤服燥熱石藥必死徐洄溪曰此方兼治有形之積塊牡蠣澤瀉散牡蠣澤瀉蜀漆洗去腥栝蔞根葶藶子商陸根熬海藻洗去咸各等分異搗下篩為散更入臼中杵之白飲和服方寸匕小便利止後服雄按古云商陸水煎能殺人華岫云曰葉氏雖善用古方然但取其法而並不膠柱觀其加減之妙如復脈建中瀉心等類可知至用牡蠣澤瀉散只取此二味故案中有但書用某方而不開明藥味者決非盡用原方必有加減之處觀者以意會之可也雄按此論通極諸方皆當作如是觀鄒潤安曰牡蠣澤瀉散證水蓄於下上焦之氣不能為之化故類萃商陸葶藶以從上下降澤瀉海藻以啓水中清氣上行栝蔞牡蠣則一以上濟其清一以下召其濁而使之化耳又曰牡蠣澤瀉散治腰以下水氣不行必先使商陸葶藶從肺及腎開其來源之壅而後牡蠣海藻之軟堅蜀漆澤瀉之開泄方能得力用栝蔞根者恐行水之氣過駛有傷上焦之陰仍使之從脾吸陰還歸於上與常山之蛇擊其首則尾應擊其尾則首應者不殊也越脾湯麻黃六兩石膏八兩生薑三兩甘草二兩大棗十二枚水六升煮麻黃去沫內諸藥煮取三升分三服惡風加附子一枚喻嘉言曰越脾湯者示微發表於不發之方也大率取其通調營衛麻黃石膏二物一甘熱一甘寒合而用之脾偏於陰則和以甘熱胃偏於陽則和以甘寒乃至風熱之陽水寒之陰凡不和於中土者悉得用之何者中土不和則水穀不化其精悍之氣以實營衛營衛虛則或寒或熱之氣皆得壅塞其隧道而不通於表裡所以在表之風水用之而在裡之水兼渴而小便自利者咸必用之無非欲其不害中土耳不害中土自足消患於方萌矣甘遂半夏湯甘遂大者三枚半夏十二枚芍藥五枚甘草如指大一枚一本無甘草汪按王氏雖為之釋究當從一本去甘草為是水二升煮取半升去滓以蜜半升和藥汁煎取八分頓服之王晉三曰甘遂反甘草反者此欲下而彼欲上也乃以芍藥約之白蜜潤之則雖反而甘遂仍得下滲靈樞有言約方如約囊甘遂半夏逐留飲瀰漫於腸胃之間雖利而續堅滿苟非以甘草白蜜與甘遂大相反者激而行之焉能去其留著之根相反為方全賴芍藥之酸可勝甘約以監反庶不溷亂中焦而為害然學識未優者不可輕試於人也控涎丹一名妙應丸甘遂去心大戟去皮白芥子各等分為末蒸餅糊丸每服五七丸至十丸臨臥薑湯服雄按余治虛人飲證每以六君子湯去甘草送服甚妥達可謂之子龍丸云治流注竄毒甚效王晉三曰控引也涎讀作羡湎涎也水流貌引三焦之水湎涎流出於水道也芥子色白入肺而達上焦甘遂色黃入脾而行中焦大戟色黑入腎而走下焦故白芥子走皮裡膜外之水飲甘遂決經隧之水飲大戟逐臟腑之水飲三者引經各異湎涎於水道則同故復之為方而名控涎也汪按涎即次之俗字亦作漩本指口唾引伸為痰涎王說未當又控涎丹治諸癇生川烏半夏洗殭蠶炒各半兩生薑汁浸一宿鐵粉三錢研全蠍甘遂麵裹煨各二錢半為細末生薑自然汁為丸如緑豆大硃砂為衣每服十五丸生薑湯下二方俱忌食甘草五子五皮湯即五皮飲五加皮地骨皮茯苓皮大腹皮生薑皮一方五加易陳皮一方五加易桑白皮加杏仁蘇子葶藶子白芥子萊蔔子一方無杏仁芥子有香附車前子桂苓丸桂一兩茯苓二兩為末蜜丸沸湯下二錢作湯名桂苓飲禹功丸即禹功散黑牽牛頭入磨一次不復再磨四兩大茴香炒一兩為細末以生薑自然汁調服一二錢或加木香一兩防己茯苓湯防己黃耆桂枝各三兩茯苓六兩甘草二兩水六升煮取二升分溫三服王晉三曰余治太陽腰髀痛審證借用此方如鼓之應桴中滿分消湯半夏一錢厚朴黃連黃柏俱薑製川烏乾薑俱炮開口吳萸炒草豆蔻炒研木香人參各五分茯苓澤瀉各一錢半生薑五片水煎稍熱服大忌房勞生冷炙煿酒面糟醋鹽醬等物身熱脈浮喘滿有表證加麻黃五分血虛至夜煩熱加歸身黃耆各五分陽氣下陷便溺赤澀加升麻柴胡各三分脾氣虛弱飲食不磨去黃柏加益智仁蓽澄茄青皮各二分中滿分消丸厚朴半夏黃連俱薑汁炒黃芩枳實白朮同枳實拌濕炒焦乾生薑茯苓豬苓澤瀉人參各五錢甘草炙一錢湯浸蒸餅為丸梧子大每服百丸沸湯下脾胃氣滯食積脹滿加陳皮砂仁各五錢經脈濕滯腹皮腿臂痛不可拊者加片子薑黃一錢肺熱氣化不行溺閉喘渴者加知母三錢張路玉曰東垣分消湯丸一主溫中散滯一主清熱利水原其立方之旨總不出內經平治權衡去菀陳莝開鬼門潔淨府等法其湯方主中滿寒脹乃下焦陰氣逆滿抑遏中焦陽氣有似乎陰之象故藥中雖用烏頭之辛熱宣布五陽為闢除陰邪之嚮導即用連柏之苦寒以降泄之苟非風水膚脹脈浮證起於表者孰敢輕用開鬼門之法以鼓動其陰霾四塞乎丸方主中滿熱脹用黃芩之輕揚以降肺熱則用豬苓澤瀉以利導之故專以潔淨府為務無事開鬼門宣布五陽等法也小青龍湯麻黃去節芍藥細辛乾薑甘草炙桂枝各三兩五味子半夏各半升水一斗先煮麻黃湯減二升去上沫內諸藥煮取三升去滓溫服一升徐洄溪曰此方專治水氣蓋汗為水類肺為水源邪汗未盡必停於肺胃之間病屬有形非一味發散所能除此方無微不到真神劑也木防己湯木防己三兩桂枝二兩人參四兩石膏如雞子大二枚水六升煮取二升分溫再服虛者即愈實者復發去石膏加茯苓芒硝尤拙吾曰防己桂枝一苦一辛並能行水氣而散結氣而痞堅之處必有伏陽吐下之餘定無完氣書不盡言而意可會也故又以石膏治熱人參益虛於法可謂密矣其虛者外雖痞堅而中無結聚即水去氣行而愈其實者中實有物氣暫行而復聚故三日復發也去石膏加芒硝者魏伯鄉云以其既散復聚則有堅定之物留作包囊故以堅投堅而不破者即以軟投堅而即破也加茯苓者亦引飲下行之用耳鄒潤安曰防己之莖如木故名木防己後世以其出漢中因又名漢防己非二物也如仲聖但以防己名湯則曰木防己湯連他物以名湯則除去木字以便稱謂耳後人以莖為木以根為漢及治風治水之分均屬臆斷藿香正氣散厚朴陳皮桔梗白朮半夏各二兩大腹皮換檳榔亦可或用蒼朮白芷茯苓蘇葉藿香各三兩甘草炙一兩為粗末每服三錢姜三片棗一枚煎熱服汪按蘭臺軌範無白朮不換金正氣散蒼朮泔浸去皮麻油拌炒黃四兩厚朴去皮薑汁炒陳皮去白甘草炙各三兩藿香半夏各二兩為粗末每服三錢水煎溫服或加香豉雄按二方皆治風寒外感食滯內停或兼濕邪或吸穢氣或傷生冷或不服水土等證的是良方若溫暑熱證不兼寒濕者在所切禁今人謂其統治四時感證不審病情一概亂用殊可笑也六和湯香薷二兩人參茯苓甘草炙扁豆厚朴薑製木瓜杏仁去皮尖半夏各一錢藿香砂仁炒研各六分生薑三片大棗一枚水煎熱服一方無香薷有白朮汪按宜用香薷為暑月受涼閉汗故表之也雄按此亦治暑月外感風寒內傷生冷之劑香薷飲之方不一主治略同皆非治暑之藥也用者辨之五積散蒼朮厚朴陳皮甘草麻黃桂枝炮姜半夏茯苓枳殼桔梗芍藥當歸川芎白芷生薑蔥白為粗末每服三錢水煎服汪按麻黃亦為閉汗而設雄按此治外受寒濕內挾冷食之劑益黃散陳皮青皮下食入太陰之倉丁香去脾胃中寒各二錢訶子肉五錢能開胃消食止痢甘草炙三錢為末每服一二錢水煎錢仲陽用治脾土虛寒嘔吐泄瀉汪按徐洄溪謂訶子肉水煎澀難入口此方似宜末服不必水煎又益黃散人參陳皮去白各一錢黃耆二錢生甘草炙甘草各五分芍藥七分黃連少許為末每服二錢水一杯煎五分服李東垣用治慢脾風星附六君湯即六君子湯四君子加陳皮半夏是也加制南星白附子附連香飲佚俟考雄按本論主治熱氣深伏煩渴嘔逆必以黃連之苦降泄熱為君或謂即香連丸則木香與火升作嘔者非所宜也若寒嘔則石蓮丁香飲甚妙黃連竹茹橘皮半夏湯藥即湯見雄按此方於橘皮竹茹湯去生薑之溫甘草之甘加黃連之苦寒以降諸逆衝上之火半夏之辛開以通格拒搏結之氣用治嘔噦其效如神來復丹太陰元精石舶上硫黃硝石各一兩用硫黃為末微火炒結成砂子大橘紅青皮去白五靈脂澄去砂炒令煙盡各二錢為末醋糊丸豌豆大每服三十丸白湯下七香餅香附丁香皮各一兩二錢甘松八錢益智仁六錢砂仁蓬朮廣皮各二錢為末神麯糊調勻捏成餅子每重一二錢干之用時杵碎水煎服平胃散茅山蒼朮去粗皮米泔浸五兩紫厚朴去皮薑汁炒陳皮去白各三兩二錢甘草炙二兩為末每服二錢水一盞姜一片同煎七分溫服柯韻伯曰內經以土運太過曰敦阜其病腹滿不及曰卑監其病留滿痞塞三承氣湯調胃土之敦阜此方平胃土之卑監也培其卑者而使之平非削平之謂猶溫膽湯用涼劑而使之溫非用溫之調也雄按柯氏此論雖已超越前賢而義猶未暢也三承氣湯調胃土之敦阜韙矣若卑監者乃是脾德有慚土不勝濕健運失職陽氣不升非胃病也夫脾字從卑原為陰土其性惡濕燥補相宜既知脾濕去而不滯脾得補而健運則是方也乃調脾土之卑監而名曰平胃者以脾氣健而升則胃自平而降耳本非削平之謂也胃苓湯即平胃合五苓也桃核承氣湯桃仁五十個去皮尖大黃四兩甘草桂枝芒硝各二兩水七升煮取二升半去滓內芒硝更上火微沸下火先令溫服五合日三服當微利徐云微利則僅通大便不必定下血也徐洄溪曰熱甚則血凝而上干心包故神昏而如狂血得熱而行苟能自下則邪從血出亦能自愈但小腹急結是蓄血見證宜此主之鄒潤安曰瘀血一證傷寒論金匱要略論之最詳大凡已見熱標而無熱證脈無熱象者瘀也有所阻則應有所不通有所阻而氣化仍通者瘀也並無所阻而自謂若有所阻者瘀也有燥象而不渴不應渴而反渴者瘀也蓋氣以化而行血以行而化氣已行而結者猶結則非氣病況血應濡而不濡實非枯而似枯是非有瘀何由得此哉雄按余治李氏婦崩後溺澀暨顧氏婦産後小便不通皆以瘀行而愈可見病機多幻雖聖人亦有所不能盡也故許知可治毗陵貴婦用桃仁煎而愈古之人有行之者矣王清任論病專究瘀血即葉氏所云病久入絡義皆本於仲景也白虎加桂枝湯石膏一斤知母六兩甘草炙二兩粳米二合桂枝三兩銼每服五錢水一盞半煎至八分去滓溫服汗出愈鄒潤安曰或問桂枝與白虎寒熱天淵安可兼用且論中諄諄以表不解禁用白虎既可兼用則何不加此而必待表解乎曰表不解不可與白虎條上文言脈浮發熱無汗乃麻黃證非特不得用白虎且不得用桂枝矣白虎證者脈大也汗出也煩渴欲飲水也三者不兼即非是今云其脈如平身無寒但熱時嘔皆非白虎證亦未必可用桂枝特既與白虎則三者必具再加骨節煩疼之表則無寒不得用柴胡有汗不得用麻黃熱多又不得用附子不用桂枝和營通絡而誰用者且古人於病有分部非如後世多以陰陽五行生剋為言雄按因此遂成議藥不議病之世界積重難返奈何傷寒有傷寒用藥之例溫瘧有溫瘧用藥之例蓋傷寒自表入里故有一毫未化之寒即不可與全入者並論溫瘧自內出外里既全熱但有骨節煩疼一種表證即不得全認為熱而單用白虎故必兼桂枝使之盡化而頃刻致和矣四獸飲即六君子湯加草果為散每服四五錢生薑三片鹽少許烏梅一個水煎服露姜飲人參生薑等分陰陽水煎去滓露一宿再煎數沸溫服葉香岩曰瘧疾之發由於受暑者多若驟用溫補截之為害不淺松江趙嘉柱瘧發數次用此法變血痢而死雄按此方必邪衰正餒而纏綿不已者始可用以截之白露降而炎暑消故取秋露以滌餘邪若秋前露自地升不能取也鱉甲煎丸鱉甲十一分炙烏扇即射干燒鼠婦熬乾薑黃芩大黃桂枝石葦去毛厚朴紫葳阿膠各三分柴胡蜣螂熬各六分芍藥牡丹皮䗪蟲熬各五分葶藶熬半夏人參各一分瞿麥桃仁各二分蜂窠四分炙赤硝十二分為末取煅灶下灰一斗清酒一斛五斗浸灰俟酒盡一半著鱉甲於中煮令泛爛如膠漆絞取汁內諸藥煎為丸如梧子大空心服七丸日三服雄按凡用介類之藥入丸劑皆當仿此聖法庶無流弊王晉三曰鱉甲煎丸都用異類靈動之物若水陸飛潛升者降者走者伏者咸備焉但恐諸蟲擾亂神明取鱉甲為君守之其泄厥陰破癥瘕之功有非草木所能比者阿膠達表息風鱉甲入里守神蜣螂動而性升蜂房毒可引下䗪蟲破血鼠婦走氣葶藶泄氣閉大黃泄血閉赤硝軟堅桃仁破結烏扇降厥陰相火紫葳破厥陰血結乾薑和陽退寒黃芩和陰退熱和表裡則有柴胡桂枝調營衛則有人參白芍厚朴達原劫去其邪丹皮入陰提出其熱石葦開上焦之水瞿麥滌下焦之水半夏和胃而通陰陽灶灰性溫走氣清酒性暖走血統而論之不越厥陰陽明二經之藥故久瘧邪去營衛而著臟腑者即非瘧母亦可藉以截之金匱惟此方與薯芋丸藥品最多皆治正虛邪著久而不去之病非彙集氣血之藥攻補兼施未易奏功也雄按有形癥瘕按之不移者即非瘧母亦可藉以緩消六神湯即四君子湯加山藥扁豆雄按二陳湯去甘草加旋覆花石菖蒲膽南星亦名六神湯治癲狂昏厥諸痰證極效三黃湯黃連酒煮黃芩酒炒大黃酒浸各等分金匱倍大黃名瀉心湯麻沸湯二升漬之須臾絞去滓分溫再服為末煉白蜜丸梧子大名三黃丸去大黃加黃柏等分煎名金花湯更加梔子名梔子金花湯即黃連解毒湯為末蜜丸名金花丸金花湯為末蜜丸名三補丸三黃丸加黃柏等分滴水丸名大金花丸張石頑曰金花湯止芩連柏三味作丸名三補金花丸較湯多梔子作湯名解毒更加大黃則名大金花湯湯丸雖異功用不殊但取急攻則用湯緩祛則用丸微有區別耳甘露消毒丹一名普濟解毒丹飛滑石十五兩綿茵陳十一兩淡黃芩十兩石菖蒲六兩川貝母木通各五兩藿香射干連翹薄荷白豆蔻各四兩各藥曬燥生研細末見火則藥性變熱每服三錢開水調服日二次或以神麯糊丸如彈子大開水化服亦可雄按此治濕溫時疫之主方也六元正紀五運分步每年春分後十三日交二運徵火旺天乃漸溫芒種後十日交三運宮土旺地乃漸濕溫濕蒸騰更加烈日之暑爍石流金人在氣交之中口鼻吸受其氣留而不去乃成濕溫疫癘之病而為發熱倦怠胸悶腹脹肢酸咽腫斑疹身黃頤腫口渴溺赤便閉吐瀉瘧痢淋濁瘡瘍等證但看病人舌苔淡白或厚膩或干黃者是暑濕熱疫之邪尚在氣分悉以此丹治之立效並主水土不服諸病汪按普濟消毒飲用芩連陳皮元參連翹甘桔升柴馬勃鼠黏薄荷板藍根殭蠶或加人參大黃今附載神犀丹烏犀角尖磨汁石菖蒲黃芩各六兩真懷生地冷水洗淨浸透搗絞汁銀花各一斤如有鮮者搗汁用尤良糞清連翹各十兩板藍根九兩無則以飛淨青黛代之香豉八兩元參七兩花粉紫草各四兩各生曬研細忌用火炒以犀角地黃汁糞清和搗為丸切勿加蜜如難丸可將香豉煮爛每重三錢涼開水化服日二次小兒減半如無糞清可加人中黃四兩研入雄按溫熱暑疫諸病邪不即解耗液傷營逆傳內陷痙厥昏狂譫語發斑等證但看病人舌色干光或紫絳或圓硬或黑苔皆以此丹救之若初病即覺神情昏躁而舌赤口乾者是溫暑直入營分酷暑之時陰虛之體及新産婦人患此最多急須用此多可挽回切勿拘泥日數誤投別劑以僨事也兼治痘瘄毒重夾帶紫斑危證暨痘疹後餘毒內熾口糜咽腐目赤神煩諸證方中犀角為君鎊而煎之味極難出磨則需時緩不及待抑且價昂非貧人所能猝辦有力者預為合就施送則患者易得救活必多貧者重生陰功亦大或存心之藥鋪照本製售亦方便之一端也溫膽湯竹茹枳實半夏各一兩橘紅一兩五錢茯苓七錢甘草炙四錢每服四五錢生薑一片紅棗一枚水一鍾五分煎七分服羅東逸曰膽為中正之官清靜之府喜寧謐惡煩擾喜柔和不喜壅鬱蓋東方木德少陽溫和之氣也是以虛煩驚悸者中正之官以熇熱而不寧也熱嘔吐苦者清靜之府以郁久而不謐也痰氣上逆者土家濕熱反乘而木不得遂其條達也如是者首當清熱及解利三焦方中以竹茹清胃脘之陽而臣以甘草橘半通胃以調其氣佐以枳實除三焦之痰壅使以茯苓平滲致中焦之清氣且以驅邪且以養正三焦平而少陽平三焦正而少陽正膽家有不清寧而和者乎和即溫也溫之者實涼之也晉三亦云膽氣退熱為溫非謂膽寒而溫之也雄按此方去薑棗加黃連治濕熱痰而化瘧者甚妙古人所未知也麻黃杏仁甘草石膏湯藥即湯見張石頑曰此大青龍湯去桂枝越脾湯加杏仁也雄按彼二方有薑棗專祛上焦濕熱痰氣與苓桂朮甘湯互發彼借苓朮專祛心下之支飲此借石膏專祛膈上之濕熱也汪按此語可商石膏除熱非祛濕之品也尤在涇曰汗出而喘無大熱者其邪不在經腠而在肺中故非桂枝所能發麻杏辛甘入肺散邪氣肺被邪鬱而生熱石膏辛寒入肺除熱氣甘草甘溫安中氣且以助其散邪清熱之用乃肺臟邪氣發喘之的劑也又曰大青龍主散表寒而兼清裡熱故麻黃多於石膏此清肺熱而兼散肺邪故石膏多於麻黃白頭翁湯白頭翁二兩秦皮黃連黃柏各三兩水七升煮取二升去滓溫服一升柯韻伯曰三陰俱有下利證自利不渴者屬太陰是臟有寒也自利渴者屬少陰以下焦虛寒津液不升故引水自救也惟厥陰下利屬於熱以厥陰主肝而司相火肝旺則氣上撞心火鬱則熱利下重溫熱穢氣奔迫廣腸魄門重滯而難出內經云暴注下迫者是矣脈沉為在裡弦為肝脈是本郁之徵也渴欲飲水厥陰病則消渴也白頭翁臨風偏靜長於驅風用為君者以厥陰風木風動則木搖而火旺欲平走竅之火必寧搖動之風秦皮木小而高得清陽上升之象為臣是木鬱達之所以遂其發陳之性也黃連瀉君火可除上焦之渴是苦以發之黃柏瀉相火可止下焦之利是苦以堅之也治厥陰熱利有二初利用此方以升陽散火是謂下者舉之寒因熱用法久利則用烏梅丸之酸以收火佐以苦寒雜以溫補是謂逆之從之隨所利而行之調其氣使之平也雄按徐氏亦云烏梅丸治久痢之聖方也縮脾飲縮砂仁烏梅肉草果仁煨甘草炙各四兩乾葛白扁豆各二兩每服四錢水一碗煎八分水澄冷服以解煩或欲溫欲熱任意服雄按脾為陰土喜燥而惡濕貪涼飲冷則脾陽為濕所滯而緩縱解佚不能宣運如常矣故以砂仁草果快脾而去其所惡之濕臣以甘草扁豆甘淡以培其正氣即佐葛根烏梅一以振其敷布之權一以縮其緩縱之勢況梅能生液濕去津生最為可法三甲散鱉甲龜甲並用酥炙黃為末各一錢如無酥各以醋炙代之穿山甲土炒黃為末蟬蛻洗淨炙乾白殭蠶切生用牡蠣煅為末當歸各五分白芍酒炒七分甘草三分䗪蟲三個乾者擘碎鮮者杵爛和酒少許取汁入湯藥同服其滓入諸藥同煎水二鍾煎八分濾去滓溫服雄按此方從金匱鱉甲煎丸脫胎白虎加蒼朮湯即白虎湯加蒼朮一味葉香岩曰知母氣味苦寒入足陽明甘草氣味甘平入足太陰石膏氣味辛寒入手太陰足陽明蒼朮氣味苦辛溫入足太陰粳米氣味甘平入手足太陰此治暑濕相搏而為濕溫病者以苦寒辛寒之藥清其暑以辛溫雄烈之藥燥其濕而以甘平之藥緩其中則賊邪正邪皆卻正自安矣清暑益氣湯人參黃耆白朮廣皮神麯澤瀉各五分蒼朮升麻各一錢麥冬炙草葛根當歸黃柏各二分青皮二分半五味子九粒水二盞煎一盞去滓溫服雄按治法匯止用參耆朮草歸身橘皮五味麥冬黃柏九味加薑棗汪按東垣此方洄溪已譏其用藥雜亂此去蒼朮升麻葛根是矣然猶不免近雜用此方者加減尚宜斟酌王晉三曰此治膏粱之體因避暑而襲涼飲冷內傷脾胃抑遏真陽之劑故方中以清解與補益兼施尤拙吾曰元氣本虛而又傷於暑濕以致四肢倦怠精神短少懶於動作胸氣短促不思飲食脈浮緩而遲者雄按其脈如是乃氣虛濕盛兼吸微暑也可用此方若體實脈盛或雖虛而不甚及津涸煩渴多火者則不可混投也雄按濕熱病篇第三十八條後余有清暑益氣法可用也汪按夢隱所定清暑益氣方用西洋參石斛麥冬黃連竹葉荷稈知母甘草梗米西瓜翠衣十味較東垣之方為妥然臨證尚宜加減斟酌又按傷暑倦怠投參麥五味立效然必審其無外感者若有暑邪投之其危立至不可不慎也雄按東垣專事升陽徐洄溪章杏云皆深非之此方亦從補中益氣加味魏柳洲云補中益氣湯為東垣治內傷外感第一方後人讀其書者鮮不奉為金科玉律然不知近代病人類多真陰不足上盛下虛者十居八九即遇內傷外感之證投之輒增劇非此方謬要知時代稟賦各殊耳陸麗京嘗言陰虛人誤服補中益氣往往暴脫司命者審諸今人吸烟者多陰液既已耗傷痰氣極易升逆按丹溪云素無痰者服升柴不致滿悶孫文垣云經謂升降浮沉必順之又曰天時不可伐雖宜升提之病而冬之閉藏實為春令發生之本天人一理若不顧天時而強用升提之法是伐天和而泄元氣根本既虧來春何以發生此等至理皆不可不知也余謂東垣立方命名本錯設當時立此培中舉陷之法名曰補中升氣湯則後人顧名思義咸知其為升劑矣原以升藥舉陷乃既曰補中復云益氣後人遂以為參朮得升柴如黃耆得防風而功愈大既能補脾胃之不足又可益元氣之健行凡屬虛人皆堪服餌而忘其為治中虛兼外感之方再經立齊之表章每與腎氣丸相輔而行幸張會卿一靈未泯雖好溫補獨謂此方未可浪用奈何以盧不遠之賢亦袒新甫甚矣積重之難返也惟葉天士謂立齊用藥每執死法未免有不中肯綮者汪按洄溪亦以立齊為庸醫之首生脈散方見濕熱病篇第三十九條香薷飲四味香薷飲黃連香薷飲五物香薷飲十味香薷飲並見濕熱病篇第四十條真人養臟湯人參白朮炒焦各錢半肉桂訶子肉木香肉豆蔻罌粟殼各五分水煎溫服一方有白芍甘草甚者加附子五分雄按此治久瀉而脾腎虛寒臟氣不撮之方也汪按此方訶子肉罌粟殼並用較益黃散更澀亦宜未服不宜煎服又按此方必純屬虛寒者方可用若用以治暑熱之痢則必噤口告危殺人如草矣冷香飲子附子炮陳皮草果各一錢炙甘草一錢五分生薑五片水一鍾煎滾即濾井水頓冷服雄按此方與大順散皆治陰寒冷濕之氣客於太少二陰而為霍亂吐下之方也多由畏熱而浴冷臥風過啖冰瓜所致乃暑月之中寒證非病暑也若痢疾門中可用此方之證甚屬罕見苟諦審未確切須慎之萬一誤投噬臍奚及洄溪云如有暑邪者姜斷不可用雖佐芩連不可救也況薑附同用而無監製之品可乎俞東扶云昔羅謙甫治商參政與完顏小將軍二案俱用熱藥俱不名曰暑病又吳球治遠行人一案雖在暑月直曰中寒蓋恐後世誤以熱藥治暑特舉病因以稱之可謂名正言順矣蓋寒暑者天地一定之陰陽不容混淆隆冬既有熱病盛夏豈無寒病故辨證為醫家第一要務辨證既明自然不惑於悠悠之謬論而無倒行逆施遺人夭殃之慮矣敗毒散羌活獨活柴胡前胡川芎枳殼桔梗茯苓甘草薄荷為細末每服二錢水一盞煎七分溫服或沸湯點服亦得雄按此即活人本方去人參姜加薄荷余師愚曰此足三陽藥也羌活入太陽而理遊風獨活入太陰而理伏邪兼能除痛柴胡散熱升清協川芎和血平肝以治頭痛目昏前胡枳殼降氣行痰協桔梗茯苓以泄肺熱而除濕消腫甘草和里更以薄荷為君取其清涼氣味皆薄疏導經絡表散能除高巔邪熱方名敗毒良有以也疫證初起服此先去其爪牙雄按爪牙者表邪之謂也無表邪者不可用也使邪不盤踞經絡有斑即透較升葛荊防發表多多矣如口乾舌燥加黃芩喉痛加山豆根倍甘桔雄按雖加苦寒之品終嫌升散必惡寒無汗者始可用也古方引用生薑生薑性太熱與疫證不宜以蔥白易之可也雄按喻氏論疫推服此方為第一極言其功效之神後人從而和之然羌獨柴芎類屬溫升考活人書治傷寒瘟疫風濕風眩拘蜷風痰頭痛目眩四肢痛憎寒壯熱項強睛疼則所治者原是風寒濕障雜感之傷寒瘟疫並非兼治暑燥之病者余氏因熊氏先剪爪牙之說遂謂溫熱之疫初起亦當先服此方雖每服二錢尚是小劑但必外挾風寒濕之表邪者始為合拍否則熱得風而愈熾能無亢逆之憂乎惟桔梗湯最為中窾用者審之清瘟敗毒飲生石膏大劑六兩至八兩中劑二兩至四兩小劑八錢至一兩二錢小生地大劑六錢至一兩中劑三錢至五錢小劑二錢至四錢烏犀角大劑六錢至八錢中劑三錢至五錢小劑二錢至四錢真川連大劑四錢至六錢中劑二錢至四錢小劑一錢至一錢半梔子桔梗黃芩知母赤芍元參連翹甘草丹皮鮮竹葉先煮石膏數十沸後下諸藥犀角磨汁和服此十二經泄火之藥也凡一切火熱表裡俱盛狂躁煩心口乾咽痛大熱乾嘔錯語不眠吐血衄血熱甚發斑不論始終以此為主方蓋斑疹雖出於胃亦諸經之火有以助之重用石膏直入胃經使其敷布於十二經退其淫熱佐以黃連犀角黃芩泄心肺火於上焦丹皮梔子赤芍泄肝經之火連翹元參解散浮游之火生地知母抑陽扶陰泄其亢甚之火而救欲絶之水桔梗竹葉載藥上行使以甘草和胃此大寒解毒之劑重用石膏則甚者先平而諸經之火自無不安矣若疫證初起惡寒發熱頭痛如劈煩躁譫妄身熱肢冷舌刺唇焦上嘔下泄六脈沉細而數即用大劑沉而數者即用中劑浮大而數者用小劑如斑一出即加大青葉並少佐升麻四五分引毒外透此內化外解濁降清升之法治一得一治十得十以視升提發表而加劇者何不俯取芻蕘之一得乎雄按觀此說則初起不必用剪爪牙之法也又秦皇士治斑用升麻黃連生地丹皮甘草木通名升麻清胃湯輕清涼血亦是透化斑疹之妙法誤食葷腥者加山楂砂仁乾隆甲申余客中州先君偶染時疫為群醫所誤抱恨終天曷其有極思於此證必有以活人者公之於世亦以稍釋余懷因讀本草言石膏性寒大清胃熱味淡氣薄能解肌熱體沉性降能泄實熱恍然大悟非石膏不足以治熱疫遇有其證輒投之無不得心應手三十年來頗堪自信活人所不治者筆難罄述然一人之治人有限因人以及人無窮因著為疫疹一得公之於世使天下有病斯疫者起死回生咸登壽域余心庶稍安焉桐城余霖漫識吳種芝曰甲寅夏久無雨暑氣盛行人多疾病病則必死醫家齊束手不治師愚輒豫以石膏黃連等劑無不立效其得之則生不得則死者不可更僕數而余門下奎氏兄弟一存一夭尤屬明徵然存活日多而謗者日益衆謂師愚非石膏不立劑是誣人甚至以謗師愚之故並謂石膏為斷不可用豈不更誣藥哉誣人既已不可誣藥而愚者信焉妄者傳焉雖遇熱證凶危仍以柴葛當之不效則投以丹芩又不效則投以人參桂附雄按粗工伎倆大率如此至於一誤再誤死而後已醫者猶詡詡得意曰非我也命也是以謗師愚之故而纍及無辜置人之生死於弗顧也豈不大可嘆哉莊制亭曰此方分兩太重臨證時不妨量裁一二味或減輕分兩如石膏由三五錢以至二三兩皆可取效汪按石膏體重若止用三五錢似嫌太少雄按余君治祁某案後云此方醫家不敢用病家不敢服甚至藥肆不敢賣有此三不敢疫證之死於誤者不知凡幾紀文達公於癸丑年曾目擊師愚之法活人無算而謂其石膏有一劑用至八兩一人服至四斤因而疑為司天運氣所值未可執為通例余氏書中亦羅列運氣之說然則甲子甲申戊子丙午癸丑甲寅等年歲運並不同何以案中治法皆同乎此司天在泉之不可泥但察其時之旱潦見證之宜否為可憑也道光中歸安江筆花治一時疫發斑用石膏至十四斤而斑始透蓋深得師愚之法者而王豫中太史白田集有石膏辨云目擊受石膏之害者甚多深以繆仲淳袁體庵為不可法賢者尚爾無怪乎庸耳俗目之謗師愚也夫停食不消因而致死者多矣豈可歸罪於五穀以為神農后稷作俑而令天下人辟穀耶況物性之中和莫如谷矣而霍亂痧脹一口米湯下咽即難救治蓋一病有一病之宜忌用得其宜硝黃可稱補劑苟犯其忌參術不異砒硇故不可舍病之虛實寒熱而不論徒執藥性之純駁以分良毒也補偏救弊隨時而中貴於醫者之識病耳先議病後議藥中病即是良藥汪按凡藥能治病者誤用即能殺人參朮與硝黃無異也貴於中病而已乃世人無病者偏好服藥及有病又不議病而議藥醫者欲其道之行藉以謀生相率阿世取容偶有特立之士力排衆論別出心裁如師愚者且群目為怪物矣欲求醫學之昌明何可得乎此數語乃醫者之良針處方之軌範吾願世之醫人取而三復之然讀書以明理明理以致用苟食而不化則粗庸偏謬貽害無窮非獨石膏為然矣搢紳先生博覽之餘往往涉獵岐黃家言或筆之於書或參贊親友之病世人因信其知儒遂並信其知醫孰知紙上談兵誤人不淺呂晚村是其尤者也安得如徐洄溪者一一而砭之哉汪按洄溪有涉獵醫書誤人論言皆切中可以垂戒而醫貫砭一書尤極有功於醫學無如世之庸耳俗目推尊晚村者終不肯信也可嘆錫類散象牙屑焙珍珠各三分飛青黛六分梅花冰片三釐壁錢俗名喜兒窠二十個用泥壁上者木板上者勿用西牛黃人指甲男病用女女病用男分別合配各五釐研極細粉密裝瓷瓶內勿使泄氣專治爛喉時證及乳蛾牙疳口舌腐爛凡屬外淫為患諸藥不效者吹入患處瀕死可活雄按此方尤鶴年附載於金匱翼云張瑞符傳此救人而得子故餘名之曰錫類散功效甚著不能殫述硃砂安神丸透明硃砂另研黃連各五分生地三錢當歸甘草各二錢為細末酒泡蒸餅丸如麻子大即以硃砂為衣每服三十丸臥時津液咽下葉仲堅曰經云神氣舍心精神畢具又云心者生之本神之舍也且心為君主之官主不明則精氣亂神太勞則魂魄散所以寤寐不安淫邪發夢輕則驚悸怔忡重則癡妄癲狂硃砂具光明之體赤色通心重能鎮怯寒能勝熱甘以生津抑陰火之浮游以養上焦之元氣為安神之第一品心苦熱配黃連之苦寒瀉心熱也更佐甘草之甘以瀉之心主血用當歸之甘溫歸心血也更佐地黃之寒以補之心血足則肝得所藏而魂自安心熱解則肺得其職而形自正也集靈膏人參枸杞子各一斤天冬麥冬生地熟地各二十八兩淮牛膝酒蒸四兩甜水砂鍋熬膏將成加煉白蜜六兩滾數沸收之白湯或酒調服雄按先大父云此方始見於廣筆記云出內府又載於治法匯而無牛膝方後注血虛加當歸四兩脾弱加白朮四兩或半斤且云治一切氣血兩虛身弱咳嗽者罔不獲效凡少年但覺氣弱倦怠津液少虛火上炎急宜服之後惟魏玉橫善用此方續名醫類案內極著其功效實即人參固本加味也或又加仙靈脾余謂峻滋肝腎之陰無出此方之右者若兼帶下遺精者宜去牛膝加黃柏大便易滑者亦去牛膝重加生薏仁理虛元鑑治勞嗽用本方去人參牛膝加元參甘桔麥冬湯麥冬一兩炙甘草二兩鮮竹葉十五瓣北棗肉兩枚為細末每服五錢粳米湯盞半煎至一盞溫服不能服者綿漬點口中如加人參更妙雄按此海藏方也即金匱麥門冬湯去半夏加竹葉治房勞復之氣欲絶者服之大效然外臺於此證主一味竹皮湯以竹皮堅韌能固氣液之脫而清虛火方中似不可缺又枸杞子純甘多液能補精神氣血之耗傷凡氣喘吸促根蒂欲漓者可加入兩許殊勝人參熟地也即不因房勞而氣液兩虧不能受重劑峻補者余亦用此法接續其一線之生機每多獲效推而廣之可以養心營可以潤肺燥汪按嗽證肺雖虛而尚有邪者麥冬究宜慎用可以緩肝急可以補脾陰其用多矣宜易其名曰小復脈湯
