body:
  text: 卷四陳平伯外感溫病篇雄按此與下篇相傳為陳薛所著究難考實姑從俗以標其姓字俟博雅正之蓋聞外感不外六淫而民病當分四氣治傷寒家徒守發表攻裡之成方不計辛熱苦寒之貽害遂使溫熱之旨矇昧不明醫門缺典莫此甚焉祖恭不敏博覽群書廣搜載籍而恍然於溫熱病之不可不講也內經云冬不藏精春必病溫蓋謂冬令嚴寒陽氣內斂人能順天時而固密則腎氣內充命門為三焦之別使亦得固腠理而護皮毛雖當春令升泄之時而我身之真氣則內外彌綸不隨升令之泄而告匱縱有客邪安能內侵是內經所以明致病之原也然但云冬不藏精而不及他時者以冬為水旺之時屬北方寒水之化於時為冬於人為腎井水溫而堅冰至陰外陽內有習坎之義故立言歸重於冬非謂冬宜藏而他時可不藏精也雄按喻氏云春夏之病皆起於冬至秋冬二時之病皆起於夏夏月藏精則熱邪不能侵與冬月之藏精而寒邪不能入者無異也故丹溪謂夏月必獨宿淡味保養金水二臟尤為攝生之儀式焉即春必病溫之語亦是就近指點總見裡虛者表不固一切時邪皆易感受學者可因此而悟及四時六氣之為病矣雄按此論冬不藏精春易病溫之理甚通惟不知有伏氣為病之溫是其蔽也陳氏此篇與鞠通條辨皆葉氏之功臣然幼科要略明言有伏氣之溫熱二家竟未細繹毋乃疏乎二家且然下此者更無論矣難經云傷寒有五有傷寒雄按麻黃湯證是也有中風雄按桂枝湯證是也有風溫雄按冬溫春溫之外受者有熱病雄按即暑病也又謂之暍有濕溫雄按即暑兼濕為病也亦曰濕熱夫統此風寒濕熱之邪而皆名之曰傷寒者亦早鑑於寒臟受傷外邪得入故探其本而皆謂之傷寒也雄按仲景本論治法原有區別界畫甚嚴後人不察罔知所措多致誤人茲余輯此專論以期瞭然於學者之心目也獨是西北風高土燥風寒之為病居多雄按亦不盡然東南地卑水濕濕熱之傷人獨甚從來風寒傷形傷形者定從表入濕熱傷氣傷氣者不盡從表入故治傷寒之法不可用以治溫熱也夫溫者暖也熱也非寒之可比也風邪外束則曰風溫濕邪內侵則曰濕溫縱有微寒之兼襲不同栗冽之嚴威是以發表宜辛涼不宜辛熱清裡宜泄熱不宜逐熱雄按亦有宜逐者總須辨證耳蓋風不兼寒即為風火濕雖化熱終屬陰邪雄按濕固陰邪其兼感熱者則又不可謂之陰矣自昔仲景著書不詳溫熱遂使後人各呈家伎漫無成章而凡大江以南病溫多而病寒少雄按北省溫病亦多於傷寒投以發表不遠熱攻裡不遠寒諸法以致死亡接踵也悲夫雄按篇中非伏氣之說皆為節去棄瑕録瑜後皆仿此風溫為病春月與冬季居多或惡風或不惡風必身熱咳嗽煩渴此風溫證之提綱也自注春月風邪用事冬初氣暖多風雄按冬暖不藏不必定在冬初也故風溫之病多見於此但風邪屬陽陽邪從陽必傷衛氣人身之中肺主衛又胃為衛之本是以風溫外薄肺胃內應風溫內襲肺胃受病其溫邪之內外有異形而肺胃之專司無二致故惡風為或有之證而熱渴咳嗽為必有之證也三復仲景書言溫病者再一則曰太陽病發熱而渴不惡寒者為溫病此不過以不惡寒而渴之證辨傷寒與溫病之異而非專為風溫敘證也雄按此言伏氣發為春溫非冬春所感之風溫故曰太陽病以太陽為少陰之表也再則曰發汗已身灼熱者名曰風溫夫灼熱因於發汗其誤用辛熱發汗可知仲景復申之曰風溫為病脈陰陽俱浮自汗出身重多眠睡鼻息必鼾語言難出凡此皆誤汗劫液後變見之證非溫病固有之證也續云若被下者直視失溲若被火者發黃色劇則如驚癇狀時瘈瘲若火熏之一逆尚引日再逆促命期亦止詳用下用火之變證而未言風溫之本來見證也雄按此言溫病誤汗熱極生風故曰風溫乃內風也非冬春外感之風溫陳氏不知有伏氣春溫之病強為引證原可刪也然病之內外雖殊證之屬溫則一姑存之以為後學比例然從此細參則知風溫為燥熱之邪燥令從金化燥熱歸陽明故肺胃為溫邪必犯之地且可悟風溫為燥熱之病燥則傷陰熱則傷津泄熱和陰又為風溫病一定之治法也反此即為逆矣用是不辭僭越而於仲景之無文處求文無治處索治敘證施治列為條例知我罪我其在斯乎雄按外感溫病仲聖雖未言而葉氏已詳論矣風溫證身熱畏風頭痛咳嗽口渴脈浮數舌苔白者邪在表也當用薄荷前胡杏仁桔梗桑葉川貝之屬涼解表邪楊云前胡桔梗一降一升以泄肺邪誠善然桔梗宜少用自注風屬陽邪不挾寒者為風溫陽邪必傷陽絡是以頭痛畏風邪郁肌表肺胃內應故咳嗽口渴苔白邪留於表故脈浮數表未解者當先解表但不同於傷寒之用麻桂耳雄按何西池云辨痰之法古人以黃稠者為熱稀白者為寒此特言其大概而不可泥也以外感言之傷風咳嗽痰隨嗽出頻數而多色皆稀白誤作寒治多致困頓蓋火盛壅逼頻咳頻出停留不久故未至於黃稠耳逮火衰氣平咳嗽漸息痰之出者半日一口反黃而稠緣火不上壅痰得久留受其煎煉使然耳故黃稠之痰火氣尚緩而微稀白之痰火氣反急而盛也此皆當用辛涼解散而不宜於溫熱者推之內傷亦然孰謂稀白之痰必屬於寒哉總須臨證細審更參以脈自可見也風溫證身熱咳嗽自汗口渴煩悶脈數舌苔微黃者熱在肺胃也當用川貝牛蒡桑皮連翹橘皮竹葉之屬涼泄裡熱此溫邪之內襲者肺熱則咳嗽汗泄胃熱則口渴煩悶苔白轉黃風從火化故以清泄肺胃為主雄按苔黃不甚燥者楊云故條中言微黃亦具見斟酌治當如是若黃而已干則桑皮橘皮皆嫌其燥須易栝蔞黃芩庶不轉傷其液也風溫證身灼熱口大渴咳嗽煩悶譫語如夢語脈弦數乾嘔者此熱灼肺胃風火內旋當用羚羊角川貝連翹麥冬石斛青蒿知母花粉之屬以泄熱和陰此溫邪襲入肺胃之絡灼爍陰津引動木火故有煩渴嘔逆等證急宜泄去絡中之熱庶無風火相煽走竄包絡之虞雄按嗽且悶麥冬未可即授嫌其滋也汪按徐洄溪謂麥冬能滿肺氣非實嗽所宜是也以為大渴耶已有知母花粉足勝其任矣木火上衝而乾嘔則青蒿雖清少陽而嫌乎升矣宜去此二味加以梔子竹茹枇杷葉則妙矣楊云議藥細極微芒讀者不可草草讀過風溫證身熱咳嗽口渴下利苔黃譫語胸痞脈數此溫邪由肺胃下注大腸當用黃芩桔梗煨葛豆卷甘草橘皮之屬以升泄溫邪大腸與胃相連屬與肺相表裡溫邪內逼下注大腸則下利治之者宜清泄溫邪不必專於治利按傷寒論下利譫語者有燥矢也宜大承氣湯是實熱內結逼液下趨必有舌燥苔黃刺及腹滿痛證兼見故可下以逐熱若溫邪下利是風熱內迫雖有譫語一證仍是無形之熱蘊蓄於中而非實滿之邪盤結於內故用葛根之升提不任硝黃之下逐也汪按升提亦所不任雄按傷寒為陰邪未曾傳腑化熱最慮邪氣下陷治必升提溫散而有早下之戒溫熱為陽邪火必剋金故先犯肺火性炎上難得下行若肺氣肅降有權移其邪由腑出正是病之去路升提胡可妄投楊云小兒患疹必下利與此正同故溫病多有發疹者誤升則邪入肺絡必喘吼而死既云宜清泄其邪不必專於治利矣況有咳嗽胸痞之兼證豈葛根豆卷桔梗之所宜乎當易以黃連桑葉銀花須知利不因寒潤藥亦多可用仲聖以豬膚白蜜治溫病下利寓意草論肺熱下利最詳學者宜究心焉且傷寒與溫熱邪雖不同皆屬無形之氣傷寒之有燥矢並非是氣結乃寒邪化熱津液耗傷糟粕煉成燥矢耳溫熱病之大便不閉為易治者以臟熱移腑邪有下行之路所謂腑氣通則臟氣安也設大便閉者熱爍胃津日久亦何嘗無燥矢宜下之證哉惟傷寒之大便不宜早解故必邪入於腑始可下其燥矢溫熱由肺及胃雖不比疫證之下不嫌早而喜其便通宜用清涼故結成燥矢者較少耳憶嘉慶己卯春先君子病溫而大便自利彼時吾杭諸名醫咸宗陶節庵書以治傷寒不知所謂溫證也見其下利悉用柴葛升提提而不應或云是漏底證漸投溫補病日以劇將治木矣父執翁七丈忘其字矣似是立賢二字薦浦上林先生來視浦年甚少診畢即曰是溫證也殆誤作傷寒治而多服溫燥之藥乎幸而自利不止熱勢尚有宣泄否則早成灰燼奚待今日耶即用大劑犀角石膏銀花花粉鮮生地麥冬等藥囑煎三大碗置於榻前頻頻灌之藥未煎成之際先笮蔗漿恣飲之諸戚長見方相顧莫決賴金履思丈力持煎其藥至一周時服竣病有起色遂以漸愈時雄年甫十二聆其言而心識之逾二年先君捐館雄糊口遠遊聞浦先生以善用清涼為衆口所鑠乃從事於景嶽而以溫補稱枉道徇人惜哉然雄之究心於溫熱實浦先生有以啓之也浦今尚在因其遠徙於鄉竟未遑往質疑義為恨附記於此聊志感仰之意云爾風溫證熱久不愈咳嗽唇腫口渴胸悶不知飢身發白疹如寒粟狀自汗脈數者此風邪挾太陰脾濕發為風疹楊云白疹乃肺胃濕熱也與脾無涉亦與風無涉用牛蒡荊芥防風連翹橘皮甘草之屬涼解之風溫本留肺胃若太陰舊有伏濕者風熱之邪與濕熱相合流連不解日數雖多仍留氣分由肌肉而外達皮毛發為白疹蓋風邪與陽明營熱相併則發斑與太陰濕邪相合則發疹也又有病久中虛氣分大虧而發白疹者必脈微弱而氣倦怯多成死候不可不知汪按前說即白如水晶色之白㾦後說即白如枯骨之白㾦也雄按白疹即白㾦也雖挾濕邪久不愈而從熱化且汗渴脈數似非荊防之可再表楊云此濕亦不必用橘皮之燥宜易滑石葦莖通草楊云精當斯合涼解之法矣若有虛象當與甘藥以滋氣液風溫證身熱咳嗽口渴胸痞頭目脹大面發泡瘡者風毒上壅陽絡當用荊芥薄荷連翹元參牛蒡馬勃青黛銀花之屬以清熱散邪此即世俗所謂大頭病也古人用三黃湯主治然風熱壅遏致絡氣不宣頭腫如斗終不若仿普濟消毒飲之宣絡滌熱為佳汪按方附見九十五風溫證身大熱口大渴目赤唇腫氣粗煩躁舌絳齒板痰咳甚至神昏譫語下利黃水者風溫熱毒深入陽明營分最為危候用犀角連翹葛根元參赤芍丹皮麥冬紫草川貝人中黃解毒提斑間有生者楊云葛根麥冬俱與證不甚登對此風溫熱毒內壅肺胃侵入營分上下內外充斥肆逆若其毒不甚重或氣體壯實者猶可挽回否則必壞風溫毒邪始得之便身熱口渴目赤咽痛臥起不安手足厥冷泄瀉脈伏者熱毒內壅絡氣阻遏當用升麻楊云凡涉咽痛者一用升麻則邪入肺絡必喘吼而聲如曳鋸陳氏想未之見耳黃芩犀角銀花甘草豆卷之屬升散熱毒此風溫毒之壅於陽明氣分者楊云仍是肺病即仲景所云陽毒病是也五日可治七日不可治乘其邪犯氣分未入營陰故可升散而愈風溫證身熱自汗面赤神迷身重難轉側多眠睡鼻鼾語難出脈數者溫邪內逼陽明精液劫奪神機不運用石膏知母麥冬半夏竹葉甘草之屬泄熱救津鼻鼾面赤胃熱極盛人之陰氣依胃為養熱邪內灼胃液乾枯陰氣復有何資而能滲諸陽灌諸絡是以筋骨懈怠機關失運急用甘涼之品以清熱濡津或有濟也雄按宜加西洋參百合竹瀝風溫證身熱痰咳口渴神迷手足瘈瘲狀若驚癇脈弦數者此熱劫津液金囚木旺當用羚羊川貝青蒿連翹知母麥冬鉤藤之屬以息風清熱肺屬金而畏火賴胃津之濡養以肅降令而溉百脈者也熱邪內盛胃津被劫肺失所資木為火之母子能令母實火旺金囚木無所畏反侮所不勝是以筋脈失養風火內旋瘈瘲驚癇在所不免即俗云發痙是也故以息風清熱為主治雄按可加元參梔子絲瓜絡風溫證熱渴煩悶昏憒不知人不語如尸厥脈數者此熱邪內蘊走竄心包絡當用犀角連翹焦遠志鮮石菖蒲麥冬川貝牛黃至寶之屬泄熱通絡熱邪極盛與三焦相火相煽最易內竄心包逼亂神明閉塞絡脈以致昏迷不語其狀如尸俗謂發厥是也閉者宜開故以香開辛散為務熱邪極盛三焦相火相煽最易內竄心包逼亂神明閉塞絡脈雖是喻氏之言而法以香開辛散然熱極似水一派煙霧塵天矇住心胸不知不識如人行煙塵中口鼻皆燥非兩解不能散其勢再入溫熱之處則人當燥悶死矣且溫熱多燥辛香之品盡是燥燥與熱鬥立見其敗且心神為熱邪蒸圍非閉塞也有形無形治法大異遇此每在敗時故前人不能探其情今補薛生白先生一法於後汪按此乃駁香開辛散之法而別立一法與本書異趣蓋此條當是他人附贅之評語非本書也極明雄黃一兩研極細入銅勺內又研提淨牙硝六錢微火熔化撥勻如水時楊云雄黃多而牙硝少何能勻撥如水兩字錢字必有一誤急濾清者於碗粗渣不用凝定此丹灶家祕製也凡遇前證先用陳雨水十碗內取出一碗煎木通一錢通草三錢傾入九碗冷水內又取犀角磨入三錢或旋磨旋與亦可每碗約二三分再將制雄挑二三釐入碗冷與服時時進之能於三日內進之盡必有清痰吐出數碗而愈楊云據此用法當是黃一分硝六分也十救七八蓋此證死期最緩而醫人無他法每每付之天命牛黃清心而已可勝長嘆雄按煉雄黃法昉於遊宦紀聞見知不足齊叢書薛生白濕熱病篇雄按江本吳本俱作濕溫雄按此篇始見於舒松摩重刻醫師祕笈後云是薛作章氏從而釋之而江白仙本以附陳作後吳子音溫熱贅言連前篇併為一人之書並不標明何人所著但曰寄瓢子述且前篇之末有今補薛生白先生一法於後云云則此篇亦非薛著矣其江本所補一法又無薛生白三字且此篇張友樵所治酒客之案但稱曰余診言人人殊無從核實姑存疑以質博雅一濕熱證雄按既受濕又感暑也即是濕溫亦有濕邪久伏而化熱者喻氏以為三氣者謂夏令地氣已熱而又加以天上之暑也始惡寒後但熱不寒汗出胸痞舌白吳本下有或黃二字口渴不引飲雄按甘露消毒丹最妙吳本雖出江本之後無甚異同所附酒客一案云是其師治似較江本為可信也故引證但據吳本而江本從略自注此條乃濕熱證之提綱也濕熱病屬陽明太陰經者居多章虛谷云胃為戊土屬陽脾為己土屬陰濕土之氣同類相召故濕熱之邪始雖外受終歸脾胃也中氣實則病在陽明中氣虛則病在太陰外邪傷人必隨人身之氣而變如風寒在太陽則惡寒傳陽明即變為熱而不惡寒今以暑濕所合之邪故人身陽氣旺即隨火化而歸陽明陽氣虛即隨濕化而歸太陰也病在二經之表者多兼少陽三焦雄按此二句從吳本補入病在二經之裡者每兼厥陰風木以肝脾胃所居相近也以少陽厥陰同司相火少陽之氣由肝膽而升流行三焦即名相火陽明太陰濕熱內郁郁甚則少火皆成壯火而表裡上下充斥肆逆經曰少火生氣壯火食氣少火者陽和之生氣即元氣也壯火為亢陽之暴氣故反食其元氣食猶蝕也外邪郁甚使陽和之氣悉變為亢暴之氣而充斥一身也故是證最易耳聾乾嘔發痙發厥暑濕之邪矇蔽清陽則耳聾內擾肝脾胃則乾嘔而痙厥也而提綱中不言及者因以上諸證皆濕熱病兼見之變局而非濕熱病必見之正局也必見之證標於提綱使人辨識不至與他病混亂其兼見之變證或有或無皆不可定若標之反使人迷惑也始惡寒者陽為濕遏而惡寒終非若寒傷於表之惡寒濕為陰邪始遏其陽而惡寒即與暑合則兼有陽邪終非如寒邪之純陰而惡寒甚也後但熱不寒則鬱而成熱反惡熱矣雄按後則濕鬱成熱故反惡熱所謂六氣皆從火化也況與暑合則化熱尤易也熱盛陽明則汗出章云熱在濕中蒸濕為汗濕蔽清陽則胸痞濕邪內盛則舌白濕熱交蒸則舌黃雄按觀此句則提綱中舌白下應有或黃二字熱則液不升而口渴濕則飲內留而不引飲章云以上皆明提綱所標為必有之證也然所云表者乃太陰陽明之表而非太陽之表濕熱邪歸脾胃非同風寒之在太陽也雄按據此則前病在太陰下必有脫簡應從吳本補入太陰之表四肢也陽明也陽明之表肌肉也胸中也四肢稟氣於脾胃而肌肉脾胃所主若以脾胃分之則胃為脾之表胸為胃之表也故胸痞為濕熱必有之證四肢倦怠肌肉煩疼亦必並見此濕熱在脾胃之表證也其所以不幹太陽者以太陽為寒水之腑主一身之表雄按肺為天天包地外而處於上膀胱為水水環地極而處於下故皆為一身之表而風為陽邪首及肺經寒為陰邪先犯膀胱惟濕為中土之氣胃為中土之腑故胃受之楊云此注奇情至理所謂語必驚人總近情也風寒必自表入故屬太陽雄按陳亮師云風邪上受肺合皮毛故桂枝證有鼻鳴乾嘔也濕熱之邪從表傷者十之一二章云是濕隨風寒而傷表郁其陽氣而變熱如仲景條內之麻黃赤小豆湯證是也由口鼻入者十之八九暑熱熏蒸之氣必由口鼻而入陽明為水穀之海太陰為濕土之臟故多陽明太陰受病濕輕暑重則歸陽明暑少濕多則歸太陰膜原者外通肌肉內近胃腑即三焦之門戶實一身之半表半裡也雄按此與葉氏溫熱篇第三章之論合邪由上受直趨中道故病多歸膜原章云外經絡內臟腑膜原居其中為內外交界之地凡口鼻肌肉所受之邪皆歸於此也其為三焦之門戶而近胃口故膜原之邪必由三焦而入脾胃也楊云細繹此言則膜原乃人脂內之膜也然邪之由鼻入者必先至肺由口入者必先至胃何以云必歸膜原此不可解者也若云在內之邪必由膜原達外在外之邪必由膜原入內則似矣要之濕熱之病不獨與傷寒不同且與溫病大異溫病乃少陰太陽同病此仲景所論伏氣之春溫若葉氏所論外感之風溫則又不同者矣雄按此注知有少陰太陽之溫病則與前篇風溫條例力非伏氣之論者斷非一人之筆即按文義亦彼遜於此吳氏何以併為一家江本必欲相合強為刪改豈非自呈僞妄耶汪按前篇自序自稱其名曰祖恭未言又有此篇此篇又無自序其非出一人手明甚夢隱辨之是也濕熱乃陽明太陰同病也始受於膜原終歸於脾胃而提綱中言不及脈者以濕熱之證脈無定體或洪或緩或伏或細各隨證見不拘一格故難以一定之脈拘定後人眼目也陽明熱盛見陽脈太陰濕盛見陰脈故各隨證見也濕熱之證陽明必兼太陰者徒知臟腑相連濕土同氣而不知當與溫病之必兼少陰比例少陰不藏水火內燔風邪外襲表裡相應故為溫病此即經言冬不藏精春發溫病先由內傷而後外感膏粱中人多有之其冬傷於寒曰少陰伏邪至春發出於太陽之溫病藜藿中人多有之皆必兼少陰者也若外感風溫邪由上受者又當別論矣太陰內傷濕飲停聚客邪再至內外相引故病濕熱脾主為胃行津液者也脾傷而不健運則濕飲停聚故曰脾虛生內濕也雄按此言內濕素盛者暑邪入之易於留著而成濕溫病也此皆先有內傷再感客邪非由腑及臟之謂若濕熱之證不挾內傷中氣實者其病必微雄按內濕不盛者暑邪無所依傍雖患濕溫治之易愈或有先因於濕再因飢勞而病者亦屬內傷挾濕標本同病然勞倦傷脾為不足濕飲停聚為有餘雄按脾傷濕聚曷云有餘蓋太飽則脾困過逸則脾滯脾氣困滯而少健運則飲停濕聚矣較之飢傷而脾餒勞傷而脾乏者則彼尤不足而此尚有餘也後人改飢飽勞逸為飢飽勞役不但辨證不明於字義亦不協矣所以內傷外感孰多孰少孰實孰虛又在臨證時權衡矣二濕熱證惡寒無汗身重頭痛雄按吳本下有胸痞腰疼四字濕在表分宜藿香香薷羌活蒼朮皮薄荷牛蒡子等味頭不痛者去羌活雄按吳本無藿香香薷薄荷牛蒡子有葛根神麯廣皮枳殼自注下仿此身重惡寒濕遏衛陽之表證頭痛必挾風邪故加羌活不獨勝濕且以祛風楊云濕宜淡滲不宜專用燥藥頭痛屬熱不必牽涉及風此條乃陰濕傷表之候章云惡寒而不發熱故為陰濕雄按陰濕故可用薷朮羌活以發其表設暑勝者三味皆為禁藥章氏既知陰濕因見其用香薷一味遂以此條為暑證之實據總由誤以濕熱為暑也故其論暑連篇纍牘皆是影響之談夫七政運行有形可據尚難臆斷況太極無形空談無謂道邇求遠反誤後人茲概從刪免滋眩惑三濕熱證雄按吳本下有汗出二字惡寒發熱身重關節疼雄按吳本下有胸痞腰三字痛濕在肌肉不為雄按吳本作可汗解宜滑石大豆黃卷茯苓皮蒼朮皮藿香葉鮮荷葉白通草桔梗等味不惡寒者去蒼朮皮雄按吳本此句作汗少惡寒者加葛根條內無荷葉藿香通草桔梗有神麯廣皮此條外候與上條同惟汗出獨異更加關節疼痛乃濕邪初犯陽明之表而即清胃脘之熱者不欲濕邪之鬱熱上蒸而欲濕邪之淡滲下走耳此乃陽濕傷表之候以其惡寒少而發熱多故為陽濕也雄按吳本下有然藥用滲利其小便之不利可知矣二句汪按此二句乃他人所附評語四濕熱證三四日即口噤四肢牽引拘急甚則角弓反張此濕熱侵入經絡脈隧中宜鮮地龍秦艽威靈仙滑石蒼耳子絲瓜藤海風藤酒炒黃連等味雄按吳本無此條此條乃濕邪挾風者風為木之氣風動則木張乘入陽明之絡則口噤走竄太陰之經則拘攣故藥不獨勝濕重用息風一則風藥能勝濕一則風藥能疏肝也選用地龍諸藤者欲其宣通脈絡耳十二經絡皆有筋相連繫邪由經絡傷及於筋則瘛瘲拘攣角弓反張筋由肝所主故筋病必當舒肝雄按地龍殊可不必加以羚羊竹茹桑枝等亦可竾伯云地龍靈仙蒼耳海風藤似嫌過於走竄不如羚羊竹茹桑枝等較妥或加鉤藤可乎或問仲景治痙原有桂枝加栝蔞根及葛根湯兩方豈宜於古而不宜於今耶今之痙者與厥相連仲景不言及厥豈金匱有遺文耶余曰非也藥因病用病源既異治法自殊汪按不但此也洄溪已云金匱治痙諸方見效絶少矣傷寒之痙自外來謂由外風證屬太陽口噤即屬陽明義詳本論治以散外邪為主濕熱之痙自內出謂由內風波及太陽治以息內風為主蓋三焦與肝膽同司相火少陽生氣生於肝膽流行三焦名相火也中焦濕熱不解則熱盛於裡而少火悉成壯火火動則風生而筋攣脈急風煽則火熾而識亂神迷雄按設再投桂葛以助其風則燎原莫救矣身中之氣隨風火上炎而有升無降雄按治溫熱諸病者不可不知此理常度盡失由是而形若尸厥正內經所謂血之與氣並走於上則為大厥者是也外竄經脈則成痙內侵膻中則為厥痙厥並見正氣猶存一線則氣復返而生胃津不克支持則厥不回而死矣雄按喻氏云人生天真之氣即胃中之津液是也故治溫熱諸病首宜瞻顧及此董廢翁云胃中津液不竭其人必不即死皆見到之言也奈世人既不知溫熱為何病更不知胃液為何物溫散燥烈之藥漫無顧忌誠不知其何心也所以痙之與厥往往相連傷寒之痙自外來者安有是哉雄按此痙即瘛瘲也吳鞠通辨之甚詳確暑月痙證與霍亂同出一源風自火生火隨風轉乘入陽明則嘔賊及太陰則瀉是名霍亂竄入筋中則攣急流入脈絡則反張是名痙但痙證多厥霍亂少厥蓋痙證風火閉郁鬱則邪勢愈甚不免逼亂神明故多厥霍亂風火外泄泄則邪勢外解雄按宜作越不至循經而走故少厥此痙與霍亂之分別也然痙證邪滯三焦三焦乃火化風得火而愈煽則逼入膻中而暴厥霍亂邪走脾胃脾胃乃濕化邪由濕而停留則淫及諸經而拘攣火鬱則厥火竄則攣又痙與厥之遺禍也痙之攣結乃濕熱生風霍亂之轉筋乃風來勝濕雄按木剋土也痙則由經及臟而厥霍亂則由臟及經而攣總由濕熱與風淆亂清濁升降失常之故夫濕多熱少則風入土中而霍亂雄按霍亂濕多熱少道其常也余自髫年即見此證流行死亡接踵然聞諸父老云向來此證甚稀而近則常有因於道光戊戌輯一專論問世嗣後此證屢行然必在夏熱亢旱酷暑之年則其證乃劇自夏末秋初而起直至立冬後始息夫彤彤徂暑濕自何來貝緣今人蘊濕者多暑邪易於深伏逮一朝猝發遂至闔戶沿村風行似疫醫皆未知原委理中四逆隨手亂投殊可嘆也余每治愈此證必問其人曰病未猝發之先豈竟毫無所苦耶或曰病前數日手足心先覺熱或曰未病前睹物皆紅如火噫豈非暑熱內伏欲發而先露其機耶咸豐紀元此證盛行經余治者無一不活而世人不察輒以薑附殺之不已傎乎楊云道光元年直省此證大作一覺轉筋即死京師至棺木買盡以席裹身而葬卒未有識為何證者俗傳食西瓜者即死故西瓜賤甚余時年十一輒與同學者日日飽啖之卒無恙今讀此論則醫學之陋不獨今日為然也熱多濕少則風乘三焦而痙厥厥而不返者死胃液乾枯火邪盤踞也轉筋入腹者死胃液內涸風邪獨徑也然則胃中之津液所關顧不巨哉雄按此理喻氏發之葉氏暢之實諸病之生死關鍵也在溫熱等病尤為扼要然明明言之而鞠通虛谷之論霍亂也猶未知之況他人乎厥證用辛開泄胸中無形之邪也乾霍亂用探吐泄胃中有形之滯也然泄邪而胃液不上升者熱邪愈熾探吐而胃液不四布者風邪更張終成死候不可不知雄按此條自注明以濕熱二氣分疏章氏妄逞己見謂濕熱即暑也強合二氣為一氣且並難經濕溫熱病為一證矣蓋由未讀越人之書耳茲於原釋中悉為訂正而附記於此以質宗工五濕熱證壯熱口渴舌黃或焦紅發痙神昏譫語或笑邪灼心包營血已耗宜犀角羚羊角連翹生地元參鉤藤銀花露鮮菖蒲至寶丹等味雄按吳本無銀花露汪按宜從吳本蓋花露清靈芳潤用治熱病殊佳然中有蘊濕者終覺非宜也上條言痙此條言厥溫暑之邪本傷陽氣雄按此謂邪之初感必先干陽分而傷氣也及至熱極逼入營陰雄按雖挾濕邪日久已從熱化在氣不能清解必至逼營則津液耗而陰亦病心包受灼神識昏亂用藥以清熱救陰泄邪平肝為務雄按昏譫乃將厥之兆也六濕熱證發痙神昏笑妄脈洪數有力開泄不效者濕熱蘊結胸膈宜仿涼膈散若大便數日不通者熱邪閉結腸胃宜仿承氣微下之例章云曰宜仿曰微下教人細審詳慎不可孟浪攻瀉蓋暑濕黏膩須化氣緩攻不同傷寒化熱而燥結須鹹苦峻下以行之也雄按吳本無此條此條乃陽明實熱或上結胸膈或下結腸胃清熱泄邪止能散絡中流走之熱而不能除腸中蘊結之邪故陽明之邪仍假陽明為出路也陽明實熱舌苔必老黃色或兼燥若猶帶白色而滑者乃濕重為夾陰之邪或脹滿不得不下須佐二術健脾燥濕否則脾傷氣陷下利不止即變危證蓋濕重屬太陰證必當扶脾也雄按苔色白滑不渴腹雖脹滿是太陰寒濕豈可議下但宜厚朴枳術等溫中化濕為治若陽明之邪假陽明為出路一言真治溫熱病之金針也蓋陽明以下行為順邪既犯之雖不可孟浪攻瀉斷不宜截其出路故溫熱自利者皆不可妄行提澀也楊云注語極鄭重孟英辨駁尤精二說皆宜參究汪按凡率投補澀者皆不知邪必須有出路之義者也七濕熱證壯熱煩渴舌焦紅或縮斑疹胸痞自利神昏痙厥熱邪充斥表裡三焦宜大劑犀角羚羊角生地元參銀花露紫草方諸水金汁鮮菖蒲等味雄按吳本無銀花露方諸水金汁有丹皮連翹此條乃痙厥中之最重者上為胸悶下挾熱利斑疹痙厥陰陽告困獨清陽明之熱救陽明之液為急務者恐胃液不存其人自焚而死也雄按此治溫熱諸病之真詮也醫者宜切記之方諸水俗以蚌水代之腥濁已甚宜用竹瀝為妙此證紫雪神犀丹皆可用也八濕熱證寒熱如瘧雄按吳本下有舌苔滑白口不知味八字濕熱阻遏膜原宜柴胡厚朴檳榔草果藿香蒼朮半夏干菖蒲六一散等味雄按吳本無柴胡檳榔藿香菖蒲有神麯瘧由暑熱內伏秋涼外束而成若夏月腠理大開毛竅疏通安得成瘧而寒熱有定期如瘧證發作者以膜原為陽明之半表半裡熱濕阻遏則營衛氣爭證雖如瘧不得與瘧同治故仿又可達原飲之例蓋一由外涼束一由內濕阻也膜原在半表半裡如少陽之在陰陽交界處而營衛之氣內出於脾胃脾胃邪阻則營衛不和而發寒熱似瘧之證矣九濕熱證數日後脘中微悶知飢不食濕邪蒙繞三雄按宜作上焦宜藿香葉薄荷葉鮮荷葉枇杷葉佩蘭葉雄按離騷紉秋蘭以為佩故稱秋蘭為佩蘭若藥肆中所售之佩蘭乃奶酣草之類不可入藥也汪按蘭即省頭草離騷之蘭即本草之蘭皆非今之蘭花前人辨之已極明確不必致疑矣蓋古人所謂香草皆取葉香非指花香而今之蘭花葉實不香明非古之蘭也醫者疑古藥品之蘭蕙正如儒者疑古食品之蚳蠯皆不通古今之變者也蘆尖雄按即蘆根也用尖取其宣暢冬瓜仁等味雄按吳本無此條此濕熱已解餘邪矇蔽清陽胃氣不舒宜用極輕清之品以宣上焦陽氣若投味重之劑是與病情不相涉矣雄按章氏謂輕劑專為吳人體弱而設是未察病情之言也或問濕熱盛時疫氣流行當服何藥預為消弭余謂葉訥人醫案存真載其高祖天士先生案云天氣鬱勃泛潮常以枇杷葉拭去毛淨鍋炒香泡湯飲之取芳香不燥不為穢濁所侵可免夏秋時令之病余則建蘭葉竹葉冬瓜蘆根皆主清肅肺氣故為溫熱暑濕之要藥肺胃清降邪自不容矣若別藥恐滋流弊方名雖美不可試也而薄滋味遠酒色尤為要務此條須與第三十一條參看彼初起之實邪故宜湧泄投此輕劑不相合矣又須與後條參看治法有上中之分臨證審之解後餘邪為虛初發者為實上焦近心故有懊惱譫語中焦離心遠故無如其舌黃邪盛亦有發譫語者十濕熱證初起發熱汗出胸痞口渴舌白濕伏中焦宜藿梗蔻仁杏仁枳殼桔梗鬱金蒼朮厚朴草果半夏干菖蒲佩蘭葉六一散楊云俱可用但須擇一二味對證者用之不必並用等味雄按吳本胸痞下曰不知飢口渴下曰不喜飲舌白作舌苔滑白無杏仁蒼朮厚朴草果半夏濁邪上干則胸悶胃液不升則口渴病在中焦氣分故多開中焦氣分之藥雄按亦太多頗不似薛氏手筆此條多有挾食者其舌根見黃色宜加栝蔞楂肉萊蔔子汪按此疑亦後人所附評語十一濕熱證數日後雄按吳本下有胸痞二字自利溺赤雄按吳本作澀口渴雄按吳本上有身熱二字濕流下焦宜滑石豬苓茯苓澤瀉萆薢通草等味雄按吳本無澤瀉通草有神麯廣皮下焦屬陰太陰所司陰道虛故自利化源滯則溺赤脾不轉津則口渴總由太陰濕勝故也濕滯下焦故獨以分利為治然兼證口渴胸痞須佐入桔梗杏仁大豆黃卷開泄中上源清則流自潔不可不知雄按據此則本條胸痞二字當從吳本增入為是至源清流潔云云則又非自注之文法殊可疑也汪按此篇多有後人評語傳寫羼入自注之處此數語亦後人所附評語也以上三條俱濕重於熱之候濕熱之邪不自表而入故無表裡可分謂由膜原中道而入也雖無表裡之分亦有淺深當別而未嘗無三焦可辨猶之河間治消渴亦分三焦者是也夫熱為天之氣雄按此明熱即暑之謂也章氏何以曲為改釋濕為地之氣熱得濕而愈熾濕得熱而愈橫雄按熱得濕則鬱遏而不宣故愈熾濕得熱則蒸騰而上熏故愈橫兩邪相合為病最多丹溪有云濕熱為病十居八九故病之繁且苛者莫如夏月為最以無形之熱蒸動有形之濕素有濕熱之人易患濕溫誤發其汗則濕熱混合為一而成死證名曰重暍也濕熱兩分其病輕而緩濕熱兩合其病重而速章云故當開泄以分其熱若誤作虛而用補法則閉塞氣道而死矣濕多熱少則蒙上流下當三焦分治調三焦之氣分利其濕也濕熱俱多則下閉上壅而三焦俱困矣當開泄清熱兩法兼用猶之傷寒門二陽合病三陽合病也蓋太陰濕化三焦火化有濕無熱止能矇蔽清陽或阻於上或阻於中或阻於下若濕熱一合則身中少火悉化為壯火而三焦相火有不起而為虐者哉雄按濕熱一合業已陰從陽化如此披猖況熱多濕少乎故不言熱多濕少者非闕文也蓋急宜清熱有不待言矣所以上下充斥內外煎熬最為酷烈雄按曰酷曰烈皆暑之威名兼之木火同氣表裡分司再引肝風痙厥立至雄按津虛之體夏月每有肝風陡動煎厥一證言其不耐暑氣煎熬可謂形容逼肖胃中津液幾何其能供此交徵乎雄按不辨暑證之挾濕與否而輒投溫燥以劫津者宜鑑斯言至其所以必屬陽明者以陽明為水穀之海鼻食氣口食味悉歸陽明邪從口鼻而入則陽明為必由之路雄按肺胃大腸一氣相通溫熱究三焦以此一臟二腑為最要肺開竅於鼻吸入之邪先犯於肺肺經不解則傳於胃謂之順傳不但臟病傳腑為順而自上及中順流而下其順也有不待言者故溫熱以大便不閉者易治為邪有出路也若不下傳於胃而內陷於心包絡不但以臟傳臟其邪由氣分入營更進一層矣故曰逆傳也因葉氏未曾明說順傳之經世多誤解逆傳之理余已僭注於本條之後讀此可證管窺之非妄汪按鼻為肺竅所受之氣必先入肺此云悉歸陽明不免語病夢隱以肺經不解乃傳入胃釋之意始圓愜其始也邪入陽明早已先傷其胃液其繼邪盛三焦更欲資取於胃液司命者可不為陽明顧慮哉雄按此不獨為濕熱病說法也風寒化熱之後亦須顧此況溫熱乎或問木火同氣熱盛生風以致痙厥理固然矣然有濕熱之證表裡極熱不痙不厥者何也余曰風木為火熱引動者原因木氣素旺木旺由於水虧故得引火生風反焚其木以致痙厥若水旺足以制火而生木即無痙厥者也肝陰先虧內外相引兩陽相煽因而動雄按吳本作徑張若肝腎素優並無裡熱者火熱安能招引肝風也雄按喻氏云遇暄熱而不覺其熱者乃為平人蓋陰不虛者不畏暑而暑不易侵雖侵之亦不致劇猶之乎水田不懼旱也陰虛者見日即畏雖處深宮之內而無形之暑氣偏易侵之更有不待暑侵而自成為厥者矣楊云虛損之原一語揭出試觀産婦及小兒一經壯熱便成瘈瘲者以失血之後與純陽之體陰氣未充故肝風易動也雄按原本未及産婦今從吳本與小兒並論尤為周密然婦科不知血脫易痙往往稱為産後驚風喻氏闢之違矣幼科一見發熱即以柴葛解肌為家常便飯初不究其因何而發熱也表熱不清柴葛不撤雖肝風已動瘛瘲已形猶以風藥助虐不亦傎乎此葉氏所以有劫肝陰竭胃汁之切戒也楊云痙厥之證舉世不知其因今經此詳明剖析昭如白日矣或問曰亦有陰氣素虧之人病患濕熱甚至斑疹外見入暮譫語昏迷而不痙不厥者何也答曰病邪自盛於陽明之營分故由上脘而熏胸中則入暮譫妄邪不在三焦氣分則金不受囚木有所畏未敢起而用事至於斑屬陽明疹屬太陰亦二經營分熱極不與三焦相干即不與風木相引也此而痙厥必胃中津液盡涸耗及心營則肝風亦起而其人已早無生理矣雄按此從吳本採補觀此則粗工之治溫熱妄用柴葛竭力以耗胃汁而鼓其肝風者真殺人不以刃也惟稍佐於涼潤方中或不致為大害十二濕熱證舌遍體白口渴濕滯陽明宜用辛開如厚朴草果半夏干菖蒲等味舌白者言其苔若苔滑而口不渴者即屬太陰證宜溫之雄按苔白不渴須詢其便溺不熱者始為宜溫之的證也又按此與第十條證相似吳本無此條楊云濕盛熱微之證初起原可暫用此等藥開之一見濕開化熱便即轉手清熱若執此為常用之法則誤矣注內補出審便溺一層尤為周到此濕邪極盛之候口渴乃液不上升非有熱也辛泄太過即可變而為熱以其屬陽明濕邪開泄則陽氣升而熱透而此時濕邪尚未蘊熱故重用辛開使上焦得通津液得下也陽氣升則津液化而得上輸下布也十三濕熱證舌根白舌尖紅濕漸化熱余濕猶滯宜辛泄佐清熱如蔻仁半夏干菖蒲大豆黃卷連翹緑豆衣六一散等味雄按吳本無此條此濕熱參半之證而燥濕之中即佐清熱者亦所以存陽明之液也上二條憑驗舌以投劑為臨證時要訣蓋舌為心之外候濁邪上熏心肺舌苔因而轉移葉氏溫熱論辨舌最精詳宜合觀之雄按更宜參之準繩十四濕熱證初起即胸悶不知人瞀亂大叫痛濕熱阻閉中上二焦宜草果檳榔鮮菖蒲芫荽六一散各重用或加皂角地漿水煎雄按吳本無此條淦按此條頗似痧證宜用靈驗痧丸為妙六一散有甘草須慎用此條乃濕熱俱盛之候而去濕藥多清熱藥少者以病邪初起即閉不得不以辛通開閉為急務不欲以寒涼凝滯氣機也雄按芫荽不如用薤白或可配栝蔞梔豉者則配之十五濕熱證四五日口大渴胸悶欲絶乾嘔不止脈細數舌光如鏡胃液受劫膽火上衝宜西瓜汁金汁鮮生地汁甘蔗汁磨服鬱金木香香附烏藥等味雄按吳本作西瓜白汁謂不取瓤中汁而以瓜肉搗汁也並無金汁蔗汁此營陰素虧木火素旺者木乘陽明耗其津液幸無飲邪故一清陽明之熱一散少陽之邪不用煎者取其氣全耳舌光無苔津枯而非濁壅反胸悶欲絶者肝膽氣上逆也故以諸汁滋胃液辛香散逆氣雄按凡治陰虛氣滯者可以仿此用藥楊云此例精當能如此旁通方為善讀書人雄又按有治飲痛一案宜參俞惺庵云嘉善一人胸脹脘悶諸治不效一瓢用續隨子煎湯磨沉香木香檀香降香丁香服一月瀉盡水飲而痊汪按續隨子去油務盡否則誤人去油法木床用椹榨後更宜紙隔重壓換紙多次方能去淨十六濕熱證雄按吳本下有身熱口苦四字嘔吐清水或痰多濕熱內留木火上逆宜溫膽湯加栝蔞雄按吳本作黃連碧玉散等味此素有痰飲而陽明少陽同病故一以滌飲一以降逆與上條嘔同而治異正當合參碧玉散即六一加青黛以清肝膽之熱上條液枯以動肝膽之火故乾嘔此條痰飲郁其肝膽之火故嘔水十七濕熱證嘔惡不止晝夜不瘥欲死者肺胃不和胃熱移肺肺不受邪也宜用川連三四分蘇葉二三分兩味煎湯呷下即止肺胃不和最易致嘔蓋胃熱移肺肺不受邪還歸於胃必用川連以清濕熱蘇葉以通肺胃投之立愈者以肺胃之氣非蘇葉不能通也分數輕者以輕劑恰治上焦之病耳雄按此方藥止二味分不及錢不但治上焦宜小劑而輕藥竟可以愈重病所謂輕可去實也合後條觀之蓋氣貴流通而邪氣撓之則周行窒滯失其清虛靈動之機反覺實矣惟劑以輕清則正氣宣布邪氣潛消而窒滯者自通設投重藥不但已過病所病不能去而無病之地反先遭其克伐章氏謂輕劑為吳人質薄而設殆未明治病之理也川連不但治濕熱乃苦以降胃火之上衝蘇葉味甘辛而氣芳香通降順氣獨擅其長然性溫散故雖與黃連並駕尚減用分許而節制之可謂方成知約矣世人不知諸逆衝上皆屬於火之理治嘔輒以薑萸丁桂從事者皆粗工也余用以治胎前惡阻甚妙十八濕熱證咳嗽晝夜不安甚至喘不得眠者暑邪入於肺絡宜葶藶枇杷葉六一散等味雄按吳本咳嗽下有喘逆面赤氣粗六字而無甚至句人但知暑傷肺氣則肺虛而不知暑滯肺絡則肺實葶藶引滑石直瀉肺邪則病自除吳子音曰業師張友樵治一酒客夏月痰咳氣喘夜不得臥服涼藥及開氣藥不效有議用人參麥冬等藥者師診其脈右寸數實此肺實非肺虛也投以人參則立斃矣遂與此方煎服立愈明年復感客邪壅遏肺氣喘咳復作醫有以葶藶進者服之不效反煩悶汗泄師脈其右寸浮數口渴惡熱冷汗自出喘急煩悶曰熱邪內壅肺氣鬱極是以逼汗外出非氣虛自汗也服葶藶而反煩悶者肺熱極盛與苦寒相格拒也夫肺苦氣上逆本宜苦以泄之而肺欲散又當兼食辛以散之與麻杏甘膏湯一劑肺氣得通而喘止汗斂諸證悉平矣楊云余曾治一酒客大喘用金鑑蘇葶丸而愈亦與此同此蓋濕熱上壅之證也至案內所云服此益甚則外感束其肺熱用此降之則外感反內陷而病益甚麻杏甘石正祛外感而清內熱之方故速愈張君用藥則是而立論高而不切非垂教後學之法也十九濕熱證十餘日大勢已退惟口渴汗出骨節雄按吳本有隱字痛雄按吳本下有不舒小便赤澀不利八字餘邪留滯經絡宜元米即糯米湯泡於朮隔一宿去朮煎飲病後濕邪未盡陰液先傷故口渴身痛此時救液則助濕治濕則劫陰宗仲景麻沸湯之法取氣不取味走陽不走陰佐以元米湯養陰逐濕兩擅其長楊云煎法精妙注亦明析汪按此身痛一證乃濕滯之的驗則口渴未必非濕淫於內而引飲也然津液亦必須顧慮以木治濕不用煎而用泡既巧妙亦周致雄按用沙參麥冬石斛枇杷葉等味冬瓜湯煎服亦可汪按用冬瓜靈妙宜加絲瓜絡二十濕熱證數日後汗出熱不除或痙忽頭痛不止者營液大虧厥陰風火上升宜羚羊角蔓荊子鉤藤元參生地女貞子等味雄按吳本無女貞有白芍楊云白芍不如女貞濕熱傷營肝風上逆血不榮筋而痙上升巔頂則頭痛熱氣已退木氣獨張故痙而不厥投劑以息風為標養陰為本雄按蔓荊不若以菊花桑葉易之楊云蔓荊最無謂所易甚佳汪按枸杞子亦可用不嫌其膩二十一濕熱證胸痞發熱肌肉微疼始終無汗者腠理暑邪內閉雄按吳本無此四字作氣機拂鬱濕熱不能達外楊云吳本勝於原本宜六一散一兩薄荷葉三四分雄按吳本作三四十片泡湯調下即汗解濕病發汗昔賢有禁此不微汗之病必不除蓋既有不可汗之大戒復有得汗始解之治法臨證者當知所變通矣吳云此濕熱蘊遏氣鬱不宣故宜辛涼解散汗出灌浴之輩最多此患若加頭痛惡寒便宜用香薷溫散矣章云濕病固非一概禁汗者故仲景有麻黃加朮湯等法但寒濕在表法當汗解濕熱在裡必當清利今以暑濕閉於腠理故以滑石利毛竅若閉於經者又當通其經絡可知矣汪按吳本薄荷較多則非微汗矣二十二濕熱證按法治之數日後或吐下一時並至者中氣虧損升降悖逆宜生穀芽蓮心雄按當是蓮子扁豆米仁半夏甘草茯苓等味甚者用理中法雄按吳本無此條若可用理中法者必是過服寒涼所致升降悖逆法當和中猶之霍亂之用六和湯也若太陰憊甚中氣不支非理中不可忽然吐下更當細審脈證有無重感別邪或傷飲食雄按亦有因忿怒而致者須和肝胃二十三濕熱證十餘日後左關弦數腹時痛時圊血肛門熱痛血液內燥熱邪傳入厥陰之證宜仿白頭翁法熱入厥陰而下利即不圊血亦當宗仲景治熱利法若竟逼入營陰安得不用白頭翁湯涼血而散邪乎設熱入陽明而下利即不圊血又宜師仲景下利譫語用小承氣湯之法矣雄按章氏謂小承氣湯乃治厥陰熱利若熱入陽明而下利當用黃芩湯此不知傷寒論有簡誤之文也本文云下利譫語者有燥矢也宜小承氣湯既有燥矢則為太陰轉入陽明之證與厥陰無涉矣濕熱入陽明而下利原宜宗黃芩湯為法其有燥矢而譫語者未嘗無其候也則小承氣亦可援例引用焉二十四濕熱證十餘日後尺脈數下利或咽痛口渴心煩下泉不足熱邪直犯少陰之證宜仿豬膚湯涼潤法同一下利有厥少之分則藥有寒涼之異謂厥陰宜寒少陰宜涼也然少陰有便膿之候不可不細審也二十五濕熱證身冷脈細汗泄胸痞口渴舌白濕中少陰之陽宜人參白朮附子茯苓益智等味雄按吳本無此條楊云此等證固有之然本論濕熱卻夾入寒濕又不提明藥誤豈不自亂其例此條濕邪傷陽理合扶陽逐濕口渴為少陰證烏得妄用寒涼耶津液出於舌下少陰經之廉泉穴故凡少陰受邪津液不升則渴也然胸痞舌白當加厚朴半夏或乾薑恐參術太壅氣也渴者濕遏陽氣不化津液以上升非熱也雄按此濕熱病之類證乃寒濕也故傷人之陽氣或濕熱證治不如法但與清熱失於化濕亦有此變但口渴而兼身冷脈細汗泄舌白諸證者固屬陰證宜溫還須察其二便如溲赤且短便熱極臭者仍是濕熱蘊伏之陽證雖露虛寒之假象不可輕投溫補也章氏所云濕遏陽氣不化津液之渴又為太陰證而非少陰證矣二十六暑月病初起但惡寒面黃口不渴神倦四肢懶脈沉弱腹痛下利濕困太陰之陽宜仿縮脾飲甚則大順散來復丹等法雄按吳本無此條暑月為陽氣外泄陰氣內耗之時故熱邪傷陰陽明消爍宜清宜涼雄按此治暑之正法眼藏太陰告困濕濁瀰漫宜溫宜散雄按凡寒濕為病雖在暑月忌用涼藥宜舍時從證也昔賢雖知分別論治惜不能界畫清釐而創陰暑等名貽誤後學不少徐洄溪云天有陰暑人間有陰熱矣一語破的汪按如夏日有陰暑冬日當有陽寒乎倘冬日感病而醫者云此為陽寒治宜涼藥未有不嗤其妄者而陰暑之名乃相沿數百年積非勝是不可解也古法最詳醫者鑑諸仲景謂自利不渴者屬太陰以其臟有寒故也今濕重惡寒不發熱即為太陰證之寒濕也如或肢冷脈細必須姜附理中法二十七濕熱證按法治之諸證皆退惟目瞑則驚悸夢惕餘邪內留膽氣未舒宜酒浸郁李仁薑汁炒棗仁豬膽皮等味雄按吳本無此條滑可志著郁李仁性最滑脫古人治驚後肝系滯而不下始終目不瞑者用之以下肝系而去滯此證借用良由濕熱之邪留於膽中膽為清虛之府藏而不瀉是以病去而內留之邪不去寐則陽氣行於陰膽熱內擾肝魂不安用郁李仁以泄邪而以酒行之酒氣獨歸膽也棗仁之酸入肝安神而以薑汁製安神而又兼散邪也肝性喜涼散棗仁薑汁太溫似宜酌加涼品雄按此釋甚是如黃連山梔竹茹桑葉皆可佐也二十八濕熱證曾開泄下奪惡候皆平獨神思不清倦語不思食溺數唇齒乾胃氣不輸肺氣不布元神大虧宜人參麥冬石斛木瓜生甘草生穀芽鮮蓮子等味雄按吳本無此條汪按百合似亦可用開泄下奪惡候皆平正亦大傷故見證多氣虛之象理合清補元氣若用膩滯陰藥去生便遠雄按此肺胃氣液兩虛之證故宜清補不但陰膩不可用且與脾虛之宜於守補溫運者亦異楊云分別極清二十九濕熱證四五日忽大汗出手足冷脈細如絲或絶口渴莖痛而起坐自如神清語亮乃汗出過多衛外之陽暫亡濕熱之邪仍結一時表裡不通脈故伏非真陽外脫也宜五苓散去朮加滑石酒炒川連生地耆皮等味雄按吳本無川連生地此條脈證全似亡陽之候獨於舉動神氣得其真情噫此醫之所以貴識見也以口渴莖痛知其邪結以神清語亮知非脫證雄按此條原注全似評贊章氏以為自注究可疑也至衛陽暫亡必由誤表所致濕熱仍結陰液已傷故以四苓加滑石導濕下行川連生地清火救陰耆皮固其衛氣用法頗極周密楊云發明方意精當汪按此注當亦後人所附評語且此證世所罕見況亡陽脫證起坐自如神清語亮者亦不少據以辨證似不甚明確惟口渴莖痛為亡陽所無耳三十濕熱證發痙神昏獨足冷陰縮下體外受客寒仍宜從濕熱治只用辛溫之品煎湯熏洗楊云仍從濕熱治是矣辛溫熏洗不愈益其濕乎不惟治下而遺上也汪按熏洗似無大礙但未必有益陰縮為厥陰之外候合之足冷全似虛寒乃諦觀本證無一屬虛始知寒客下體一時營氣不達不但證非虛寒並非上熱下寒之可擬也仍從濕熱治之又何疑耶發痙神昏邪犯肝心若邪重內閉厥陰將絶必囊縮足冷而舌亦卷是邪深垂死之證本非虛寒今云由外受客寒臨證更當詳細察問為要雄按此條本文頗有語病恐非生白手筆三十一濕熱證初起壯熱口渴脘悶懊憹眼欲閉時譫語濁邪蒙閉上焦宜湧泄用枳殼桔梗淡豆豉生山梔無汗者加葛根此與第九條宜參看彼屬餘邪法當輕散餘邪不淨者自無壯熱譫語等證必與初起邪勢重者形狀不同此則濁邪蒙閉上焦故懊憹脘悶眼欲閉者肺氣不舒也時譫語者邪郁心包也若投輕劑病必不除經曰高者越之用梔豉湯湧泄之劑引胃脘之陽而開心胸之表邪從吐散若舌苔薄而清者邪未膠結可吐散如舌苔厚而有根濁邪瘀結須重用辛開苦降如吐之邪結不得出反使氣逆而變他證矣雄按此釋甚是病在上焦濁邪未結故可越之若已結在中焦豈可引吐不但濕熱證吐法宜慎也即痰飲證之宜於取吐者亦有辨別要訣趙恕軒串雅云宜吐之證必須看痰色吐在壁上須在痰干之後有光亮如蝸牛之涎者無論痰在何經皆可吐也若痰干之後無光亮之色者切忌用吐彼驗痰漬此驗舌苔用吐者識之又按何報之云子和治病不論何證皆以汗吐下三法取效此有至理存焉蓋萬病非熱則寒寒者氣不運而滯熱者氣亦壅而不運氣不運則熱鬱痰生血停食積種種阻塞於中矣人身氣血貴通而不貴塞非三法何由通乎又去邪即所以補正邪去則正自復但以平淡之飲食調之不數日而精神勃發矣故婦人不孕者此法行後即孕陰陽和暢也男子陽道驟興非其明驗乎後人不明其理而不敢用但以溫補為穩殺人如麻可嘆也汪按何說乃據倒倉法言之三十二濕熱證經水適來壯熱口渴譫語神昏胸腹痛或舌無苔脈滑數邪陷營分宜大劑犀角紫草茜根貫衆連翹鮮菖蒲銀花露等味雄按世人但知小柴胡湯一法而不分傷寒溫暑之病何也淦按茜根不若以丹皮赤芍易之熱入血室不獨婦女男子亦有之不第涼血並須解毒然必重劑乃可奏功仲景謂陽明病下血譫語者此為熱入血室即指男子而言故無經水適來之語三十三熱證上下失血或汗血毒邪深入營分走竄欲泄宜大劑犀角生地赤芍丹皮連翹紫草茜根銀花等味雄按以上四條吳本無之丹皮雖涼血而氣香走泄能發汗惟血熱而瘀者宜之又善動嘔胃弱者勿用熱逼而上下失血汗血勢極危而猶不即壞者以毒從血出生機在是大進涼血解毒之劑以救陰而泄邪邪解而血自止矣血止後須進參耆善後乃得汪按善後宜兼養血汗血即張氏所謂肌衄也內經謂熱淫於內治以鹹寒方中當增入鹹寒之味此說未知何人所注亦甚有理也汪按可加牡蠣並有止汗之功不嫌其澀此注乃後人所附評語未羼入原注者他條俱與原注併合不可分析矣雄按此條本文但云熱證是感受暑熱而不挾濕邪者也暑熱之氣極易傷營故有是證章氏乃云此篇所謂濕熱即是暑也然則此條不曰濕熱而曰熱者又是何病耶夫寒暑二氣易經即以往來對待言之矣後之妄逞臆說者真是冷熱未知辛甫云辨得是三十四濕熱證七八日口不渴聲不出與飲食亦不卻雄按吳本有二便自通句默默不語神識昏迷進辛香涼泄芳香逐穢俱不效此邪入雄按吳本下有手字厥陰主客渾受宜仿吳又可三甲散醉地鱉蟲醋炒鱉甲土炒穿山甲生殭蠶雄按吳本無此味柴胡桃仁泥等味暑濕先傷陽分然病久不解必及於陰陰陽兩困氣鈍血滯而暑濕不得外泄雄按據章氏以此為薛氏自注然疊以暑濕二氣並言以解濕熱病證若謂暑中原有濕則暑下之濕又為何物乎一笑余恐後學迷惑故不覺其饒舌也遂深入厥陰絡脈凝瘀使一陽少陽生氣也不能萌動生氣有降無升心主阻遏靈氣不通所以神不清而昏迷默默也破滯通瘀斯絡脈通而邪得解矣海昌許益齊云此條即傷寒門百合病之類趙以德張路玉陶厚堂以為心病徐忠可以為肺病本論又出厥陰治法良以百脈一宗悉致其病元氣不布邪氣淹留乃祖仲景法用異類靈動之物鱉甲入厥陰用柴胡引之俾陰中之邪盡達於表䗪蟲入血用桃仁引之俾血分之邪盡泄於下山甲入絡用殭蠶引之俾絡中之邪亦從風化而散緣病久氣鈍血滯非拘拘於恆法所能愈也汪按此有神昏一證可知其非百合病矣故與百合病異治百合病究宜治肺為是三十五濕熱證口渴苔黃起刺脈弦緩囊縮舌硬譫語昏不知人兩手搐搦津枯邪滯宜鮮生地蘆根生首烏鮮稻根等味若脈有力大便不通大黃亦可加入雄按吳本無此條汪按首烏味澀似未妥胃津劫奪熱邪內據非潤下以泄邪則不能達故仿承氣之例以甘涼易苦寒正恐胃氣受傷胃津不復也三十六濕熱證發痙撮空神昏笑妄舌苔干黃起刺或轉黑色大便不通者熱邪閉結胃腑宜用承氣湯下之雄按此下十一條從吳本補入撮空一證昔賢謂非大實即大虛虛則神明渙散將有脫絶之虞實則神明被逼故多撩亂之象今舌苔黃刺干澀大便閉而不通其為熱邪內結陽明腑熱顯然矣徒事清熱泄邪止能散絡中流走之熱不能除胃中蘊結之邪故假承氣以通地道然舌不幹黃起刺者不可投也雄按第二十八條有曾開泄下奪之文則濕熱病原有可下之證惟濕未化燥腑實未結者不可下耳下之則利不止如已燥結亟宜下奪否則垢濁熏蒸神明蔽塞腐腸爍液莫可挽回較彼傷寒之下不嫌遲去死更速也楊云通透之論承氣用硝黃所以逐陽明之燥火實熱原非濕熱內滯者所宜用然胃中津液為熱所耗甚至撮空撩亂舌苔干黃起刺此時胃熱極盛胃津告竭濕火轉成燥火故用承氣以攻下承氣者所以承接未亡之陰氣於一線也濕溫病至此亦危矣哉汪按治溫熱與傷寒異而溫熱壞證多與傷寒同雄按董廢翁云外感之邪既不得從元腑透達則必向里而走空隙而十二臟腑之中惟胃為水穀之海其上有口其下有口最虛而善受故諸邪皆能入之邪入則胃實矣胃實則津液干矣津液干則死矣楊乘六云此言道盡感證致死根由彼肆用風燥之劑劫液夭人生命者正坐不知此義耳余謂凡治感證須先審其胃汁之盛衰如邪漸化熱即當濡潤胃腑俾得流通則熱有出路液自不傷斯為善治若恃承氣湯為焦頭爛額之客詎非曲突徙薪之不早耶楊云陳修園自謂讀傷寒論數十年然後悟出存津液三字而其用藥仍偏辛燥不知其所悟者何在得孟英反復申明迷者庶可大悟乎汪按此條語語破的楊評亦妙存津液固為治溫暑諸證之要務然非專恃承氣湯急下存津一法也三十七濕熱證壯熱口渴自汗身重胸痞脈洪大而長者此太陰之濕與陽明之熱相合宜白虎加蒼朮湯熱渴自汗陽明之熱也胸痞身重太陰之濕兼見矣脈洪大而長知濕熱滯於陽明之經故用蒼朮白虎湯以清熱散濕然乃熱多濕少之候雄按徐氏云暑不挾濕蒼朮禁用白虎湯仲景用以清陽明無形之燥熱也胃汁枯涸者加人參以生津名曰白虎加人參湯雄按余於血虛加生地精虛加枸杞有痰者加半夏用之無不神效身中素有痹氣者加桂枝以通絡名曰桂枝白虎湯而其實意在清胃熱也是以後人治暑熱傷氣身熱而渴者亦用白虎加人參湯熱渴汗泄肢節煩疼者亦用白虎加桂枝湯胸痞身重兼見則於白虎湯中加入蒼朮以理太陰之濕寒熱往來兼集則於白虎湯中加入柴胡以散半表半裡之邪雄按余治暑邪熾盛熱渴汗泄而痞滿氣滯者以白虎加厚朴極效凡此皆熱盛陽明他證兼見故用白虎清熱而復各隨證以加減楊云此論極圓活可悟古方加減之法苟非熱渴汗泄脈洪大者白虎便不可投辨證察脈最宜詳審也雄按熱渴汗泄而脈虛者宜甘藥以養肺胃之津汪按若大汗脈虛身涼不熱口潤不渴則為亡陽脫證非參附回陽不能挽救洄溪醫論謂陽未亡則以涼藥止汗陽已亡則以熱藥止汗此中轉變介在幾微辨之精且詳矣學者宜究心焉三十八濕熱證濕熱傷氣四肢困倦精神減少身熱氣高心煩溺黃口渴自汗脈虛者東垣用清暑益氣湯主治同一熱渴自汗而脈虛神倦便是中氣受傷而非陽明鬱熱清暑益氣湯乃東垣所制方中藥味頗多學者當於臨證時斟酌去取可也雄按此脈此證自宜清暑益氣以為治但東垣之方雖有清暑之名而無清暑之實觀江南仲治孫子華之案程杏軒治汪木工之案可知故臨證時須斟酌去取也汪按清暑益氣湯洄溪譏其用藥雜亂固當此云無清暑之實尤確余每治此等證輒用西洋參石斛麥冬黃連竹葉荷稈知母甘草粳米西瓜翠衣等以清暑熱而益元氣無不應手取效也汪按此方較東垣之方為妥然黃連尚宜酌用三十九暑月熱傷元氣氣短倦怠口渴多汗肺虛而咳者宜人參麥冬五味子等味汪按徐洄溪謂麥冬五味咳證大忌惟不咳者可用是也此即千金生脈散也與第十八條同一肺病而氣粗與氣短有分則肺實與肺虛各異實則瀉而虛則補一定之理也然方名生脈則熱傷氣之脈虛欲絶可知矣汪按脈虛為的驗若弦數者豈可輕試乎雄按徐洄溪云此傷暑之後存其津液之方也觀方下治證無一字治暑邪者庸醫以之治暑病誤之甚矣其命名之意即於復脈湯內取用參麥二味因止汗故加五味子近人不論何病每用此方收住邪氣殺人無算用此方者須詳審其邪之有無不可徇俗而視為治暑之劑也四十暑月乘涼飲冷陽氣為陰寒所遏皮膚蒸熱凜凜畏寒頭痛頭重自汗煩渴或腹痛吐瀉者宜香薷厚朴扁豆等味汪按香薷惟暑月受涼無汗者宜之有汗者宜慎用此由避暑而感受寒濕之邪雖病於暑月而實非暑病昔人不曰暑月傷寒濕而曰陰暑以致後人淆惑貽誤匪輕今特正之其用香薷之辛溫以散陰邪而發越陽氣厚朴之苦溫除濕邪而通行滯氣扁豆甘淡行水和中倘無惡寒頭痛之表證即無取香薷之辛香走竄矣無腹痛吐利之裡證亦無取厚朴扁豆之疏滯和中矣故熱渴甚者加黃連以清暑名四味香薷飲減去扁豆名黃連香薷飲濕盛於裡腹膨泄瀉者去黃連加茯苓甘草名五物香薷飲若中虛氣怯汗出多者加入參耆白朮橘皮木瓜名十味香薷飲然香薷之用總為寒濕外襲而設楊云古人亦云夏月之用香薷猶冬月之用麻黃不可用以治不挾寒濕之暑熱也略參拙意汪按十味香薷飲用藥亦太雜四十一濕熱內滯太陰郁久而為滯下其證胸痞腹痛下墜窘迫膿血稠黏里結後重脈軟數者宜厚朴黃芩神麯廣皮木香檳榔柴胡煨葛根銀花炭荊芥炭等味汪按柴葛終嫌不妥凡病身熱脈數是其常也惟痢疾身熱脈數其證必重古之所謂滯下即今所謂痢疾也由濕熱之邪內伏太陰阻遏氣機以致太陰失健運少陽失疏達熱鬱濕蒸傳導失其常度蒸為敗濁膿血下注肛門故後重氣壅不化仍數至圊而不能便傷氣則下白傷血則下赤氣血並傷赤白兼下濕熱盛極痢成五色汪按昔人有謂紅痢屬熱白痢屬寒者謬說也痢疾大抵皆由暑熱其由於寒者千不得一惟紅屬血白屬氣則為定論故用厚朴除濕而行滯氣檳榔下逆而破結氣黃芩清庚金之熱木香神麯疏中氣之滯葛根升下陷之胃氣柴胡升土中之木氣汪按蠻升無益而有害熱侵血分而便血以銀花荊芥入營清熱汪按地榆炭丹皮炭亦可用若熱盛於裡當用黃連以清熱大實而痛宜增大黃以逐邪昔張潔古制芍藥湯以治血痢方用歸芍芩連大黃木香檳榔甘草桂心等味而以芍藥名湯者蓋謂下血必調藏血之臟故用之為君不特欲其土中瀉木抑亦賴以斂肝和陰也然芍藥味酸性斂終非濕熱內蘊者所宜服汪按芍藥甘草乃治痢疾腹痛之聖劑與濕熱毫無所礙不必疑慮倘遇痢久中虛而宜用芍藥甘草之化土者恐難任芩連大黃之苦寒木香檳榔之破氣若其下痢初作濕熱正盛者白芍酸斂滯邪斷不可投汪按初起用之亦無礙並不滯邪已屢試矣此雖昔人已試之成方不敢引為後學之楷式也雄按嘔惡者忌木香汪按後重非木香不能除則用木香佐以止嘔之品可也無表證者忌柴葛汪按即有表證亦宜慎用蓋胃以下行為順滯下者垢濁欲下而氣滯也雜以升藥濁氣反上衝而為嘔惡矣汪按升清降濁則可今反升濁豈不大謬至潔古芍藥湯之桂心極宜審用苟熱邪內盛者雖有芩連大黃之監製亦恐其有跋扈之患也若芍藥之酸不過苦中兼有酸味考本經原主除血痹破堅積寒熱疝瘕為斂肝氣破血中氣結之藥仲聖於腹中滿痛之證多用之故太陰病脈弱其人續自便利設當行大黃芍藥者宜減之以胃氣弱易動故也蓋大黃開陽結芍藥開陰結自便利者宜減則欲下而窒滯不行之痢正宜用矣楊云是極芍藥湯治濕熱下利屢有奇效其功全在芍藥但桂心亦須除去為妥汪按白芍開結佐以甘草和中必不有礙胃氣乃治痢必用之品不但治血痢也況白芍之酸嗽證尚且不忌則治痢用之有何顧忌乎四十二痢久傷陽脈虛滑脫者真人養臟湯加甘草當歸白芍脾陽虛者當補而兼溫然方中用木香必其腹痛未止故兼疏滯氣用歸芍必其陰分虧殘故兼和營陰汪按果系虛寒滑脫固宜溫澀今既云陰分虧殘豈可妄投溫燥以速其死乎但痢雖脾疾久必傳腎以腎為胃關司下焦而開竅於二陰也汪按所傷者腎陰非腎陽也蠻助腎陽何益況火為土母欲溫土中之陽必補命門之火若虛寒甚而滑脫者當加附子以補陽不得雜入陰藥矣汪按虛寒滑脫誠宜參附粟殼然忘卻此篇本專論濕熱病矣雄按觀此條似非一瓢手筆而注則斷非本人自注汪按當亦後人所附評語葉香岩云夏月炎熱其氣俱浮於外故為蕃秀之月過食寒冷郁其暑熱不得外達汪按亦有不食寒冷而患痢者食物厚味為內伏之火煅煉成積傷於血分則為紅傷於氣分則為白氣滯不行火氣逼迫於肛門則為後重滯於大腸則為腹痛故仲景用下藥通之河間丹溪用調血和氣而愈此時令不得發越至秋收斂於內而為痢也汪按亦有夏月即痢者此理甚明何得誤認為寒而用溫熱之藥余歷證四十餘年治痢惟以疏理推蕩清火而愈者不計其數觀其服熱藥而死者甚多汪按餘生平治痢必宗葉氏之論惟曾誤服溫澀者每多不救其餘無不愈者同志之士慎勿為景嶽之書所誤以殺人也汪按可謂苦口婆心無如世之宗景嶽者必不肯信從也聶久吾云痢疾投補太早錮塞邪熱在內久而正氣已虛邪氣猶盛欲補而澀之則助邪欲清而攻之則愈滑多致不救汪按幸而不死亦必成休息痢終身不瘥徐洄溪云夏秋之間總由濕熱積滯與傷寒三陰之利不同汪按學者切記後人竟用溫補殺人無算觸目傷懷尤拙吾云痢與泄瀉其病不同其治亦異泄瀉多由寒濕寒則宜溫濕則宜燥也痢多成於濕熱熱則宜清濕則宜利也雖泄瀉有熱證畢竟寒多於熱痢病亦有寒證畢竟熱多於寒是以泄瀉經久必傷於陽而腫脹喘滿之變生痢病經久必損於陰而虛煩痿廢之疾起痢病兜澀太早濕熱流注多成痛痹泄瀉疏利過當中虛不復多作脾勞此余所親歷非臆說也或問熱則清而寒則溫是矣均是濕也或從利或從燥何歟曰寒濕者寒從濕生故宜苦溫燥其中濕熱者濕從熱化故宜甘淡滑石之類汪按茯苓通草亦是利其下蓋燥性多熱利藥多寒便利則熱亦自去中溫則寒與俱消寒濕必本中虛不可更行清利濕熱鬱多成毒不宜益以溫燥也合諸論而觀之可見痢久傷陽之證乃絶無而僅有者然則真人養臟湯須慎重而審用矣猶謂其雜用陰藥豈未聞下多亡陰之語乎須知陽脫者亦由陰先亡而陽無依如盞中之油干則火滅也汪按辨得明暢庶免誤人四十三痢久傷陰虛坐努責者宜用熟地炭炒當歸炒白芍炙甘草廣皮之屬里結欲便坐久而仍不得便者謂之虛坐努責凡里結屬火居多火性傳送至速鬱於大腸窘迫欲便而便仍不舒故痢疾門中每用黃芩清火甚者用大黃逐熱若痢久血虛血不足則生熱亦急迫欲便但久坐而不得便耳此熱由血虛所生故治以補血為主里結與後重不同里結者急迫欲便後重者肛門重墜里結有虛實之分實為火邪有餘虛為營陰不足後重有虛實之異實為邪實下壅虛由氣虛下陷是以治里結者有清熱養陰之異治後重者有行氣升補之殊虛實之辨不可不明汪按辨析精細允當言言金玉雄按審屬痢久而氣虛下陷者始可參用升補若初痢不挾風邪久痢不因氣陷者升柴不可輕用故喻氏逆流挽舟之說堯封斥為僞法也四十四暑濕內襲腹痛吐利胸痞脈緩者濕濁內阻太陰宜縮脾飲此暑濕濁邪傷太陰之氣以致土用不宣太陰告困故以芳香滌穢辛燥化濕為制也雄按雖曰暑濕內襲其實乃暑微濕盛之證故用藥如此汪按此有脈緩可徵故宜用溫藥四十五暑月飲冷過多寒濕內留水穀不分上吐下瀉肢冷脈伏者宜大順散暑月過於貪涼寒濕外襲者有香薷飲寒濕內侵者有大順散夫吐瀉肢冷脈伏是脾胃之陽為寒濕所蒙不得升越故宜溫熱之劑調脾胃利氣散寒然廣皮茯苓似不可少此即仲景治陰邪內侵之霍亂而用理中湯之旨乎略參拙意雄按此條明言暑月飲冷過多寒濕內留水穀不分之吐利宜大順散治之是治暑月之寒濕病非治暑也讀者不可草率致誤若肢冷脈伏而有苔黃煩渴溲赤便穢之兼證即為暑熱致病誤投此劑禍不旋踵汪按洄溪論大順散語見第五卷本方下四十六腸痛下利胸痞煩躁口渴脈數大按之豁然空者宜冷香飲子此不特濕邪傷脾抑且寒邪傷腎煩躁熱渴極似陽邪為病惟數大之脈按之豁然而空知其躁渴等證為虛陽外越而非熱邪內擾故以此方冷服俾下咽之後冷氣既消熱性乃發庶藥氣與病氣無扦格之虞也雄按此證亦當詳審如果虛陽外越則其渴也必不嗜飲其舌色必淡白或紅潤而無干黃黑燥之苔其便溺必溏白而非穢赤苟不細察貽誤必多醫師祕籍僅載前三十五條江白仙本與溫熱贅言於三十五條止採二十條而多後之十一條且編次互異無從訂正偶於友人顧聽泉學博處見鈔本濕熱條辨云曩得於吳人陳秋垞贊府者雖別無發明而四十六條全列殆原稿次序固如是耶今從之俾學者得窺全豹焉又按喻氏云濕溫一證即藏疫癘在內一人受之則為濕溫一方受之則為疫癘楊云以下論治疫之法綱領已具學者於此究心焉庶免多歧之惑余謂此即仲聖所云清濁互中之邪也石頑亦云時疫之邪皆從濕土鬱蒸而發土為受盛之區平時汙穢之物無所不容適當邪氣蒸騰不異瘴霧之毒或發於山川原陸或發於河井溝渠人觸之者皆從口鼻流入膜原而至陽明之經脈必右盛於左蓋濕土之邪以類相從而犯於胃所以右手脈盛也陽明居太陽之裡少陽之外為三陽經之中道故初感一二日間邪犯膜原但覺背微惡寒頭額暈脹胸膈痞滿手指痠麻此為時疫之報使與傷寒一感便發熱頭痛不同至三日以後邪乘表虛而外發則有昏熱頭汗或咽腫發斑之患邪乘裡虛而內陷或挾飲食則有嘔逆痞滿嘈雜失血自利吐蛔之患若其人平素津枯兼有停滯則有譫語發狂言舌苔黃黑大便不通之患平素陰虧則有頭面赤熱足膝逆冷雄按此二端亦有不屬陰虛而胃中濁氣上熏肺為熱壅無以清肅下行而使然者至夜發熱之患若喘噦冷汗煩擾瘛瘲等證皆因誤治所致也蓋傷寒之邪自表傳裡溫熱之邪自里達表雄按此謂伏氣發為溫熱也若外感風溫暑熱皆上焦先受疫癘之邪自陽明中道隨表裡虛實而發不循經絡傳次也以邪既伏中道不能一發便盡雄按夏之濕溫秋之伏暑病機皆如此治法有區別故有得汗熱除二三日復熱如前者有得下里和二三日復見表熱者有表和復見里證者總由邪氣內伏故屢奪屢發不可歸咎於調理失宜復傷風寒飲食也汪按此真閲歷之言外解無如香豉蔥白連翹薄荷之屬內清無如滑石芩連山梔人中黃之屬下奪無如硝黃之屬如見發熱自利則宜葛根芩連雄按葛根宜慎用余易以滑石銀花較妥汪按宜用緑豆胸膈痞滿則宜枳桔香附雄按桔梗太升須少用香附太燥宜酌用余則以厚朴主濕滿石菖蒲主痰痞貝母主鬱結皆妙汪按用制香附無礙嘔吐厄逆則宜藿香芩連雄按熱熾者以竹茹枇杷葉易藿香衄血下血則宜犀角丹皮發斑咽痛則宜犀角牛蒡亞枝云發斑咽爛者宜用錫類散吹之煩渴多汗則宜知母石膏愈後食復勞復則宜枳實梔豉汪按宜加竹茹隨證加葳蕤茯苓丹皮芍藥之類汪按葳蕤宜慎用皆為合劑而香豉人中黃又為時疫之專藥以其總解溫熱時行外內熱毒也顧雁庭云喻氏治疫以解毒為主即又可之專用大黃葉氏之銀花金汁同用皆此意也雄按松峰之青蒿緑豆亦猶是耳當知其證雖有內外之殊一皆火毒為患絶無辛溫發散之例每見窮鄉僻壤無醫藥之處熱極恣飲涼水多有浹然汗出而解者汪按昔人亦有多飲殺人之戒須知有搗鮮車前草汁飲之者甚妙此非宜寒涼不宜辛熱之明驗乎顧雁庭云脈證不必大涼而服大涼之藥似有害而終無害者疫也脈證可進溫補而投溫補之劑始似安而漸不安者疫也雄按疫證皆屬熱毒不過有微甚之分耳間有服溫補而得生者必本非疫證偶病於疫癘盛行之際遂亦誤指為疫也或熱邪不重過服寒涼亦宜溫補回春然非疫癘正治之法學者辨之汪按溫補得生者乃暑月乘涼飲冷中於寒濕之病與中於熱毒之病大相徑庭故云本非疫證讀者不以辭害意可也故一切風燥辛熱皆不可犯每見粗工用羌獨柴前蒼芷芎防之類引火上逆亢熱彌甚者以風燥之藥性皆上升橫散如爐冶得鼓鑄之力也用朴半檳榔青皮木香等耗氣之藥胸膈愈加痞滿者汪按庸手見此必指為虛揠苗助長之道也雄按又可達原飲必濕盛熱微者可用未可執為定法有下證已具而遲疑不敢攻下屢用芩連不應者此與揚湯止沸不殊也至於發狂譫語舌苔焦黑而大便自利證實脈虛不可攻者雄按清熱救陰間亦可愈及煩熱痞悶冷汗喘乏四肢逆冷六脈虛微不受補者皆難圖治也時疫變證多端未能一一曲盡聊陳大略如此雄按小兒痘證多挾疫癘之氣而發伍氏謂痘毒藏於脾經正與此論合故費氏專講痘疫以救非常痘證之偏厥功偉矣後人不察訾其偏任寒涼蓋未知痘之同於疫也審其為疫必宗其法又可曾亦論及近惟王清任知之餘謂麻疹亦有因疫癘之氣而發者故治法亦與溫熱相埒也習幼科者於溫熱暑疫諸證因其可不細心討究耶汪按治痘專任寒涼究非正軌痘證本與斑疹不同也此謂費氏之法特以救非常之痘則知尋常之痘未可概施若奉費氏為治痘定法而置托諸法於不用是又大誤矣即如溫熱病固大忌溫補而病情萬變至其壞證卻與傷寒壞證無異有必須溫補挽救者亦不可執一也然豈可奉溫補為治溫熱病之定法乎又按李東垣云脾胃受勞役之疾飲食又復失節耽病日久及事息心安飽食太甚病乃大作嚮者壬辰改元京師戒嚴逮三月下旬受敵者凡半月解圍之後都人之不受病者萬無一二既病而死者繼踵不絶都門十有二所每日各門所送多者二千少者不下一千似此者幾三月此百萬人豈俱感風寒外傷者耶大抵人在圍城中飲食失節勞役所傷不待言而知由其朝飢暮飽起居不時寒溫失所動經兩三月胃氣虧乏久矣一旦飽食太過感而傷人而又調治失宜或發表或攻下致變結胸發黃又以陷胸茵陳等湯下之無不死者蓋初非傷寒以誤治而變似真傷寒之證皆藥之罪也因以生平已試之效著內外傷辨惑論一篇云俞惺齊曰此即大兵之後繼以大疫之謂也觀此論而始曉然於勞役飢飽之病源誠哉其為內傷矣必如是之疫不宜涼瀉而宜溫養矣若白虎承氣達原飲正犯東垣所訶責也考其時為金天興元年因蒙古兵退而改元耳尋以疫後醫師僧道園戶價棺者擅厚利命有司倍徵以助國用民生其時豈不苦極若太平之世民皆逸樂飽暖縱有勞役及飲食失節者不過經營辛苦之輩設不兼外感亦不遽病故如是之疫絶無而恰合東垣內傷論之病亦甚少惟飽暖思淫欲凡逸樂者真陰每耗則外感病中之陰虛證反不少耳又按羅謙甫云總帥相公年近七旬南征過揚州俘虜萬餘口內選美色室女近笄者四置於左右余曰新虜之人其驚憂之氣蓄於內加以飲食失節多致疾病近之則邪氣傳染為害最大況年高氣弱尤宜慎也總帥不聽至臘月班師大雪新虜人凍餒皆病頭疼咳嗽自利腹痛多致死亡正月至汴相公因赴賀宴痛飲數次遂病脈沉細而弦三四動一止見證與新虜人無異三日而卒內經云乘年之虛遇月之空失時之和因而感邪其氣至骨可不畏哉俞惺齊曰按喻氏論疫引仲景辨脈篇中寸口脈陰陽俱緊者一節闡發奧理謂清邪中上從鼻而入於陽濁邪中下從口而入於陰在陽則發熱頭疼項強頸攣在陰則足膝逆冷便溺妄出大凡傷寒之邪由外廓而入故遞傳六經疫邪由口鼻而入故直達三焦三焦相溷內外不通致有口爛食齦聲啞咽塞癰膿下血臍築湫痛等變治法未病前預飲芳香正氣藥使邪不能入若邪既入則以逐穢為第一義此與吳又可之論暗合較之李羅二家所述勞疫憂驚凍餒致病者迥別然各有至理醫者須詳察病因諦參脈證而施治也汪按據此則知疫病之因不一斷不能執一方以概治矣惟云因病致死病氣尸氣混合不正之氣種種惡穢交結互蒸人在其中無隙可避斯無人不病是誠諸疫所同然曩崇禎十六年自八月至十月京城大疫猝然而死醫禱不及後有外省人員到京能識此證看膝彎後有筋腫起紫色無救紅色速刺出血可無患以此救活多人病亦漸息是亦醫者所當知也蓋血出則疫毒外泄故得生也按又有羊毛瘟者病人心前背後有黑點如虼蚤斑者是也以小針於黑處挑之即有毛出須挑拔淨盡乃愈又輟耕録載元伯顏平宋後搜取大黃數十車滿載而去班師過淮俘掠之民及降卒與北來大兵咸病疫以大黃療之全活甚衆宋元通鑑載作耶律楚材滅夏之事則大黃洵治疫之妙品也又可溫疫論贊大黃為起死神丹原非杜撰然則李羅二家之說又未可為兵後病疫之定法矣汪按李羅二說雖非定法然亦不可不知近年所見頗有合於李羅之說者但謂之非正疫治法則可醫家大抵各明一義全在善讀書者融會貫通也蓋今世謂治疫必宜溫熱之劑固屬謬論然謂疫病斷無宜用溫熱者則又膠滯之見矣要在隨證施治用得其當耳雄按續醫說云王宇泰謂聖散子方因東坡先生作序由是天下神之宋末辛未年永嘉瘟疫服此方被害者不可勝紀余閲石林避暑録話云宣和間此藥盛行於京師太學生信之尤篤殺人無算醫頓廢之昔坡翁謫居黃州時其地瀕江多卑濕而黃之居人所感者或因中濕而病或因雨水浸淫而得所以服之多效以是通行於世遺禍無窮也宏治癸丑年吳中疫癘大作吳邑令孫磐令醫人修合聖散子遍施街衢並以其方刊行病者服之十無一生率皆狂躁昏瞀而死噫孫公之意本以活人殊不知聖散子方中有附子良薑吳萸豆蔻麻黃藿香等藥皆性味溫燥反助熱邪不死何待苟不辨證而一概施治殺人利於刀劍有能廣此說以告人亦仁者之一端也余謂疫癘多屬熱邪如老君神明散務成螢火丸倉公闢瘟丹子建殺鬼丸皆為禁劑設好仁不好學輕以傳人其禍可勝道哉汪按曰辨證曰好學皆宜著眼此等溫燥之方本以治寒濕乃用以治燥熱宜其殺人也即此論而反觀之則知遇寒濕之證而以治燥熱之方投之亦必殺人矣故傳方者非輕淡平穩之方切勿妄傳否則有利亦必有害也夫以東坡之淹博尚有誤信聖散子之事況下此者乎今之搢紳先生涉獵醫書未經臨證率爾著書立說多見其不知量也汪按洄溪有涉獵醫書誤人論語皆切中余師愚疫病篇雄按雞峰普濟方論外感諸疾有云四時之中有寒暑燥濕風五氣相搏善變諸疾今就五氣中分其清濁則暑燥為天氣系清邪風寒濕為地氣系濁邪然則仲聖所云清邪中上者不僅霧露之氣已而書傳兵火之餘難免遺亡之憾否則疫乃大證聖人立論何其略耶後賢論疫各有精義亦皆本於仲聖清濁互中之旨若但中暑燥之清邪是淫熱為病治法又與嘉言又可異汪按須知此篇乃專治燥熱之疫學者切記自不致誤用矣後人從未道及惟秦皇士云燥熱疫邪肺胃先受故時行熱病見唇焦消渴者宜用白虎湯惜語焉未詳夫暑即熱也燥即火也金石不堪其流爍況人非金石之質乎徐後山柳崖外編嘗云乾隆甲子五六月間京都大暑冰至五百文一斤熱死者無算九門出櫬日至千餘又紀文達公云乾隆癸丑京師大疫以景嶽法治者多死以又可法治者亦不驗桐鄉馮鴻臚星實姬人呼吸將絶桐城醫士投大劑石膏藥應手而痊踵其法者活人無算道光癸未吾鄉郭雲臺纂證治針經特採紀說以補治疫之一法然紀氏不詳姓氏讀之令人悵悵越五載毗陵莊制亭官於長蘆重鐫疫疹一得書出始知紀氏所目擊者乃余君師愚也原書初刻於乾隆甲寅而世鮮流行苟非莊氏幾失傳矣汪按余氏以親所試驗者筆之於書發前人所未發非妄作也無如世皆崇信溫補余氏之書非所樂聞間有信余氏之論者又不問是否燥熱為病隨手妄施以致誤人論者益復集矢於余氏矣此余氏之書所以不行於時也然豈余氏之過哉昔王白田先生作石膏辨力闢石膏以為受害者甚多豈知誤用之而殺人者善用之即可救人乎余讀之雖純疵互見而獨識淫熱之疫別開生面洵補昔賢之未逮堪為仲景之功臣不揣疏庸節取而刪潤之纂作聖經之緯論疫與傷寒似同而異疫證初起有似傷寒太陽陽明證者然太陽陽明頭痛不至如破而疫則頭痛如劈沉不能舉傷寒無汗而疫則下身無汗上身有汗惟頭汗更盛頭為諸陽之首火性炎上毒火盤踞於內五液受其煎熬熱氣上騰如籠上熏蒸之露故頭汗獨多此又痛雖同而汗獨異也有似少陽而嘔者有似太陰自利者少陽之嘔脅必痛疫證之嘔脅不痛因內有伏毒邪火干胃毒氣上衝頻頻而作太陰自利腹必滿疫證自利腹不滿大腸為傳送之官熱注大腸有下惡垢者有旁流清水者有日及數十度者此又證異而病同也論斑疹余每論熱疫不是傷寒傷寒不發斑疹或曰熱疫不是傷寒固已至云傷寒不發斑疹古人何以謂傷寒熱未入胃下之太早熱乘虛入胃故發斑熱已入胃不即下之熱不得泄亦發斑斯何謂歟曰古人以溫熱皆統於傷寒故內經云熱病者傷寒之類也難經分別五種之傷寒傷寒論辨別五種之治法既云熱入胃縱非溫熱亦是寒邪化熱故可用白虎三黃化斑解毒等湯以涼解也今人不悟此理而因以自誤誤人至論大者為斑小者為疹赤者胃熱極五死一生紫黑者胃爛九死一生余斷生死則又不在斑之大小紫黑總以其形之鬆浮緊束為憑耳如斑一出松活浮於皮面紅如朱點紙黑如墨塗膚此毒之松活外見者雖紫黑成片可生一出雖小如粟緊束有根如履透針如矢貫的此毒之有根錮結者縱不紫黑亦死苟能細心審量神明於鬆浮緊束之間決生死於臨證之頃始信余言之不謬也論治疫仲景之書原有十六卷今世只傳十卷豈疫疹一門亦在遺亡之數歟以致後世立說紛紛至河間清熱解毒之論出有高人之見異人之識其旨既微其意甚遠後人未廣其說而反以為偏馮氏錦囊亦云斑疹不可發表此所謂大中至正之論惜未暢明其旨後人何所適從又可辨疫甚析如頭痛發熱惡寒不可認為傷寒表證強發其汗徒傷表氣熱不退又不可下徒傷胃氣斯語已得其奧妙奈何以疫氣從口鼻而入不傳於胃而傳於膜原此論似有語病至用達原飲三消諸承氣猶有附會表裡之意惟熊恁昭熱疫志驗首用敗毒散去其爪牙繼用桔梗湯同為舟楫之劑治胸膈手六經邪熱以手足少陽俱下膈絡胸中三焦之氣為火同相火遊行一身之表膈與六經乃至高之分此藥浮載亦至高之劑施於無形之中隨高下而退胸膈及六經之熱確係妙方汪按敗毒散似未盡妥究宜慎用余今採用其法減去硝黃以熱疫乃無形之毒難以當其猛烈重用石膏直入肺胃先搗其窩巢之害而十二經之患自易平矣無不屢試屢驗明者察之論治疹疹出於胃古人言熱未入胃而下之熱乘虛入胃故發斑熱已入胃不即下之熱不得泄亦發斑此指寒邪化熱誤下失下而言若疫疹未經表下有熱不一日而即發者故余謂熱疫有斑疹傷寒無斑疹也熱疫之斑疹發之愈遲其毒愈重一病即發以其胃本不虛偶染疫邪不能入胃猶之牆垣高大門戶緊密雖有小人無從而入此又可所謂達於膜原者也有遲至四五日而仍不透者非胃虛受毒已深即發表攻裡過當胃為十二經之海上下十二經都朝宗於胃胃能敷布十二經榮養百骸毫髮之間靡所不貫毒既入胃勢必敷布於十二經戕害百骸使不有以殺其炎炎之勢則百骸受其煎熬不危何待疫既曰毒其為火也明矣火之為病其害甚大土遇之而焦金遇之而熔木遇之而焚水不能勝則涸故易曰燥萬物者莫熯乎火古人所謂元氣之賊也以是知火者疹之根疹者火之苗也如欲其苗之外透非滋潤其根何能暢茂一經表散燔灼火焰如火得風其焰不愈熾乎焰愈熾苗愈遏矣疹之因表而死者比比然也其有表而不死者乃麻疹風疹之類有謂疹可治而斑難治者殆指疫疹為斑耳夫疫疹亦何難治哉但人不知用此法也論疫疹之脈不能表下疫疹之脈未有不數者有浮大而數者有沉細而數者有不浮不沉而數者有按之若隱若見者此靈樞所謂陽毒伏匿之象也診其脈即知其病之吉凶浮大而數者其毒發揚一經涼散病自霍然沉細而數者其毒已深大劑清解猶可撲滅至於若隱若見或全伏者其毒重矣其證險矣此脈得於初起者間有得於七八日者頗多何也醫者初認為寒重用發表先傷其陽表而不散繼之以下又傷其陰殊不知傷寒五六日不解法在當下猶必審其脈之有力者宜之疫熱乃無形之毒病形雖似大熱而脈象細數無力所謂壯火食氣也若以無形之火熱而當硝黃之猛烈熱毒焉有不乘虛而深入耶怯弱之人不為陽脫即為陰脫氣血稍能駕馭者亦必脈轉沉伏變證蜂起或四肢逆冷或神昏譫語或鬱冒直視或遺溺旁流甚至舌卷囊縮循衣摸床種種惡候頗類傷寒醫者不悟引邪入內陽極似陰而曰變成陰證妄投參桂死如服毒遍身青紫口鼻流血如未服熱藥者即用大劑清瘟敗毒飲重加石膏或可挽回余因歷救多人故表而出之論疹形治法鬆浮灑於皮面或紅或赤或紫或黑此毒之外見者雖有惡證不足慮也若緊束有根如從皮里鑽出其色青紫宛如浮萍之背多見於胸背此胃熱將爛之候即宜大清胃熱兼涼其血以清瘟敗毒飲加紫草紅花桃仁歸尾務使松活色淡方可挽回稍存疑慮即不能救論疹色治法血之體本紅血得其暢則紅而活榮而潤敷布洋溢是疹之佳境也淡紅有美有疵色淡而潤此色之上者也若淡而不榮或嬌而豔干而滯血之最熱者深紅者較淡紅為稍重亦血熱之象涼其血即轉淡紅色豔如胭脂此血熱之極較深紅為更惡必大用涼血始轉深紅再涼其血而淡紅矣紫赤類雞冠花而更豔較豔紅為火更盛不急涼之必至變黑須服清瘟敗毒飲加紫草桃仁細碎宛如粟米紅者謂之紅砂白者謂之白砂疹後多有此證乃餘毒盡透最美之境愈後蛻皮若初病未認是疫後十日半月而出者煩躁作渴大熱不退毒發於頷者死不可救論發瘡疫毒發斑毒之散者也疫毒發瘡毒之聚者也初起之時惡寒發熱紅腫硬痛此毒之發揚者但寒不熱平扁不起此毒之內伏者或發於要地發於無名發於頭面發於四肢種種形狀總是瘡證何以知其是疫毒所聚尋常瘡脈洪大而數疫毒之脈沉細而數尋常瘡證頭或不痛疫毒則頭痛如劈沉不能舉是其驗也稽其證有目紅面赤而青慘者有忽汗忽嘔者有昏憒如迷者有身熱肢冷者有腹痛不已者有大吐乾嘔者有大泄如注者有譫語不止者有妄聞妄見者有大渴思水者有煩躁如狂者有喊叫時作若驚若惕者病態多端大率類是誤認尋常瘡證溫托妄施斷不能救雄按暑濕熱疫諸病皆能外發癰瘡然病人不自知其證發之由外科亦但見其外露之瘡因而誤事者最多人亦僅知其死於外證也噫論妊娠病疫母之於胎一氣相連蓋胎賴母血以養母病熱疫毒火蘊於血中是母之血即毒血矣苟不亟清其血中之毒則胎能獨無恙乎須知胎熱則動胎涼則安母病熱疫胎自熱矣竭力清解以涼血使母病去而胎可無虞若不知此而舍病以保胎必至母子兩不保也至於産後以及病中適逢經至當以類推若云産後經期禁用涼劑則誤人性命即在此言論悶證疫診初起六脈細數沉伏面色青慘昏憒如迷四肢逆冷頭汗如雨其痛如劈腹內攪腸欲吐不吐欲泄不泄男則仰臥女則復臥搖頭鼓頷百般不足此為悶疫斃不終朝如欲挽回於萬一非大劑清瘟敗毒飲不可醫即敢用病家決不敢服與其束手待斃不如含藥而亡雖然難矣哉雄按所謂悶者熱毒深伏於內而不發露於外也漸伏漸深入臟而死不俟終日也固已治法宜刺曲池委中以泄營分之毒再灌以紫雪清透伏邪使其外越楊云治法精良或可挽回清瘟敗毒飲何可試耶汪按本方有遏抑而無宣透故決不可用疫診治驗乾隆戊子年吾邑疫疹流行初起之時先惡寒而後發熱頭痛如劈腰如被杖腹如攪腸嘔泄兼作大小同病萬人一轍有作三陽治者有作兩感治者有作霍亂治者逮至兩日惡候蜂起種種危證難以枚舉如此死者不可勝計良由醫者固執古方之所致也要之執傷寒之方以治疫焉有不死者乎是人之死不死於病而死於藥不死於藥而死於執古方之醫也疫證乃外來之淫熱非石膏不能取效且醫者意也石膏者寒水也以寒勝熱以水勝火投之百發百中五月間余亦染疫凡邀治者不能赴診叩其證狀録方授之互相傳送活人無算癸丑京師多疫即汪副憲馮鴻臚亦以余方傳送服他藥不效者並皆霍然故筆之於書名曰清瘟敗毒飲隨證加減詳列於後雄按吳門顧松園靖遠因父患熱病為庸醫投參附所殺於是發憤習醫寒暑靡間者閲三十年嘗著醫鏡十六卷徐侍郎秉義為之序稱其簡而明約而該切於時用而必效惜無刊本余求其書而不得近見桐鄉陸定圃進士冷廬醫話載其治汪纘功陽明熱證主白虎湯每劑石膏用三兩兩服熱頓減而遍身冷汗肢冷發厄郡中著名老醫謂非參附弗克回陽諸醫和之群譁白虎再投必斃顧引仲景熱深厥亦深之文及嘉言陽證忽變陰厥萬中無一之說諄諄力辨諸醫固執不從投參附回陽斂汗之劑汗益多而體益冷反詆白虎之害微陽脫在旦暮勢甚危舉家驚惶復求顧診仍主白虎用石膏三兩大劑二服汗止身溫再以前湯加減數服而痊因著辨治論以為溫熱病中宜用白虎湯並不傷人以解世俗之惑陸進士云此說與師愚之論合且醫鏡中佳方不少其治虛勞方用生地熟地天冬麥冬龜版龍眼肉玉竹茯苓山藥人乳吳醫匯講乃屬之汪纘功方中增入牛膝一味豈顧著醫鏡一書為汪氏所竊取耶附及之以質博雅汪按虛勞而咳者肺中必有邪麥冬玉竹不宜用疫證條辨頭痛目痛頗似傷寒然太陽陽明頭痛不至於傾側難舉而此則頭痛如劈兩目昏瞀勢若難支總因火毒達於二經毒參陽位用釜底抽薪法徹火下降其痛立止其疹自透宜清瘟敗毒飲增石膏元參加菊花誤用辛涼表散燔灼火焰必轉悶證骨節煩疼腰如被杖骨與腰皆腎經所屬其痛若此是淫熱之氣已流於腎經宜本方增石膏元參加黃柏誤用溫散死不終朝矣熱宜和不宜躁若熱至遍體炎炎較之昏沉肢冷者而此則發揚以其氣血尚堪勝毒一經清解而疹自透妄肆發表必至內伏宜本方增石膏生地丹皮芩連有似乎靜而忽躁有似乎躁而忽靜謂之靜躁不常較之顛狂彼乃發揚而此嫌郁遏總為毒火內擾以至坐臥不安宜本方增石膏犀角黃連寤從陽主上寐從陰主下胃為六腑之海熱毒壅遏阻隔上下故火擾不寐宜本方增石膏犀連加琥珀雄按火擾不寐何必琥珀若欲導下宜用木通初病周身如冰色如蒙垢滿口如霜頭痛如劈飲熱惡冷六脈沉細此陽極似陰毒之隱伏者也重清內熱使毒熱外透身忽大熱脈轉洪數煩躁譫妄大渴思冰證雖梟惡尚可為力宜本方增石膏丹皮犀連加黃柏若遇庸手妄投桂附藥不終劑死如服毒四肢屬脾至於逆冷雜證見之是脾經虛寒元陽將脫之象惟疫則不然通身大熱而四肢獨冷此烈毒郁遏脾經邪火莫透重清脾熱手足自溫宜本方增石膏雄按四肢逆冷在雜證不僅脾經虛寒在疫證亦非毒壅脾經增石膏原是清胃胃氣行則肢自和也亦有熱伏厥陰而逆冷者溫疫證中最多不可不知也筋屬肝賴血以養熱毒流於肝經斑疹不能尋竅而出筋脈受其沖激則抽惕若驚宜本方增石膏丹皮加膽草雜證有精液枯涸水不上升咽乾思飲不及半杯而此則思冰飲水百杯不足緣毒火熬煎於內非冰水不足以救其燥非石膏不足以制其焰庸工猶戒生冷病家奉為至言即溫水亦不敢與以致唇焦舌黑宜本方增石膏加花粉四時百病胃氣為本至於不食似難為也而非所論於疫證此乃邪火犯胃熱毒上衝頻頻乾嘔者有之旋食旋吐者有之胃氣一清不必強之食自無不食矣宜本方增石膏加枳殼雄按熱壅於胃杳不知飢強進粥糜反助邪氣雖粒米不進而病勢未衰者不可疑為胃敗也若干嘔吐食則本方之甘桔丹皮皆不可用宜加竹茹枇杷葉半夏之類胸膈乃上焦心肺之地而邪不易犯惟火上炎易及於心以火濟火移熱於肺金被火灼其燥愈甚胸膈郁遏而氣必長吁矣宜本方增連桔加枳殼蔞仁雄按邪火上炎固能郁遏肺氣而為膈滿第平素有停痰伏飲者或起病之先兼有食滯者本方地芍未可浪投臨證須辨別施治惟蘆蔔汁既清燥火之閉郁亦開痰食之停留用得其宜取效甚捷昏悶無聲者心之氣出於肺而為聲竅因氣閉氣因毒滯心迷而神不清竅閉而聲不出宜本方增石膏犀角芩連加羚羊角桑皮雄按桑皮雖走肺而無通氣宣竅之能宜用馬兜鈴射干通草之類清神化毒當參紫雪之類胃氣弱者偏寒偏熱水停食積皆與真氣相搏而痛此言尋常受病之源也至於疫證腹痛或左或右或痛引小腸乃毒火衝突發泄無門苦按尋常腹痛分經絡而治之必死如初起只用敗毒散或涼膈散加黃連其痛立止雄按疫證腹痛固與雜證迥殊然夾食夾瘀夾疝因病疫而宿疾兼發者亦正多也臨證處方豈可不為顧及筋肉瞤動在傷寒則為亡陽而此則不然蓋汗者心之液血之所化也血生於心藏於肝統於脾血被煎熬筋失其養故筋肉為之瞤動宜本方增石膏生地元參加黃柏雄按亡陽瞤動宜補土製水淫熱瞤動宜瀉火息風本方尚少鎮靜息風之品宜去丹桔加菊花膽草病人自言胃出冷氣非真冷也乃上升之氣自肝而出中挾相火自下而上其熱尤甚此火極似水熱極之徵陽亢逼陰故有冷氣宜本方增石膏犀地丹連加膽草雄按冷氣上升雖在別證中見之亦多屬火不知者妄投溫熱貽害可勝道哉本方桔芍亦屬非宜更有挾痰者須加海蜇竹瀝蘆蔔汁之類汪按此證挾痰者最多口中臭氣令人難近使非毒火熏蒸於內何以口穢噴人乃爾耶宜本方增石膏犀連雄按宜加蘭草竹茹枇杷葉金銀花薔薇露瑩白金汁之類以導穢濁下行舌苔滿口如霜在傷寒為寒證的據故當溫散而疫證見此舌必厚大為火極水化宜本方增石膏犀地翹連加黃柏誤用溫散旋即變黑汪按凡溫熱暑疫見此舌者病必見重最宜詳慎雄按凡熱證疫證見此苔者固不可誤指為寒良由兼痰挾濕遏伏熱毒使然清解方中宜佐開泄之品為治咽喉者水穀之道路呼吸之出入毒火熏蒸至於腫痛亟當清解以開閉塞宜本方增石膏元桔加牛蒡射干山豆根雄按加瑩白金汁最妙藥汁礙咽者亟以錫類散吹之唇者脾之華唇焮腫火炎土燥也宜本方增石膏翹連加天花粉頭為諸陽之首頭面腫大此毒火上攻宜本方增石膏元參加銀花馬勃殭蠶板藍根紫花地丁歸尾脈實者量加酒洗生大黃面上燎疱宛如火燙大小不一有紅有白有紫黑相間痛不可忍破流清水亦有流血水者治同上條腮者肝腎所屬有左腫者有右腫者有右及左左及右者名曰痄腮不亟清解必成大頭治同上條頸屬足太陽膀胱經熱毒入於太陽則頸腫宜本方增石膏元參翹桔加銀花夏枯草牛蒡紫花地丁山豆根耳後腎經所屬此處硬腫其病甚惡宜本方增石膏元地丹翹加銀花花粉板藍根紫花地丁耳中出血者不治雄按坎為耳故耳為腎水之外候然肺經之結穴在耳中名曰龍蔥專主乎聽金受火爍則耳聾凡溫熱暑疫等證耳聾者職是故也不可泥於傷寒少陽之文而妄用柴胡以煽其焰古云耳聾治肺旨哉言乎舌乃心之苗心屬火毒火衝突二火相併心苗乃動而嗒舌弄舌宜本方增石膏犀連元參加黃柏雄按宜加木通蓮子心硃砂童溺之類紅絲繞目清其浮僭之火而紅自退誤以眼科治之為害不淺宜本方加菊花紅花蟬蛻歸尾穀精雄按加味亦是眼科之藥不若但加羚羊角龍膽草二味為精當也頭為一身之元首最輕清而邪不易干通身焦燥獨頭汗湧出此烈毒鼎沸於內熱氣上騰故汗出如淋宜本方增石膏元參雄按本方宜去芍桔丹皮加童溺花粉齒者骨之餘雜證齘齒為血虛疫證見之為肝熱宜本方增石膏生地丹梔加膽草雄按齒齦屬陽明不可全責之肝也疫證鼻衄如泉乃陽明鬱熱上衝於腦腦通於鼻故衄如湧泉宜本方增石膏元地芩連加羚羊角生桑皮棕櫚灰雄按本方宜去桔梗加白茅根舌上白點如珍珠乃水化之象較之紫赤黃黑古人謂之芒刺者更重宜本方增石膏犀連元翹加花粉銀花雄按宜加薔薇根瑩白金汁之類疫證初起苔如膩粉此火極水化設誤認為寒妄投溫燥其病反劇其苔愈厚精液愈耗水不上升二火煎熬變白為黑其堅如鐵其厚如甲敲之戛戛有聲言語不清非舌卷也治之得法其甲整脫宜本方增石膏元參犀連知翹加花粉黃柏雄按此證專宜甘寒以充津液不當參用苦燥余如梨汁蔗漿竹瀝西瓜汁藕汁皆可頻灌如得蕉花上露更良楊云蕉花上露為清熱無上妙品但不可必得即蕉根取汁亦極妙也若邪火已衰津不能回者宜用鮮豬肉數斤切大塊急火煮清湯吹淨浮油恣意涼飲乃急救津液之無上妙品故友範慶簪嘗謂余云酷熱炎天正銀匠熔鑄各州縣奏銷銀兩之時而銀爐甚高火光撲面非壯盛之人不能為也口渴不敢啜茗惟以淡煮豬肉取湯涼飲故裸身近火而津液不致枯竭余因推廣其義頗多妙用拙案中可證也舌上發丁或紅或紫大如馬乳小如櫻桃三五不等流膿出血重清心火宜本方增石膏犀角翹連加銀花舌上成坑愈後自平此二條乃三十六舌未有者雄按亦宜加薔薇根金汁之類外以錫類散或珍珠牛黃研細糝之則坑易平舌衄乃血熱上溢心苗宜本方增石膏黃連犀地梔丹加敗棕灰雄按外宜蒲黃炒黑糝之齒衄乃陽明少陰二經之熱相併宜本方增石膏元參芩連犀地丹梔加黃柏心主神心靜則神爽心為烈火所燔則神不清而譫語宜本方增石膏犀連丹梔加黃柏膽草雄按須參葉氏溫熱論逆傳治法且此證挾痰者多最宜諦審厄逆有因胃熱上衝者有因肝膽之火上逆者有因肺氣不能下降者宜本方增石膏加竹茹枇杷葉柿蒂羚羊角銀杏仁如不止用沉香檳榔烏藥枳殼各磨數分名四磨飲仍以本方調服雄按此三候固皆實證尚有痰阻於中者便祕於下者另有治法銀杏仁溫澀氣分但可以治虛厄不宜加入此方邪入於胃則吐毒猶因吐而得發越至於乾嘔則重矣總由內有伏毒清解不容少緩宜本方增石膏甘連加滑石伏龍肝雄按甘草宜去伏龍肝溫燥之品但可以治虛寒嘔吐不宜加入此方本方桔梗丹芍亦當去之可加旋覆花竹茹半夏枇杷葉如用反佐則生薑汁為妥汪按此方中生薑不可少疫毒移於大腸裡急後重赤白相兼或下惡垢或下紫血雖似痢實非痢也其人必惡寒發熱小水短赤但當清熱利水宜本方增石膏黃連加滑石豬苓澤瀉木通其痢自止誤用通利止澀之劑不救雄按熱移大腸惡垢既下病有出路化毒為宜既知不可通利何以仍加苓澤等利水毋乃疏乎惟滑石用得對證他如金銀花槐蕊黃柏青蒿白頭翁苦參蘆蔔之類皆可採也毒火注於大腸有下惡垢者有利清水者有傾腸直注者有完穀不化者此邪熱不殺穀非脾虛也較之似痢者稍輕考其證身必大熱氣必粗壯小溲必短唇必焦紫大渴喜冷腹痛不已四肢時而厥逆宜因其勢而清利之治同上條雄按唇焦大渴津液耗傷清化為宜毋過滲利惟冬瓜煮湯代茶煎藥恣用甚佳汪按此及上條皆宜用緑豆疫證大便不通因毒火煎熬大腸枯燥不能潤下不可徒攻其閉結而速其死也宜本方加生大黃或外用蜜煎導法汪按此證宜用麻仁邪犯五臟則三陰脈絡不和血乖行度滲入大腸而便血宜本方增生地加槐花柏葉棕灰雄按棕灰溫澀即欲止之宜易地榆炭膀胱熱極小溲短赤而澀熱毒甚者溲色如油宜本方加滑石澤瀉豬苓木通通草扁蓄雄按苓澤等藥皆滲利之品溺阻膀胱者藉以通導此證既云熱毒內熾則水已耗奪小溲自然渾赤短澀但宜治其所以然則源清而流潔豈可強投分利而為礱糠打油之事乎或量證少佐一二味慎毋忽視而泛施也溺血小便出血而不痛血淋則小腹陰莖必兼脹痛在疫證總由血因熱迫宜本方增生地加滑石桃仁茅根琥珀牛膝棕灰雄按設兼痛脹忌用棕灰汪按亦宜用地榆炭發狂罵詈不避親疏甚則登高而歌棄衣而走逾垣上屋力倍常時或語生平未有之事未見之人如有邪附者此陽明明邪熱上擾神明病人亦不自知僧道巫尼徒亂人意宜本方增石膏犀連丹梔加黃柏雄按宜加硃砂青黛挾痰加石菖蒲竹瀝之類疫證之痰皆屬於熱痰中帶血熱極之徵宜本方增石膏芩地加蔞仁羚羊角生桑皮棕灰雄按桑皮棕灰可商宜加滑石桃仁葦莖瓜瓣之類疫證遺溺非虛不能約乃熱不自持其人必昏沉譫語遺不自知宜本方增石膏犀連加滑石諸病喘滿皆屬於熱況疫證乎宜本方增石膏黃芩加桑皮羚羊角雄按杏仁厚朴半夏旋覆花枇杷葉蔞仁蘆蔔海蜇蘆根之類皆可隨證採用本方地芍宜去之汪按下條亦宜去地芍淫熱熏蒸濕濁壅遏則周身發黃宜本方增石膏梔子加茵陳滑石豬苓澤瀉木通汪按濕盛而用石膏似宜佐以蒼朮厚朴之類雄按此證亦有宜下者汪按青殼鴨蛋敲小孔納朴硝於孔中紙封燉熟日日服之義取一補一消治黃疸甚效余嘗親試之初時便溏不爽服朴硝而便反干暢矣疫證循衣摸床撮空此肝經淫熱也肝屬木木動風搖風自火出左傳云風淫末疾四末四肢也肢動即風淫之疾也宜本方增石膏犀連梔丹加膽草雄按桑枝菊花絲瓜絡羚羊角白薇之類皆可採用實者宜兼通腑虛者宜兼養陰狐蜮宜本方增石膏犀角加苦參烏梅槐子以上五十證熱疫惡候變態無恆失治於前多致莫救慎之慎之疫證熱毒盤踞於內外則遍體炎炎夫熱極之病是必投以寒涼火被水克其焰必伏火伏於內必生外寒陰陽相搏則戰一戰而經氣輸泄大汗出而病邪解矣疫證瘥後四肢浮腫弗遽溫補雄按宜清餘熱兼佐充津瘥後飲食漸增而大便久不行亦無所苦此營液未充若誤投通利死不終朝矣汪按宜食黑脂麻熱疫為病氣血被其煎熬瘥後飲食漸進氣血滋生潤皮膚而灌筋骸或痛或癢宛如蟲行最是佳境不過數日氣血通暢而自愈矣疫證失治於前熱流下部滯於經絡以致腰膝疼痛甚者起不能立臥不能動誤作痿治必成廢人宜本方小劑加木瓜牛膝續斷萆薢黃柏威靈仙瘥後不欲飲食食亦不化此脾胃虛弱宜健脾養胃雄按不欲食病在胃宜養以甘涼食不化病在脾當補以溫運醫者須分別論治汪按葉香岩論脾胃辨析最明暢余以為勝於東垣之專事升脾學者所當師法也瘥後驚悸屬血虛宜養血鎮驚雄按亦有因痰熱未清者不可不知也汪按因痰者頗多瘥後怔忡乃水衰火旺心腎不交宜補水養心雄按硃砂安神丸最妙汪按亦有兼挾痰者瘥後有聲不能言此水虧不能上接於陽也宜補水雄按有痰熱滯於肺絡者宜清肅有疫熱耗傷肺陰者宜清養不僅水虧為然也瘥後聲顫無力語不接續名曰鄭聲乃氣虛也宜補中益氣湯汪按第五卷方論不録此方附論在清暑益氣湯下雄按此證雖屬氣虛實由元氣無根補中益氣升陽之劑切勿誤投宜集靈膏瘥後喜唾胃虛而有餘熱也烏梅十個北棗五枚俱去核共杵如泥加煉蜜丸彈子大每用一丸噙化雄按此方甚佳言者心之聲也病中譫妄乃熱擾於心瘥後多言餘熱未淨譬如滅火其火已息猶存余焰也雄按宜導赤散加麥冬蓮子心硃砂染燈心瘥後遺精宜交心腎雄按精因火動者多宜清餘熱黃連黃柏最是要藥瘥後觸事易驚夢寐不安乃有餘熱挾痰也痰與氣搏故恐懼雄按宜用竹茹黃連石菖蒲半夏膽星梔子知母茯苓旋覆花橘紅等藥瘥後終日昏睡不醒或錯語呻吟此因邪熱未淨伏於心包絡所致雄按宜用丹參白薇梔子麥冬甘草木通鹽水炒黃連竹葉硃砂染燈心細茶等藥挾痰者花粉天竺黃石菖蒲省頭草之類或萬氏牛黃清心丸皆可採用瘥後自汗盜汗虛象也宜分陰陽而補益雄按固屬虛候多內餘熱未清心陽內熾慎勿驟補清養為宜如西洋參生地麥冬黃連甘草小麥百合竹葉茯苓蓮子心之類擇而為劑可也瘥後心神不安乃心血虧損宜養心雄按固是心營不足亦因餘熱未清治如上條可也瘥後虛煩不寐者血虛神不守舍也雄按非神不守舍也亦餘火擾動耳治如上法或加阿膠或加生雞子黃或加珍珠審證而用得其宜貴乎醫者之神悟矣瘥後餘熱未淨腸胃虛弱飲食不節穀氣與熱氣兩陽相搏身復發熱名曰食復雄按治法與傷寒食復同更有瘥後起居不慎作勞太早虛陽浮擾而發熱者名曰勞復治宜調氣血瘥後早犯女色而病者名女勞復女犯者為男勞復其證頭重目眩腰痛肢酸面熱如烘心胸煩悶宜麥冬湯主之若舌出寸余纍日不收名曰陽強以冰片研細糝之即縮長至數寸者多不救雄按此方甚妙宜加竹茹枸杞子男子新瘥餘熱未淨而女人與之交接得病者名陽易女人新瘥餘熱未清而男子與之交接得病者名陰易其證男子則陰腫入腹絞痛難忍女人則乳抽裡急腰胯痛引腹內熱攻胸膈頭重難抬仰臥不安動搖不得最危之證雄按陰陽二易余謂之熱入精室證第陰易較重於陽易以女人疫熱之氣本從陰戶出也古人用裩襠之義最精取其能引熱邪仍由原路去故陰易須剪所交接女人身穿未浣之裩襠千金用月經赤帛亦從此脫胎陽易須剪所交接男子身穿未浣之裩襠並取近陰處之數寸燒灰服下奏效甚捷後人之用鼠矢亦取其以濁導濁之義然究不如燒裩散之貼切矣余如竹茹花粉韭白滑石白薇槐米楝實緑豆甘草梢土茯苓等藥並走精室皆可隨證採用以上三條溫熱病後亦同不僅疫證爾也
