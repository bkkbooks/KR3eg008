body:
  text: 卷三葉香岩外感溫熱篇章虛谷曰仲景論六經外感止有風寒暑濕之邪論溫病由伏氣所發而不及外感或因書有殘缺皆未可知後人因而穿鑿附會以大青龍越脾等湯證治為溫病而不知其實治風寒化熱之證也其所云太陽病發熱而渴為溫病是少陰伏邪出於太陽以其熱從內發故渴而不惡寒若外感溫病初起卻有微惡寒者以風邪在表也亦不渴以內無熱也似傷寒而實非傷寒如辨別不清多致誤治因不悟仲景理法故也蓋風為百病之長而無定體如天時寒冷則風從寒化而成傷寒溫暖則風從熱化而為溫病以其同為外感故證狀相似而邪之寒熱不同治法迥異豈可混哉二千年來紛紛議論不能剖析明白我朝葉天士始辨其源流明其變化不獨為後學指南而實補仲景之殘缺厥功大矣爰釋其義以便覽焉溫邪上受首先犯肺逆傳心包肺主氣屬衛心主血屬營辨營衛氣血雖與傷寒同若論治法則與傷寒大異也華岫云曰邪從口鼻而入故曰上受但春溫冬時伏寒藏於少陰遇春時溫氣而發非必上受之邪也則此所論溫邪乃是風溫濕溫之由於外感者也吳鞠通曰溫病由口鼻而入自上而下鼻通於肺肺者皮毛之合也經云皮應天為萬物之大表天屬金人之肺亦屬金溫者火之氣風者火之母火未有不剋金者故病始於此諸邪傷人風為領袖故稱百病之長即隨寒熱溫涼之氣變化為病故經言其善行而數變也身半以上天氣主之為陽身半以下地氣主之為陰風從寒化屬陰故先受於足經風從熱化屬陽故先受於手經所以言溫邪上受首先犯肺者由衛分而入肺經也以衛氣通肺營氣通心而邪自衛入營故逆傳心包也內經言心為一身之大主而不受邪受邪則神去而死凡言邪之在心者皆心之包絡受之蓋包絡為心之衣也心屬火肺屬金火本剋金而肺邪反傳於心故曰逆傳也風寒先受於足經當用辛溫發汗風溫先受於手經宜用辛涼解表上下部異寒溫不同故治法大異此傷寒與溫病其初感與傳變皆不同也不標姓氏者皆章氏原釋雄按難經從所勝來者為微邪章氏引為逆傳心包解誤矣蓋溫邪始從上受病在衛分得從外解則不傳矣第四章云不從外解必致里結是由上焦氣分以及中下二焦者為順傳惟包絡上居膻中邪不外解又不下行易於襲入是以內陷營分者為逆傳也然則溫病之順傳天士雖未點出楊云肺與心相通故肺熱最易入心天士有見於此故未言順傳而先言逆傳也而細繹其議論則以邪從氣分下行為順邪入營分內陷為逆也楊云二語最精確汪按既從氣分下行為順是必非升提所宜矣俗醫輒云防其內陷妄用升提不知此內陷乃邪入營分非真氣下陷可比苟無其順何以為逆章氏不能深究而以生克為解既乖本旨又悖經文豈越人之書竟未讀耶蓋傷寒之邪留戀在表然後化熱入里溫邪則熱變雄按唐本作化熱最速未傳心包邪尚在肺肺主氣其合皮毛唐本作肺合皮毛而主氣故云在表在表唐本無此二字初用辛涼何以首節章釋改辛平今訂正之輕劑挾風則加入唐本無則入二字薄荷牛蒡之屬挾濕加蘆根滑石之流或透風於熱外或滲濕於熱下不與熱相搏勢必孤矣傷寒邪在太陽必惡寒甚其身熱者陽郁不伸之故而邪未化熱也傳至陽明其邪化熱則不惡寒始可用涼解之法若有一分惡寒仍當溫散蓋以寒邪陰凝故須麻桂猛劑若溫邪為陽則宜輕散倘重劑大汗而傷津液反化燥火則難治矣始初解表用辛涼須避寒凝之品恐遏其邪反不易解也或遇陰雨連綿濕氣感於皮毛須解其表濕使熱外透易解否則濕閉其熱而內侵病必重矣其挾內濕者清熱必兼滲化之法不使濕熱相搏則易解也略參拙意不爾風挾溫熱而燥生清竅必干謂水主之氣不能上榮兩陽相劫也濕與溫合蒸鬱而矇蔽於上清竅為之壅塞濁邪害清也其病有類傷寒其唐本無此字驗之之法傷寒多有變證溫熱雖久在一經不移以此為辨唐本作總在一經為辨章本作而少傳變為辨較妥胃中水穀由陽氣化生津液故陽虛而寒者無津液上升停飲於胃遏其陽氣亦無津液上升而皆燥渴仲景已備論之此言風熱兩陽邪劫其津液而成燥渴其因各不同則治法迥異也至風雨霧露之邪受於上焦與溫邪蒸郁上蒙清竅如仲景所云頭中寒濕頭痛鼻塞納藥鼻中一條雖與溫邪矇蔽相同又有寒熱不同也傷寒先受於足經足經脈長而多傳變溫邪先受於手經手經脈短故少傳變是溫病傷寒之不同皆有可辨也雄按上第一章統言風溫濕溫與傷寒證治之不同而章氏分三節以釋之也前言辛涼散風甘淡驅濕若病仍不解是漸欲入營也營分受熱則血液受章本作被劫心神不安夜甚無寐成斑點隱隱即撤去氣藥如從風熱陷入者用犀角竹葉之屬如從濕熱陷入者唐本者下有用字犀角花露之品參入涼血清熱方中若加煩躁大便不通金汁亦可加入老年或平素有寒者以人中黃代之急急唐本作速透斑為要熱入於營舌色必絳風熱無濕者舌無苔或有苔亦薄也熱兼濕者必有濁苔而多痰也然濕在表分者亦無苔雄按亦有薄苔其脈浮部必細澀也此論先生口授及門以吳人氣質薄弱故用藥多輕淡是因地制宜之法與仲景之理法同而方藥不同或不明其理法而但仿用輕淡之藥是效顰也或又以吳又可為宗者又謂葉法輕淡如兒戲不可用是皆坐井論天者也雄按又可亦是吳人雄按仲景論傷寒又可論疫證麻桂達原不嫌峻猛此論溫病僅宜輕解況本條所列乃上焦之治藥重則過病所吳茭山云凡氣中有熱者當行清涼薄劑吳鞠通亦云治上焦如羽非輕不舉也觀後章論中下焦之治何嘗不用白虎承氣等法乎章氏未深探討曲為蓋護毋乃視河海為不足而欲以淚益之耶華岫云嘗云或疑此法僅可治南方柔弱之軀不能治北方剛徑之質余謂不然其用藥有極輕清極平淡者取效更捷苟能悟其理則藥味分量或可權衡輕重至於治法則不可移易蓋先生立法之所在即理之所在不遵其法則治不循理矣南北之人強弱雖殊感病之由則一也其補瀉溫涼豈可廢繩墨而出範圍之外乎況姑蘇商旅雲集所治豈皆吳地之人哉不必因其輕淡而疑之也又葉氏景嶽發揮云西北人亦有弱者東南人亦有強者不可執一而論故醫者必先議病而後議藥上焦溫證治必輕清此一定不易之理法天士獨得之心傳不必章氏曲為遮飾也汪按急急透斑不過涼血清熱解毒俗醫必以胡荽浮萍櫻桃核西河柳為透法大謬若斑出熱不解者胃津亡也主以甘寒重則如玉女煎唐本無如字輕則如梨皮蔗漿之類或其人腎水素虧雖未及下焦唐本雖上有病字先自倣徨矣唐本作每多先事倣徨必驗之於舌唐本必上有此字如甘寒之中加入鹹寒務在先安未受邪之地恐其陷入易易唐本無此二字耳尤拙吾曰蘆根梨汁蔗漿之屬味甘涼而性濡潤能使肌熱除而風自息即內經風淫於內治以甘寒之旨也斑出則邪已透發理當退熱其熱仍不解故知其胃津亡水不濟火當以甘寒生津若腎水虧者熱尤難退故必加鹹寒如元參知母阿膠龜版之類所謂壯水之主以制陽光也如仲景之治少陰傷寒邪本在經必用附子溫臟即是先安未受邪之地恐其陷入也熱邪用鹹寒滋水寒邪用鹹熱助火藥不同而理法一也驗舌之法詳後雄按此雖先生口授及門之論然言簡義賅不可輕移一字本條主以甘寒重則如玉女煎者言如玉女煎之石膏地黃同用以清未盡之熱而救已亡之液以上文曾言邪已入營故變白虎加人參法而為白虎加地黃法楊云慧心明眼絶世聰明不曰白虎加地黃而曰如玉女煎者以簡捷為言耳唐本刪一如字徑作重則玉女煎是印定為玉女煎之原方矣鞠通虛谷因而襲誤豈知胃液雖亡身熱未退熟地牛膝安可投乎余治此證立案必先正名曰白虎加地黃湯斯為清氣血兩燔之正法至必驗之於舌乃治溫熱之要旨故先發之於此而後文乃詳言之唐氏於必上加一此字則驗舌之法似僅指此條而言者可見一言半語之間未可輕為增損也汪按此條辨析甚當心細如髮斯能膽大於身也若其邪始終在氣分流連者可冀其戰汗透邪法宜益胃令邪與汗並熱達腠開邪從汗出解後胃氣空虛當膚冷一晝夜待氣還自溫暖如常矣蓋戰汗而解邪退正虛陽從汗泄故漸膚冷未必即成脫證此時宜令病者唐本無此三字安舒靜臥以養陽氣來復旁人切勿驚惶頻頻呼喚擾其元神唐本作氣使其煩躁唐本無此句但診其脈若虛軟和緩雖倦臥不語汗出膚冷卻非脫證若脈急疾躁擾不臥膚冷汗出便為氣脫之證矣楊云辨證精悉更有邪盛正虛不能一戰而解停一二日再戰汗而愈者不可不知魏柳洲曰脈象忽然雙伏或單伏而四肢厥冷或爪甲青紫欲戰汗也宜熟記之邪在氣分可冀戰汗法宜益胃者以汗由胃中水穀之氣所化水穀氣旺與邪相併而化汗邪與汗俱出矣故仲景用桂枝湯治風傷衛服湯後令啜稀粥以助出汗若胃虛而發戰邪不能出反從內入也故要在辨邪之淺深若邪已入內而助胃是助邪反害矣故如風寒溫熱之邪初在表者可用助胃以托邪若暑疫等邪初受即在膜原而當胃口無助胃之法可施雖虛人亦必先用開達若誤補其害匪輕也戰解後膚冷復溫亦不可驟進補藥恐餘邪未淨復熾也至氣脫之證尤當細辨若脈急疾躁擾不臥而身熱無汗者此邪正相爭吉凶判在此際如其正能勝邪卻即汗出身涼脈靜安臥矣倘汗出膚冷而脈反急疾躁擾不安即為氣脫之候或汗已出而身仍熱其脈急疾而煩躁者此正不勝邪即內經所云陰陽交交者死也雄按上第二章以心肺同居膈上溫邪不從外解易於逆傳故首節言內陷之治次明救液之法末言不傳營者可以戰汗而解也第邪既始終流連氣分豈可但以初在表者為釋蓋章氏疑益胃為補益胃氣故未能盡合題旨夫溫熱之邪迥異風寒其感人也自口鼻入先犯於肺不從外解則里結而順傳於胃胃為陽土宜降宜通所謂腑以通為補也故下章即有分消走泄以開戰汗之門戶云云可見益胃者在疏瀹其樞機灌溉湯水俾邪氣松達與汗偕行則一戰可以成功也楊云此與章注均有至理不可偏廢學者兼觀並識而於臨證時擇宜而用之則善矣即暑疫之邪在膜原者治必使其邪熱潰散直待將戰之時始令多飲米湯或白湯以助其作汗之資審如章氏之言則疫證無戰汗之解矣且戰汗在六七朝或旬余者居多豈竟未之見耶若待補益而始戰解者間亦有之以其正氣素弱耳然亦必非初在表之候也再論氣病有不傳血分而邪留三焦亦如唐本作猶之傷寒中少陽病也彼則和解表裡之半此則分消上下之勢隨證變法如近時杏朴苓等類或如溫膽湯之走泄因其仍在氣分猶可望其唐本作猶有戰汗之門戶轉瘧之機括唐本有也字沈堯封曰邪氣中人所入之道不一風寒由皮毛而入故自外漸及於里溫熱由口鼻而入伏於脾胃之膜原與胃至近故邪氣向外則由太陽少陽轉出邪氣向里則徑入陽明經言三焦膀胱者腠理毫毛其應而皮毛為肺之合故肺經之邪不入營而傳心包即傳於三焦其與傷寒之由太陽傳陽明者不同傷寒傳陽明寒邪化熱即用白虎等法以陽明陽氣最盛故也凡表裡之氣莫不由三焦升降出入而水道由三焦而行故邪初入三焦或胸脅滿悶或小便不利此當展其氣機雖溫邪不可用寒涼遏之如杏朴溫膽之類辛平甘苦以利升降而轉氣機開戰汗之門戶為化瘧之丹頭此中妙理非先生不能道出以啓後學之性靈也不明此理一聞溫病之名即亂投寒涼反使表邪內閉其熱更甚於是愈治而病愈重至死而不悟其所以然良可慨也雄按章氏此釋於理頗通然於病情尚有未協也其所云分消上下之勢者以杏仁開上厚朴宣中茯苓導下似指濕溫或其人素有痰飲者而言故溫膽湯亦可用也楊云此釋精確勝章注遠甚試以指南溫濕各案參之自見若風溫流連氣分下文已云到氣才可清氣所謂清氣者但宜展氣化以輕清如梔芩蔞葦等味是也雖不可遽用寒滯之藥而厚朴茯苓亦為禁劑彼一聞溫病即亂投寒涼固屬可慨汪按今人畏涼藥並輕清涼解每多疑慮至溫補升燥則恣用無忌實此等醫人階之厲也而不辨其有無濕滯概用枳朴亦豈無遺憾乎至轉瘧之機括一言原指氣機通達病乃化瘧則為邪殺也從此迎而導之病自漸愈奈近日市醫既不知溫熱為何病柴葛羌防隨手浪用且告病家曰須服幾劑柴胡提而為瘧庶無變端病家聞之無不樂從雖至危殆猶曰提瘧不成病是犯真故病家死而無怨醫者誤而不悔彼此夢夢亦可慨也夫汪按此辨尤精當明析切中時弊又按五種傷寒惟感寒即病者為正傷寒乃寒邪由表而受治以溫散尤必佐以甘草薑棗之類俾助中氣以托邪外出亦杜外邪而不使內入倘邪在半表半裡之界者治宜和解可使轉而為瘧其所感之風寒較輕而入於少陽之經者不為傷寒則為正瘧脈象必弦皆以小柴胡湯為主方設冬傷於寒而不即病則為春溫夏熱之證其較輕者則為溫瘧疸瘧軒岐仲景皆有明訓何嘗概以小柴胡湯治之耶若感受風溫濕溫暑熱之邪者重則為時感輕則為時瘧而溫熱暑濕諸感證之邪氣流連者治之得法亦可使之轉瘧而出統而論之則傷寒有五瘧亦有五蓋有一氣之感證即有一氣之瘧疾不過重輕之別耳今世溫熱多而傷寒少故瘧亦時瘧多而正瘧少溫熱暑濕既不可以正傷寒法治之時瘧豈可以正瘧法治之哉其間二日而作者正瘧有之時瘧亦有之名曰三陰瘧以邪入三陰之經也不可誤解為必屬陰寒之病醫者不知五氣皆能為瘧顢頇施治罕切病情故世人患瘧多有變證或至纏綿歲月以致俗人有瘧無正治疑為鬼祟等説然以徐洄溪魏玉橫之學識尚不知此況其他乎惟葉氏精於溫熱暑濕諸感故其治瘧也一以貫之余師其意治瘧鮮難愈之證曩陳仰山封翁詢余曰君何治瘧之神哉殆別有祕授也余謂何祕之有第不惑於昔人之謬論而辨其為風溫為濕溫為暑熱為伏邪仍以時感法清其源耳近楊素園大令重刻余案評云案中所載多溫瘧暑瘧故治多涼解但溫瘧暑瘧雖宜涼解尤當辨其邪之在氣在營也繆仲諄善治暑瘧而用當歸牛膝鱉甲首烏等血分藥於陽明證中亦屬非法若濕溫為瘧與暑邪挾濕之瘧其濕邪尚未全從熱化者極要留意況時瘧之外更有瘀血頑痰陽維為病等證皆有寒熱如瘧之象最宜諦審案中諸治略備閲者還須於涼解諸法中縷析其同異焉大凡看法衛之後方言氣營之後方言血在衛汗之可也到氣才可唐本作宜清氣入營唐本作乍入營分猶可透熱轉氣唐本作仍轉氣分而解如犀角玄參羚羊角等物唐本有是也二字入血唐本作至入於血就唐本作則恐耗血動血直須涼血散血加生地丹皮阿膠赤芍等物唐本有是也二字否則唐本作若前後唐本無此二字不循緩急之法慮其動手便錯唐本有耳字反致慌張矣唐本無此句仲景辨六經證治於一經中皆有表裡淺深之分溫邪雖與傷寒不同其始皆由營衛故先生於營衛中又分氣血之淺深精細極矣凡溫病初感發熱而微惡寒者邪在衛分不惡寒而惡熱小便色黃已入氣分矣若脈數舌絳邪入營分若舌深絳煩擾不寐或夜有譫語已入血分矣邪在衛分汗之宜辛涼輕解雄按首章本文云初用辛涼輕劑華岫云注此條云辛涼開肺便是汗劑章氏注此云宜辛平表散不可用涼何謬妄乃爾今特正之清氣熱不可寒滯反使邪不外達而內閉則病重矣故雖入營猶可開達轉出氣分而解倘不如此細辨施治動手便錯矣故先生為傳仲景之道脈迥非諸家之立言所能及也雄按誠如君言何以屢屢擅改初用辛涼之文乎雄按外感溫病如此看法風寒諸感無不皆然此古人未達之旨近惟王清任知之若伏氣溫病自里出表乃先從血分而後達於氣分芷卿雲論伏氣之治精識直過前人然金針雖度其如粗工之聾瞶何故起病之初往往舌潤而無苔垢但察其脈軟而或弦或微數口未渴而心煩惡熱即宜投以清解營陰之藥逮邪從氣分而化苔始漸布然後再清其氣分可也伏邪重者初起即舌絳咽乾甚有肢冷脈伏之假象亟宜大清陰分伏邪繼必厚膩黃濁之苔漸生此伏邪與新邪先後不同處更有邪伏深沉不能一齊外出者雖治之得法而苔退舌淡之後逾一二日舌復干絳苔復黃燥正如抽蕉剝繭層出不窮不比外感溫邪由衛及氣自營而血也楊云閲歷有得之言故語語精實學者所當領悉也秋月伏暑證輕淺者邪伏膜原深沉者亦多如此苟閲歷不多未必知其曲折乃爾也附識以告留心醫學者余醫案中凡先治血分後治氣分者皆伏氣病也雖未點明讀者當自得之且吾吳濕邪害人最廣唐本作多如面色白者須要顧其陽氣濕勝則陽微也法應清涼唐本法上有如字然唐本作用到十分之六七即不可過於寒唐本無此二字涼恐成功反棄何以故耶唐本無此二句有蓋恐二字濕熱一去陽亦衰微也面色蒼者須要顧其津液清涼到十分之六七往往熱減身寒者不可就唐本作便云虛寒而投補劑恐爐煙雖熄灰中有火也須細察精詳方少少與之慎不可直率唐本作漫然而往唐本作進也又有酒客里濕素盛外邪入里里濕為合唐本作與之相搏在陽旺之軀胃濕恆多在陰盛之體脾濕亦不少然其化熱則一熱病救陰猶易通陽最難救陰不在唐本有補字血而在津與汗唐本作養津與測汗通陽不在溫而在利小便然唐本無此字較之雜證則唐本無此字有不同也六氣之邪有陰陽不同其傷人也又隨人身之陰陽強弱變化而為病面白陽虛之人其體豐者本多痰濕若受寒濕之邪非薑附參苓不能去若濕熱亦必黏滯難解須通陽氣以化濕若過涼則濕閉而陽更困矣面蒼陰虛之人其形瘦者內火易動濕從熱化反傷津液與陽虛治法正相反也胃濕脾濕雖化熱則一而治法有陰陽不同如仲景云身黃如橘子色而鮮明者此陽黃胃濕用茵陳蒿湯其云色如熏黃而沉晦者此陰黃脾濕用梔子柏皮湯或後世之二妙散亦可救陰在養津通陽在利小便發古未發之至理也測汗者測之以審津液之存亡氣機之通塞也雄按熱勝於濕則黃如橘子色而鮮明濕勝於熱則色沉晦而如熏黃皆屬陽證而非陰黃也雄按所謂六氣風寒暑濕燥火也分其陰陽則素問云寒暑六入暑統風火陽也寒統燥濕陰也言其變化則陽中惟風無定體有寒風有熱風陰中則燥濕二氣有寒有熱至暑乃天之熱氣流金爍石純陽無陰或云陽邪為熱陰邪為暑者甚屬不經經云熱氣大來火之勝也陽之動始於溫盛於暑蓋在天為熱在地為火其性為暑是暑即熱也並非二氣或云暑為兼濕者亦誤也暑與濕原是二氣雖易兼感實非暑中必定有濕也譬如暑與風亦多兼感豈可謂暑中必有風耶若謂熱與濕合始名為暑然則寒與風合又將何稱更有妄立陰暑陽暑之名者亦屬可笑如果暑必兼濕則不可冠以陽字若知暑為熱氣則不可冠以陰字其實彼所謂陰者即夏月之傷於寒濕者耳設云暑有陰陽則寒亦有陰陽矣不知寒者水之氣也熱者火之氣也水火定位寒熱有一定之陰陽寒邪傳變雖能化熱而感於人也從無陽寒之説人身雖有陰火而六氣中不聞有寒火之名暑字從日日為天上之火寒字從仌仌為地下之水暑邪易入心經寒邪先犯膀胱霄壤不同各從其類故寒暑二氣不比風燥濕有可陰可陽之不同也況夏秋酷熱始名為暑冬春之熱僅名為溫而風寒燥濕皆能化火今日六氣之邪有陰陽之不同又隨人身之陰陽變化毋乃太無分別乎至面白體豐之人既病濕熱應用清涼本文業已明言但病去六七不可過用寒涼耳非謂病未去之初不可用涼也今云與面蒼形瘦之人治法正相反則未去六七之前亦當如治寒濕之用薑附參術矣陽奉陰違殊乖詮釋之體若脾濕陰黃又豈梔柏湯苦寒純陰之藥可治哉本文云救陰不在血而在津與汗言救陰須用充液之藥以血非易生之物而汗需津液以化也唐本於血津上加補養字已屬蛇足於汗上加測字則更與救字不貫章氏仍之陋矣上第三章又按寒暑燥濕風乃五行之氣合於五臟者也惟暑獨盛於夏令火則四時皆有析而言之故曰六氣然三時之暖燠雖不可以暑稱之亦何莫非麗日之煦照乎須知暑即日之氣也日為衆陽之宗陽燧承之火立至焉以五行論言暑則火在其中矣非五氣外另有一氣也若風寒燥濕悉能化火此由郁遏使然又不可與天之五氣統同而論矣又按茅雨人云本文謂濕勝則陽微其實乃陽微故致濕勝也此辨極是學者宜知之再論三焦不得唐本無此字從外解必致成唐本無此字里結里結於何在陽明胃與腸也亦須用下法不可以氣血之分就唐本作謂其不可下也但唐本作惟傷寒邪熱在裡劫爍津液下之宜猛此多濕邪內搏下之宜輕傷寒大便溏為邪已盡不可再下濕溫病大便溏為邪未盡必大便硬慎唐本作乃為無濕始不可再攻也以糞燥為無濕矣唐本無此句胃為臟腑之海各臟腑之邪皆能歸胃況三焦包羅臟腑其邪之入胃尤易也傷寒化熱腸胃乾結故下宜峻猛濕熱凝滯大便本不幹結以陰邪瘀閉不通若用承氣猛下其行速而氣徒傷濕仍膠結不去故當輕法頻下如下文所云小陷胸瀉心等皆為輕下之法也雄按傷寒化熱固是陽邪濕熱凝滯者大便雖不幹結黑如膠漆者有之豈可目為陰邪謂之濁邪可也惟其誤為陰邪故復援溫脾湯下寒實之例而自詡下陽虛之濕熱為深得仲景心法真未經臨證之言也似是而非刪去不録再人之體脘在腹上其地位處於中唐本作其位居中按之痛或自痛或痞脹當用苦泄以其入腹近也必驗之於舌或黃或濁可與小陷胸湯或瀉心湯隨證治之或唐本作若白不燥或黃白相兼或灰白不渴慎不可亂投苦泄其中有外邪未解里先結者或邪郁未伸或素屬中冷者雖有脘中痞悶宜從開泄宣通氣滯以達歸於肺如近俗唐本作世之杏蔻橘桔等是輕苦微辛唐本無是字具流動之品可耳此言苔白為寒不燥則有痰濕其黃白相兼灰白而不渴者皆陽氣不化陰邪壅滯故不可亂投苦寒滑泄以傷陽也其外邪未解而里先結故苔黃白相兼而脘痞皆宜輕苦微辛以宣通其氣滯也雄按凡視溫證必察胸脘如拒按者必先開泄若苔白不渴多挾痰濕輕者橘蔻菖薤重者枳實連夏皆可用之雖舌絳神昏但胸下拒按即不可率投涼潤必參以辛開之品始有效也上第四章唐本並以第十一章連為一章今訂正之連上章皆申明邪在氣分之治法而分別營衛氣血之淺深身形肥瘦之陰陽苔色黃白之寒熱可謂既詳且盡矣而下又申言察苔以辨證真千古開群朦也再唐本無此字前云舌黃或渴唐本此下有當用陷胸瀉心六字須要有地之黃若光滑者乃無形濕熱中有虛象唐本作已有中虛之象大忌前法其臍以上為大腹或滿或脹或痛此必邪已入里矣唐本無矣字表證多無或十隻存一唐本作或存十之一二亦要唐本作須驗之於舌或黃甚或如沉香色或如灰黃色或老黃色或中有斷紋皆當下之如小承氣湯用檳榔青皮枳實元明粉生首烏等唐本此下有皆可二字若未見此等舌不宜用此等法唐本作藥恐其中有濕聚太陰為滿或寒濕錯雜為痛或氣壅為脹又當以別法治之唐本有矣字舌苔如地上初生之草必有根無根者為浮垢刮之即去乃無形濕熱而胃無結實之邪故云有中虛之象若妄用攻瀉傷內則表邪反陷為難治矣即使有此等舌苔亦不宜用攻瀉之藥又如濕為陰邪脾為濕土故脾陽虛則濕聚腹滿按之不堅雖見各色舌苔而必滑色黃為熱白為寒總當扶脾燥濕為主熱者佐涼藥寒者非大溫其濕不能去也若氣壅為脹皆有虛實寒熱之不同更當辨別以利氣和氣為主治也雄按上第五章唐本移作第六章今訂正之章氏所釋白為寒非大溫其濕不去是也然苔雖白而不燥還須問其口中和否如口中自覺黏膩則濕漸化熱僅可用厚朴檳榔等苦辛微溫之品口中苦渴者邪已化熱不但大溫不可用必改用淡滲苦降微涼之劑矣或渴喜熱飲者邪雖化熱而痰飲內盛也宜溫膽湯加黃連楊云原論已極鄭重周詳此更辨別疑似細極毫芒可見心粗膽大者必非真學問人也再黃苔不甚厚而滑者熱未傷津猶可清熱透表若雖薄而乾者邪雖去而津受傷也苦重之藥當禁宜甘寒輕劑可也唐本可也作養之熱初入營即舌絳苔黃其不甚厚者邪結未深故可清熱以辛開之藥從表透發舌滑而津未傷得以化汗而解若津傷舌乾雖苔薄邪輕亦必祕結難出故當先養其津津回舌潤再清餘邪也雄按上第六章唐本移作第七章今訂正之此二章論黃苔各證治法之不同再論其熱傳營舌色必絳絳深紅色也初傳絳色中兼黃白色此氣分之邪未盡也泄衛透營兩和可也純絳鮮色者包絡受病唐本作邪也宜犀角鮮生地連翹鬱金石菖蒲等唐本此下有清泄之三字延之數日或平素心虛有痰外熱一陷里絡就唐本作即閉非菖蒲鬱金等所能開須用牛黃丸至寶丹之類以開其閉恐其昏厥為痙也何報之曰溫熱病一發便壯熱煩渴舌正赤而有白苔者雖滑即當清裡切忌表藥絳者指舌本也黃白者指舌苔也舌本通心脾之氣血心主營營熱故舌絳也脾胃為中土邪入胃則生苔如地上生草也然無病之人常有微薄苔如草根者即胃中之生氣也楊云論舌苔之源甚佳若光滑如鏡則胃無生髮之氣如不毛之地其土枯矣胃有生氣而邪入之其苔即長厚如草根之得穢濁而長髮也故可以驗病之虛實寒熱邪之淺深輕重也脾胃統一身之陰陽營衛主一身之氣血故脾又為營之源胃又為衛之本也苔兼白白屬氣故其邪未離氣分可用泄衛透營仍從表解勿使入內也純絳鮮澤者言無苔色則胃無濁結而邪已離衛入營其熱在心包也若平素有痰必有舌苔雄按絳而澤者雖為營熱之徵實因有痰故不甚乾燥也間若胸悶者尤為痰據不必定有苔也菖蒲鬱金亦為此設若竟無痰必不甚澤其心虛血少者舌色多不鮮赤或淡晦無神邪陷多危而難治於此可卜吉凶也若邪火盛而色赤宜牛黃丸痰濕盛而有垢濁之苔者宜至寶丹略參拙意雄按上第七章唐本移為第八章今訂正之連下二章辨論種種舌絳證治是統風溫濕溫而言也再色絳而舌中心乾者乃心胃火燔劫爍津液即黃連石膏亦可加入若煩渴煩熱舌心干四邊色紅中心或黃或白者此非血分也乃上焦氣熱爍津急用涼膈散散其無形之熱再看其後轉變可也慎勿用血藥以滋膩難散至舌絳望之若干手捫之原有津液此津虧濕熱熏蒸將成濁痰蒙閉心包也熱已入營則舌色絳胃火爍液則舌心干加黃連石膏於犀角生地等藥中以清營熱而救胃津既白虎加生地之例也雄按此節章氏無注今補釋之其舌四邊紅而不絳中兼黃白而渴故知其熱不在血分而在上焦氣分當用涼膈散清之勿用血藥引入血分反難解散也蓋胃以通降為用若營熱蒸其胃中濁氣成痰不能下降反上熏而矇蔽心包望之若干捫之仍濕者是其先兆也雄按上第八章唐本與第九章顛倒竄亂今訂正之再有熱傳營血其人素有瘀傷宿血在胸膈中挾熱而搏唐本無此四字其舌色必紫而暗捫之濕當加入散血之品如琥珀丹參桃仁丹皮等不爾瘀血與熱為伍阻遏正氣遂變如狂發狂之證若紫而腫大者乃酒毒衝心若紫而干晦者腎肝色泛也難治何報之曰酒毒內蘊舌必深紫而赤或乾涸若淡紫而帶青滑則為寒證矣須辨舌紫而暗暗即晦也捫之潮濕不幹故為瘀血其晦而乾者精血已枯邪熱乘之故為難治腎色黑肝色青青黑相合而見於舌變化紫晦故曰腎肝色泛也雄按此舌雖無邪熱亦難治酒毒衝心急加黃連清之雄按此節唐本作第十章舌色絳而上有黏膩似苔非苔者中挾穢濁之氣急加芳香逐之舌絳欲伸出口而抵齒難驟伸者痰阻舌根有內風也舌絳而光亮胃陰亡也急用甘涼濡潤之品若舌絳而乾燥者火邪劫營涼血清火為要舌絳而有碎點白黃者當生疳也大紅點者熱毒乘心也用黃連金汁其有雖絳而不鮮乾枯而痿者腎陰涸也急以阿膠雞子黃地黃天冬等救之緩則恐涸極而無救也尤拙吾曰陽明津涸舌乾口燥者不足慮也若並亡其陽則殆矣少陰陽虛汗出而厥者不足慮也若並亡其陰則危矣是以陽明燥渴能飲冷者生不能飲者死少陰厥逆舌不幹者生乾者死挾穢者必加芳香以開降胃中濁氣而清營熱矣痰阻舌根由內風之逆則開降中又當加辛涼咸潤以息內風也脾腎之脈皆連舌本亦有脾腎氣敗而舌短不能伸者其形貌面色亦必枯瘁多為死證不獨風痰所阻之故也其舌不鮮乾枯而痿腎陰將涸亦為危證而黃連金汁並可治疳也雄按光絳而胃陰亡者炙甘草湯去薑桂加石斛以蔗漿易飴糖干絳而火邪劫營者晉三犀角地黃湯加玄參花粉紫草銀花丹參蓮子心竹葉之類若尤氏所云不能飲冷者乃胃中氣液兩亡宜復脈湯原方汪按以蔗漿易飴糖巧妙絶倫蓋溫證雖宜甘藥又不可滯中也其有舌獨中心絳乾者此胃熱心營受灼也當於清胃方中加入清心之品否則延及於尖為津干火盛也舌尖絳獨干此心火上炎用導赤散瀉其腑其干獨在舌心舌尖又有熱邪在心兼胃之別尖獨干是心熱其熱在氣分者必渴以氣熱劫津也熱在血分其津雖耗其氣不熱故口乾而不渴也多飲能消水者為渴不能多飲但欲略潤者為干又如血分無熱而口乾者是陽氣虛不能生化津液與此大不同也雄按上第九章唐氏竄入第八章今釐正之舌心是胃之分野舌尖乃心之外候心胃兩清即白虎加生地黃連犀角竹葉蓮子心也津干火盛者再加西洋參花粉梨汁蔗漿可耳心火上炎者導赤湯入童溲尤良再舌苔白厚而乾燥者此胃燥氣傷也滋潤藥中加甘草令甘守津還之意舌白而薄者外感風寒也當疏散之若白乾薄唐本作白薄而干者肺津傷也加麥冬花露蘆根汁等輕清之品為上者上之也若白苔絳底唐本作苔白而底絳者濕遏熱伏也當先泄濕透熱防其就唐本作即干也勿憂之唐本作此可勿憂再從里唐本下有而字透於外則變潤矣初病舌就唐本作即干神不昏者急加養正透邪之藥若神已昏此內匱矣唐本矣字在下句之末不可救藥苔白而厚本是濁邪乾燥傷津則濁結不能化故當先養津而後降濁也肺位至高肺津傷必用輕清之品方能達肺若氣味厚重而下走則反無涉矣故曰上者上之也雄按此釋甚明白何以第二章釋為因地制宜而譏他人效顰也濕遏熱伏必先用辛開苦降以泄其濕濕開熱透故防舌乾再用苦辛甘涼從里而透於外則胃氣化而津液輸布舌即變潤自能作汗而熱邪亦可隨汗而解若初病舌即干其津氣素竭也急當養正略佐透邪若神已昏則本元敗而正不勝邪不可救矣雄按有初起舌乾而脈滑脘悶者乃痰阻於中而液不上潮未可率投補益也又不拘何色舌上生芒刺者皆是上焦熱極也當用青布拭冷薄荷水揩之即去者輕旋即生者險矣生芒刺者苔必焦黃或黑無苔者舌必深絳其苔白或淡黃者胃無大熱必無芒刺或舌尖或兩邊有小赤瘰是營熱鬱結當開泄氣分以通營清熱也上焦熱極者宜涼膈散主之雄按秦皇士云凡渴不消水脈滑不數亦有舌苔生刺者多是表邪挾食用保和加竹瀝萊蔔汁或梔豉加枳實並效若以寒涼抑鬱則譫語發狂愈甚甚則口噤不語矣有斑疹內伏連用升提而不出用消導而斑出神清者若葷腥油膩與邪熱斑毒紐結不解唇舌焦裂口臭牙疳煩熱昏沉與以尋常消導病必不解徒用清裡其熱愈甚設用下奪其死更速惟用升麻葛根湯以宣發之重者非升麻清胃湯不能清理腸胃血分中之膏粱積熱或再加山楂檳榔多有生者愚謂病從口入感證夾食為患者不少秦氏著傷寒大白於六法外特補消導一門未為無見所用萊蔔汁不但能消痰食即燥火閉郁非此不清用得其當大可起死回生郭雲臺極言其功余每與海蛇同用其功益懋舌苔不燥自覺悶極者屬脾濕盛也或有傷痕血迹者必問曾經搔挖否不可以有血而便為枯證仍從濕治可也再有神情清爽舌脹大不能出口者此脾濕胃熱鬱極化風而毒延口也用大黃磨入當用劑內則舌脹自消矣何報之曰凡中宮有痰飲水血者舌多不燥不可誤認為寒也三焦升降之氣由脾鼓運中焦和則上下氣順脾氣弱則濕自內生濕盛而脾不健運濁壅不行自覺悶極雖有熱邪其內濕盛而舌苔不燥當先開泄其濕而後清熱不可投寒涼以閉其濕也神情清爽而舌脹大故知其邪在脾胃若神不清即屬心脾兩臟之病矣邪在脾胃者唇亦必腫也雄按上第十章唐氏析首節為第五章次節為第十二章末節為第十三章今並訂正再唐本作又有舌上白苔黏膩吐出濁厚涎沫口必甜味也唐本作其口必甜為脾疸病唐本作此為脾疸乃濕熱氣聚與穀氣相搏土有餘也盈滿則上泛當用省頭草唐本作佩蘭葉芳香辛散以逐之則退唐本無此二字若舌上苔如鹼者胃中宿滯挾濁穢鬱伏當急急開泄否則閉結中焦不能從膜原達出矣脾疸而濁泛口甜者更當視其舌本如紅赤者為熱當辛通苦降以泄濁如色淡不紅由脾虛不能攝涎而上泛當健脾以降濁也苔如鹼者濁結甚故當急急開泄恐內閉也雄按濁氣上泛者涎沫厚濁小溲黃赤脾虛不攝者涎沫稀黏小溲清白見證迥異虛證宜溫中以攝液如理中或四君加益智之類可也何亦以降濁為言乎疏矣上第十一章唐氏併入第四章今訂正之此二章辨別種種白苔證治之殊似兼疫證之舌苔而詳論之試繹之則白苔不必盡屬於寒也若唐本無此字舌無苔而有如煙煤隱隱者不渴肢寒知挾陰病唐本移二句在若潤者上如口渴煩熱唐本下有而燥者三字平時胃燥舌唐本無舌字也不可攻之若燥者唐本作宜甘寒益胃若唐本此下有不渴肢寒而五字潤者甘溫扶中此何唐本此下有以字故外露而里無也凡黑苔大有虛實寒熱之不同即黃白之苔因食酸味其色即黑尤當問之雄按此名染苔食橄欖能黑食枇杷白苔能黃之類皆不可不知也其潤而不燥或無苔如煙煤者正是腎水來乘心火其陽虛極矣若黑而燥裂者火極變水色如焚木成炭而黑也虛實不辨死生反掌耳雄按虛寒證雖見黑苔其舌色必潤而不紫赤識此最為祕訣雄按更有陰虛而黑者苔不甚燥口不甚渴其舌甚赤或舌心雖黑無甚苔垢舌本枯而不甚赤證雖煩渴便祕腹無滿痛神不甚昏俱宜壯水滋陰不可以為陽虛也若黑苔望之雖燥而生刺但渴不多飲或不渴其邊或有白苔其舌本淡而潤者亦屬假熱治宜溫補其舌心並無黑苔而舌根有黑苔而燥者宜下之乃熱在下焦也若舌本無苔惟尖黑燥為心火自焚不可救藥上第十二章唐本移為第十四章今訂正之若唐本無此字舌黑而滑者水來剋火為陰證當溫之若見短縮此腎氣竭也為難治欲救之唐本作惟加人參五味子勉希唐本作或救萬一舌黑而乾者津枯火熾急急瀉南補北若唐本此下有黑字燥而中心厚㾦唐本無此字者土燥水竭急以鹹苦下之何報之曰暑熱證夾血多有中心黑潤者勿誤作陰證治之黑苔而虛寒者非桂附不可治佐以調補氣血隨宜而施若黑燥無苔胃無濁邪雄按非無苔也但不厚耳故當瀉南方之火補北方之水仲景黃連阿膠湯主之黑燥而中心厚者胃濁邪熱乾結也宜用硝黃鹹苦下之矣雄按上第十三章唐本移為第十五章今訂正之此二章言黑苔證治之有區別也又按茅雨人云凡起病發熱胸悶遍舌黑色而潤外無險惡情狀此胸膈素有伏痰也不必張皇止用薤白栝蔞桂枝半夏一劑黑苔即退或不用桂枝即枳殼桔梗亦效舌淡紅無色者或干而色不榮者當是胃津傷而氣無化液也當用炙甘草湯不可用寒涼藥何報之曰紅嫩如新生望之似潤而燥渴殆甚者為妄行汗下以致津液竭也淡紅無色心脾氣血素虛也更加干而色不榮胃中津氣亦亡也故不可用苦寒藥炙甘草湯養氣血以通經脈其邪自可漸去矣雄按上第十四章唐氏移為第十一章今訂正之此章言虛多邪少之人舌色如是當培氣液為先也若舌白如粉而滑四邊色紫絳者溫疫病初入膜原未歸胃腑急急透解莫待傳陷而入為險惡之病且見此舌者病必見凶須要小心凡斑疹初見須用紙捻照見胸背兩脅點大而在皮膚之上者為斑或云頭隱隱或瑣碎小粒者為疹又宜見而不宜見多按方書謂斑色紅者屬胃熱紫者熱極黑者胃爛然亦必看外證所合方可斷之溫疫白苔如積粉之厚其穢濁重也舌本紫絳則邪熱為濁所閉故當急急透解此五疫中之濕疫又可主以達原飲亦須隨證加減不可執也舌本紫絳熱閉營中故多成斑疹斑從肌肉而出屬胃疹從血絡而出屬經其或斑疹齊見經胃皆熱然邪由膜原入胃者多或兼風熱之入於經絡則有疹矣不見則邪閉故宜見多見則邪重故不宜多但斑疹亦有虛實虛實不明舉手殺人故先生辨之如後雄按溫熱病舌絳而白苔滿布者宜清肅肺胃更有伏痰內盛神氣昏瞀者宜開痰為治黑斑藍斑亦有可治者余治胡季權姚祿皆二案載續編徐月岩室案附曾大父隨筆中然而春夏之間濕病俱發疹為甚且其色要辨唐本無此句如淡紅色四肢清口不甚渴脈不洪數非虛斑即陰斑或胸微見數點面赤足冷或下利清穀此陰盛格陽於上而見當溫之此專論斑疹不獨溫疫所有且有虛實之迥別也然火不郁不成斑疹若虛火力弱而色淡四肢清者微冷也口不甚渴脈不洪數其非實火可徵矣故曰虛斑若面赤足冷下利清穀此陰寒盛格拒其陽於外內真寒外假熱鬱而成斑故直名為陰斑也須附桂引火歸元誤投涼藥即死實火誤補亦死最當詳辨也若斑色紫唐本下有而字小點者心包熱也點大而紫胃中熱也黑斑而光亮者熱勝毒盛唐本作熱極毒熾雖屬不治若其人氣血充者或依法治之尚可救若黑而晦者必死若黑而隱隱四旁赤色火鬱內伏大用清涼透發間有轉紅成可救者若夾斑帶疹皆是邪之不一各隨其部而泄然斑屬血者恆多疹屬氣者不少斑疹皆是邪氣外露之象發出唐本下有之時二字宜神情清爽為外解里和之意如斑疹出而昏者正不勝邪內陷為患或胃津內涸之故此論實火之斑疹也點小即是從血絡而出之疹故熱在心包點大從肌肉而出為斑故熱在胃黑而光亮者元氣猶充故或可救黑暗則元氣敗必死矣四旁赤色其氣血尚活故可透發也斑疹夾雜經胃之熱各隨其部而外泄熱邪入胃本屬氣分見斑則邪屬於血者多矣疹從血絡而出本屬血分然邪由氣而閉其血方成疹也必當兩清氣血以為治也既出而反神昏則正不勝邪而死矣雄按上第十五章詳論溫疫中斑疹證治之不同唐氏移為第十六章今訂正之再有一種白㾦小粒如水晶色者楊云平人夏月亦間有之此濕熱傷肺邪雖出而氣液枯也必得甘藥補之或未至久延傷及氣液乃濕鬱衛分汗出不徹之故當理氣分之邪或白如枯骨者多凶為氣液竭也雄按濕熱之邪鬱於氣分失於輕清開泄幸不傳及他經而從衛分發白㾦者治當清其氣分之餘邪邪若久郁雖化白㾦而氣液隨之以泄故宜甘濡以補之苟色白如枯骨者雖補以甘藥亦恐不及也上第十六章唐氏移為第十七章今訂正之楊按濕熱素盛者多見此證然在溫病中為輕證不見有他患其白如枯骨者未經閲歷不敢臆斷汪按白㾦前人未嘗細論此條之功不小白如枯骨者余曾見之非惟不能救並不及救故俗醫一見白㾦輒以危言恐嚇病家其實白如水晶色者絶無緊要吾見甚多然不知甘濡之法反投苦燥升提則不枯者亦枯矣再溫熱之病看舌之後亦須驗齒齒為腎之餘齦為胃之絡熱邪不燥胃津必耗腎液且二經之血皆走其地病深動血結瓣於上陽血者色必紫紫如干漆陰血者色必黃黃如醬瓣陽血若見安胃為主陰血若見救腎為要然豆瓣色者多險若證還不逆者尚可治否則難治矣何以故耶蓋陰下竭陽上厥也腎主骨齒為骨之餘故齒浮齦不腫者為腎火水虧也胃脈絡於上齦大腸脈絡於下齦皆屬陽明故牙齦腫痛為陽明之火若濕入胃則必連及大腸血循經絡而行邪熱動血而上結於齦紫者為陽明之血可清可瀉黃者為少陰之血少陰血傷為下竭其陽邪上亢而氣厥逆故為難治也雄按上第十七章唐氏移作第十八章今訂正之齒若光燥如石者胃熱甚也若無汗惡寒衛偏勝也辛涼泄衛透汗為要若如枯骨色者腎液枯也為難治若上半截潤水不上承心火上炎也急急清心救水俟枯處轉潤為妥胃熱甚而反惡寒者陽內鬱而表氣不通故無汗而為衛氣偏勝當泄衛以透發其汗則內熱即從表散矣凡惡寒而汗出者為表陽虛腠理不固雖有內熱亦非實火矣齒燥有光者胃津雖干腎氣未竭也如枯骨者腎亦敗矣故難治也上半截潤胃津養之下半截燥由腎水不能上滋其根而心火燔灼故急當清心救水仲景黃連阿膠湯主之若咬牙齧齒者濕熱化風痙病但咬牙者胃熱氣走其絡也若咬牙而脈證皆衰者胃虛無谷以內榮亦咬牙也何以故耶虛則喜實也舌本不縮而硬而牙關咬定難開者此非風痰阻絡即欲作痙證用酸物擦之即開木來泄土故也牙齒相齧者以內風鼓動也但咬不齧者熱氣盛而絡滿牙關緊急也若脈證皆虛胃無谷養內風乘虛襲之入絡而亦咬牙虛而反見實象是謂虛則喜實當詳辨也又如風痰阻絡為邪實其熱盛化風欲作痙者或由傷陰而挾虛者皆當辨也雄按上第十八章唐氏移作第十九章今訂正之若齒垢如灰糕樣者胃氣無權津亡濕濁用事多死而初病齒縫流清血痛者胃火沖激也不痛者龍火內燔也齒焦無垢者死齒焦有垢者腎熱胃劫也當微下之或玉女煎清胃救腎可也齒垢由腎熱蒸胃中濁氣所結其色如灰糕則枯敗而津氣俱亡腎胃兩竭惟有濕濁用事故死也齒縫流清血因胃火者出於齦胃火沖激故痛不痛者出於牙根腎火上炎故也齒焦者腎水枯無垢則胃液竭故死有垢者火盛而氣液未竭故審其邪熱甚者以調胃承氣微下其胃熱腎水虧者玉女煎清胃滋腎可也雄按上第十九章唐氏移作第二十章今訂正之以上三章言溫熱諸證可驗齒面辨其治也真發從來所未發是於舌苔之外更添一祕訣並可垂為後世法讀者苟能隅反則豈僅能辨識溫病而已哉再婦人病溫與男子同但多胎前産後以及經水適來適斷大凡胎前病古人皆以四物加減用之謂護胎為要恐來害妊如熱極用井底泥藍布浸冷覆蓋腹上等皆是保護之意但亦要看其邪之可解處用血膩之藥不靈又當省察不可認板法然須步步保護胎元恐損正邪陷也保護胎元者勿使邪熱入內傷胎也如邪猶在表分當從開達外解倘執用四物之説則反引邪入內輕病變重矣楊云此釋極為明通故必審其邪之淺深而治為至要也若邪熱逼胎急清內熱為主如外用泥布等蓋覆恐攻熱內走反與胎礙更當詳審勿輕用也總之清熱解邪勿使傷動其胎即為保護若助氣和氣以達邪猶可酌用其補血膩藥恐反遏其邪也雄按此説固是然究是議藥不議病矣如溫熱已爍營陰則地黃未嘗不可用且內經曰婦人重身毒之何如岐伯曰有故有殞亦無殞也大積大聚其可犯也衰其大半而止不可過也故如傷寒陽明實熱證亦當用承氣下之邪去則胎安也蓋病邪淺則在經深則在腑而胎繫於臟攻其經腑則邪當其藥與臟無礙雄按此釋極通而竟忘卻溫熱傳營入血之證本文但云不可認板法非謂血藥無可用之證也若妄用補法以閉邪則反害其胎矣倘邪已入臟雖不用藥其胎必殞而命難保雄按亦須論其邪入何臟所以經言有故無殞者謂其邪未入臟攻其邪亦無殞胎之害也楊云有故無殞者有病則病當之也不必增入邪未入臟之説以滋熒惑故要在辨證明析用法得當非區區四物所能保胎者也故先生曰須看其邪之可解處不可認板法至哉言乎至於産後之法按方書謂慎用苦寒恐傷其已亡之陰也然亦要辨其邪能從上中解者稍從證用之亦無妨也不過勿犯下焦且屬虛體當如虛怯人病邪而治總之無犯實實虛虛之禁況産後當氣血沸騰之候最多空竇邪勢必乘虛內陷虛處受邪為難治也雄按余醫案中所載産後溫熱諸證治皆宜參閲茲不贅徐洄溪曰産後血脫孤陽獨旺雖石膏犀角對證亦不禁用而世之庸醫誤信産後宜溫之説不論病證皆以辛熱之藥戕其陰而益其火無不立斃我見甚多惟葉案中絶無此弊足徵學有淵源魏柳洲曰近時專科及庸手遇産後一以燥熱溫補為事殺人如麻雄按不挾溫熱之邪者且然況兼溫熱者乎吳鞠通曰産後溫證固云治上不犯中然藥反不可過輕須用多備少服法中病即已所謂無糧之師利於速戰若畏産後虛怯用藥過輕延至三四日後反不能勝藥矣如經水適來適斷邪將陷唐本下有於字血室少陽傷寒言之詳悉不必多贅但數動與正傷寒不同仲景立小柴胡湯提出所陷熱邪參棗唐本下有以字扶胃氣以衝脈隸屬陽明也此與唐本作惟虛者為合治若熱邪陷入與血相結者當從陶氏小柴胡湯去參棗加生地桃仁楂肉丹皮或犀角等若本經血結自甚必少腹滿痛輕者刺期門重者小柴胡湯去甘藥加延胡歸尾桃仁挾寒加肉桂心氣滯者加香附陳皮枳殼等沈月光用柴胡秦艽荊芥香附蘇梗厚朴枳殼當歸芎藭益母草木通黃芩名和血逐邪湯薑衣少許為引治傷寒熱入血室氣滯血瘀而胸滿腹脹痛甚者甚效然熱陷血室之證多有譫語如狂之象防是陽明胃實唐本作與陽明胃實相似下有此種病機四字當辨之唐本作最須辨別血結者身體必重非若陽明之輕旋便捷者唐本無旋捷二字何以故耶陰主重濁絡脈被阻唐本下有身之二字側旁氣痹連唐本下有及字胸背皆拘束不遂唐本作皆為阻窒故祛邪通絡正合其病往往延久上逆心包胸中唐本下有痹字痛即陶氏所謂血結胸也王海藏出一桂枝紅花湯加海蛤桃仁原是表裡上下一齊盡解之理看唐本無此字此方大有巧手唐本作妙焉故録出以備學者之用唐本無此句數動未詳或數字是變字之誤更俟明者正之衝脈為血室肝所主其脈起於氣街氣街陽明胃經之穴故又隸屬陽明也邪入血室仲景分淺深而立兩法其邪深者云如結胸狀譫語者刺期門隨其實而瀉之是從肝而泄其邪亦即陶氏之所謂血結胸也其邪淺者云往來寒熱如瘧狀而無譫語用小柴胡湯是從膽治也蓋往來寒熱是少陽之證故以小柴胡湯提少陽之邪則血室之熱亦可隨之而外出以肝膽為表裡故深則從肝淺則從膽以導泄血室之邪也今先生更詳證狀並採陶氏王氏之方法與仲景各條合觀誠為精細周至矣其言小柴胡湯惟虛者為合法何也蓋傷寒之邪由經而入血室其胃無邪故可用參棗若溫熱之邪先已犯胃後入血室故當去參棗惟胃無邪及中虛之人方可用之耳雄按世人治瘧不論其是否為溫熱所化而一概執用小柴胡湯以實其胃遂致危殆者最多須知傷寒之用小柴胡湯者止防少陽經邪乘虛入胃故用參棗先助胃之御之其與溫熱之邪來路不同故治法有異也汪按此謂溫熱之邪與傷寒來路不同故治法有異是也至云傷寒胃中無邪又云防少陽之邪乘虛入胃則似未安夫傷寒傳經由太陽而陽明而少陽故有太陽陽明有正陽陽明有少陽陽明豈有少陽受邪而陽明不受邪者亦豈有防少陽之邪倒傳陽明之理乎雄按溫邪熱入血室有三證如經水適來因熱邪陷入而搏結不行者此宜破其血結若經水適斷而邪乃乘血舍之空虛以襲之者宜養營以清熱其邪熱傳營逼血妄行致經未當期而至者宜清熱以安營上第二十章唐氏作第二十一章其小引云溫證論治二十則乃先生遊於洞庭山門人顧景文隨之舟中以當時所語信筆録記一時未加修飾是以詞多詰屈語亦稍亂讀者不免晦口大烈不揣冒昧竊以語句少為條達前後少為移掇惟使晦者明之至先生立論之要旨未敢稍更一字也章氏詮釋亦從唐本雄謂原論次序亦既井井有條而語句之間並不難讀何必移前掇後紊其章法而第三章如玉女煎去其如字之類殊失廬山真面目矣茲悉依華本訂正之葉香岩三時伏氣外感篇春溫一證由冬令收藏未固昔人以冬寒內伏藏於少陰入春發於少陽以春木內應肝膽也寒邪深伏已經化熱昔賢以黃芩湯為主方苦寒直清裡熱熱伏於陰苦味堅陰乃正治也知溫邪忌散不與暴感門同法若因外邪先受引動在裡伏熱必先辛涼以解新邪自注蔥豉湯繼進苦寒以清裡熱況熱乃無形之氣時醫多用消滯攻治有形胃汁先涸陰液劫盡者多矣雄按新邪引動伏邪者初起微有惡寒之表證徐洄溪曰皆正論也章虛谷曰或云人身受邪無不即病未有久伏過時而發者其説甚似有理淺陋者莫不遵信為然不知其悖經義又從而和之夫人身內臟腑外營衛於中十二經十五絡三百六十五孫絡六百五十七穴細微幽奧曲折難明今以一郡一邑之地匪類伏匿猶且不能覺察況人身經穴之淵邃隱微而邪氣如煙之漸熏水之漸積故如內經論諸痛諸積皆由初感外邪伏而不覺以致漸侵入內所成者也安可必謂其隨感即病而無伏邪者乎又如人之痘毒其未發時全然不覺何以又能伏耶由是言之則素問所言冬傷寒春病溫非讕語矣雄按藏於精者春不病溫小兒之多溫病何耶良以冬暖而失閉藏耳夫冬豈年年皆暖歟因父母以姑息為心惟恐其凍往往衣被過厚甚則戕之以裘帛富家兒多夭者半由此也雖天令潛藏而真氣已暗為發泄矣溫病之多不亦宜乎此理不但幼科不知即先賢亦從未道及也汪按惟洄溪嘗略論及之耳風溫者春月受風其氣已溫雄按此言其常也冬月天暖所感亦是風溫春月過冷亦有風寒也經謂春病在頭治在上焦肺位最高邪必先傷此手太陰氣分先病失治則入手厥陰心包絡血分亦傷蓋足經順傳如太陽傳陽明人皆知之肺病失治逆傳心包絡人多不知者俗醫見身熱咳喘不知肺病在上之旨妄投荊防柴葛加入枳朴杏蘇蔔子楂麥橘皮之屬輒云解肌消食有見痰喘便用大黃礞石滾痰丸大便數行上熱愈結幼稚谷少胃薄表裡苦辛化燥胃汁已傷復用大黃大苦沉降丸藥致脾胃陽和傷極陡變驚癇莫救者多矣自注風溫肺病治在上焦夫春溫忌汗初病投劑宜用辛涼若雜入消導發散徐云須對證亦可用不但與肺病無涉劫盡胃汁肺乏津液上供頭目清竅徒為熱氣熏蒸鼻乾如煤目瞑或上竄無淚或熱深肢厥狂躁溺澀胸高氣促皆是肺氣不宣化之徵斯時若以肺藥少加一味清降使藥力不致直趨腸中雄按所謂非輕不舉也重藥則直過病所矣而上痹可開諸竅自爽無如市醫僉云結胸皆用連蔞柴枳苦寒直降致閉塞愈甚告斃者多又此證初因發熱喘嗽首用辛涼清肅上焦徐云正論如薄荷連翹牛蒡象貝桑葉沙參梔皮薑皮花粉若色蒼熱勝煩渴用石膏竹葉辛寒清散痧疹亦當宗此若日數漸多邪不得解芩連涼膈亦可用至熱邪逆傳膻中神昏目瞑鼻竅無涕洟諸竅欲閉其勢危急必用至寶丹或牛黃清心丸徐云急救非此不可病減後餘熱只甘寒清養胃陰足矣春月暴暖忽冷先受溫邪繼為冷束咳嗽痰喘最多辛解涼溫只用一劑大忌絶谷若甚者宜晝夜豎抱勿倒三四日徐云祕訣夫輕為咳重為喘喘急則鼻掀胸挺自注春溫皆冬季伏邪詳於大方諸書幼科亦有伏邪雄按人有大小感受則一也治從大方雄按感受既一治法亦無殊奈大方明於治溫者罕矣況幼科乎然暴感為多如頭痛惡寒發熱喘促鼻塞聲重脈浮無汗原可表散春令溫舒辛溫宜少用陽經表藥最忌混亂至若身熱咳喘有痰之證只宜肺藥清解瀉白散加前胡牛蒡薄荷之屬消食藥只宜一二味雄按此為有食者言也若二便俱通者消食少用須辨表里上中下何者為急施治又春季溫暖風溫極多溫變熱最速若發散風寒消食劫傷津液變證尤速雄按沈堯封云溫亦火之氣也蓋火之微者曰溫火之甚者曰熱三時皆有惟暑為天上之火獨盛於夏令耳初起咳嗽喘促通行用薄荷汗多不用連翹象貝牛蒡花粉桔梗沙參木通枳殼橘紅表解熱不清用黃芩連翹桑皮花粉地骨皮川貝知母山梔備用方黃芩湯蔥豉湯涼膈散清心涼膈散葦莖湯瀉白散葶藶大棗湯白虎湯至寶丹牛黃清心丸竹葉石膏湯喻氏清燥救肺湯裡熱不清朝上涼晚暮熱即當清解血分久則滋清養陰若熱陷神昏痰升喘促急用牛黃丸至寶丹之屬風溫乃肺先受邪遂逆傳心包治在上焦不與清胃攻下同法幼科不知初投發散消食不應改用柴芩栝蔞枳實黃連再下奪不應多致危殆皆因不明手經之病耳雄按婆心苦口再四丁寧舌敝耳聾可為太息若寒痰阻閉亦有喘急胸高不可與前法用三白吐之或妙香丸夏為熱病然夏至以前時令未為大熱經以先夏至病溫後夏至病暑溫邪前已申明暑熱一證雄按陰陽大論云春氣溫和夏氣暑熱是暑即熱也原為一證故夏月中暑仲景標曰中熱也昔人以動靜分為暑熱二證蓋未知暑為何氣耳醫者易眩夏暑發自陽明古人以白虎湯為主方後賢劉河間創議迥出諸家謂溫熱時邪當分三焦投藥以苦辛寒為主若拘六經分證仍是傷寒治法致誤多矣徐云能分六經者亦鮮矣蓋傷寒外受之寒必先從汗解辛溫散邪是已口鼻吸入之寒即為中寒陰病徐云亦不盡然治當溫里分三陰見證施治若夫暑病專方甚少皆因前人略於暑詳於寒耳考古如金匱暑暍痙之因而潔古以動靜分中暑中熱各具至理雄按雖有至理而強分暑熱名已不正矣茲不概述論幼科病暑熱夾雜別病有諸而時下不外發散消導加入香薷一味或六一散一服考本草香薷辛溫發汗能泄宿水夏熱氣閉無汗渴飲停水香薷必佐杏仁以杏仁苦降泄氣大順散取義若此徐云大順散非治暑之方乃治暑月傷冷之方也何得連類及之夾雜矣雄按上言香薷治渴飲停水佐杏仁以降泄故曰大順散之義亦若此也長夏濕令暑必兼濕雄按此言長夏濕旺之令暑以蒸之所謂土潤溽暑故暑濕易於兼病猶之冬月風寒每相兼感暑傷氣分濕亦傷氣汗則耗氣傷陽胃汁大受劫爍變病由此甚多發泄司令里真自虛張鳳逵云暑病首用辛涼繼用甘寒再用酸泄酸斂不必用下可稱要言不煩矣然幼科因暑熱蔓延變生他病雄按大方何獨不然學者宜知隅反茲摘其概暑邪必挾濕雄按暑令濕盛必多兼感故曰挾猶之寒邪挾食濕證兼風俱是二病相兼非謂暑中必有濕也故論暑者須知為天上烈日之炎威不可誤以濕熱二氣並作一氣始為暑也而治暑者須知其挾濕為多焉狀如外感風寒忌用柴葛羌防如肌表熱無汗辛涼輕劑無誤香薷辛溫氣升熱服易吐佐苦降如杏仁黃連黃芩則不吐宣通上焦如杏仁連翹薄荷竹葉暑熱深入伏熱煩渴白虎湯六一散雄按無濕者白虎湯挾濕者六一散須別暑病頭脹如蒙皆熱盛上熾白虎竹葉酒濕食滯者加辛溫通里夏令受熱昏迷若驚此為暑厥雄按受熱而迷名曰暑厥譬如受冷而僕名寒厥也人皆知寒之即為冷矣何以不知暑之為熱乎即熱氣閉塞孔竅所致其邪入絡與中絡同法牛黃丸至寶丹芳香利竅可效徐云妙法雄按紫雪亦可酌用神蘇以後用清涼血分如連翹心竹葉心玄參細生地鮮生地二冬之屬雄按暑是火邪心為火臟邪易入之故治中暑者必以清心之藥為君此證初起大忌風藥雄按火邪得風藥而更熾矣初病暑熱傷氣雄按所謂壯火食氣也竹葉石膏湯或清肺輕劑雄按火邪剋金必先侵肺矣大凡熱深厥深四肢逆冷魏柳洲曰火極似水乃物極必反之候凡患此為燥熱溫補所殺者多矣哀哉蓋內真寒而外假熱諸家嘗論之矣內真熱而外假寒論及者罕也雄按道光甲辰六月初一日至初四日連日酷熱異常如此死者道路相接余以神犀丹紫雪二方救之極效但看面垢齒燥二便不通或瀉不爽為是大忌誤認傷寒也雄按尤忌誤以暑為陰邪或指暑中有濕而妄投溫燥滲利之藥也上暑厥雄按王節齋云夏至後病為暑相火令行感之自口齒入傷心包絡經甚則火熱制金不能平木而為暑風張兼善云清邪中上濁邪中下其風寒濕皆地之氣所以俱中足經惟暑乃天之氣系清邪所以中手少陰心經幼兒斷乳納食值夏月脾胃主氣易於肚膨泄瀉足心熱形體日瘦或煩渴喜食漸成五疳積聚當審體之強弱病之新久有餘者疏胃清熱食入糞色白或不化健脾佐消導清熱若濕熱內郁蟲積腹痛徐云此證最多導滯驅蟲微下之緩調用肥兒丸之屬上熱疳夏季秋熱小兒泄瀉或初愈未愈滿口皆生疳蝕嘗有阻塞咽喉致危者此皆在裡濕盛生熱熱氣蒸灼津液不生濕熱偏傷氣分治在上焦或佐淡滲徐云須用外治世俗常刮西瓜翠衣治疳徐云合度取其輕揚滲利也上口疳夏季濕熱鬱蒸脾胃氣弱水穀之氣不運濕著內蘊為熱漸至浮腫腹脹小水不利治之非法水濕久漬逆行犯肺必生咳嗽喘促甚則坐不得臥俯不得仰危期速矣大凡喘必生脹脹必生喘方書以先喘後脹治在肺先脹後喘治在脾亦定論也金匱有風水皮水石水正水黃汗以分表裡之治河間有三焦分消子和有磨積逐水皆有奧義學者不可不潛心體認難以概述閲近代世俗論水濕喘脹之證以內經開鬼門取汗為表治分利小便潔淨府為里治經旨病能篇謂諸濕腫滿皆屬於脾以健脾燥濕為穩治治之不效技窮束手矣不知凡病皆本乎陰陽通表利小便乃宣經氣利腑氣是陽病治法暖水臟溫脾胃補土以驅水是陰病治法治肺痹以輕開上治脾必佐溫通若陰陽表裡乖違臟真日漓陰陽不運亦必作脹治以通陽乃可奏績如局方禹餘糧丸甚至三焦交阻必用分消腸胃窒塞必用下奪然不得與傷寒實熱同例擅投硝黃枳朴擾動陰血若太陰脾臟飲濕阻氣溫之補之不應欲用下法少少甘遂為丸可也徐云亦太峻其治實證選用方法備採雄按葉氏景嶽發揮有因喘而腫當以清肺為要之論宜參若水濕侵脾發腫致喘治當補土驅水設水氣上凌心包變厄更危陳遠公云用苡仁茯神各一兩白朮蒼朮各三錢半夏陳皮各一錢丁香五分吳萸三分名止厄湯二劑可安喘脹備用方徐云太猛厲者不可輕用葶藶大棗湯瀉白散大順散牡蠣澤瀉散五苓散越脾湯甘遂半夏湯控涎丹五子五皮湯子和桂苓湯禹功丸茯苓防己湯中滿分消湯小青龍湯木防己湯吐瀉一證幼兒脾胃受傷陡變驚搐最多徐云此證多是痰濕若是不正穢氣觸入或口食生冷套用正氣散六和湯五積散之類正氣受傷肢冷厄忒嘔吐自利即用錢氏益黃散有痰用星附六君子湯理中湯等倘熱氣深伏煩渴引飲嘔逆者連香飲黃連竹茹橘皮半夏湯熱閉神昏用至寶丹寒閉用來復丹稚年夏月食瓜果水寒之濕著於脾胃令人泄瀉其寒濕積聚未能遽化熱氣必用辛溫香竄之氣古方中消瓜果之積以丁香肉桂或用麝香今七香餅治瀉亦祖此意其平胃散胃苓湯亦可用雄按此非溫熱為病何必採入緣夏月此等證候甚多因畏熱貪涼而反生寒濕之病乃夏月之傷寒也雖在暑令實非暑證昔人以陰暑名之謬矣譬如避火而溺於水拯者但可云出之於水不可云出之於陰火也瘧之為病因暑而發者居多雄按可謂一言扼要奈世俗惟知小柴胡湯為治誤人多矣方書雖有痰食寒熱瘴癘之互異幼稚之瘧多因脾胃受病雄按因暑而發者雖大人之瘧無不病於脾胃以暑多兼濕脾為土臟而胃者以容納為用暑邪吸入必伏於此也然氣怯神昏初病驚癇厥逆為多在夏秋之時斷不可認為驚癇大方瘧證須分十二經與咳證相等若幼科庸俗但以小柴胡去參或香薷葛根之屬雄按舉世無不爾於幼科乎何尤不知柴胡劫肝陰葛根竭胃汁致變屢矣雄按柴葛之弊二語見林北海重刊張司農治暑全書葉氏引用原非杜撰洄溪妄評殊欠考也幼稚純陽暑為熱氣雄按在天為暑在地為熱故暑即熱之氣也昔人謂有陰暑者已極可笑其分中熱中暑為二病者是析一氣而兩也又謂暑合濕熱而成者是並二氣而一也奚可哉證必熱多煩渴邪自肺受者桂枝白虎湯二進必愈其冷食不運有足太陰脾病見證初用正氣或用辛溫如草果生薑半夏之屬雄按切記此是治暑月因寒濕而病之法方書謂草果治太陰獨勝之寒知母治陽明獨勝之熱瘧久色奪唇白汗多餒弱必用四獸飲雄按邪去而正衰故可用此藥陰虛內熱必用鱉甲首烏知母便漸溏者忌用久瘧營傷寒勝加桂薑擬初中末瘧門用藥於下雄按葉氏景嶽發揮內所論瘧痢諸候宜參初病暑風濕熱瘧藥脘痞悶枳殼桔梗杏仁厚朴二味喘最宜栝蔞皮山梔香豉頭痛宜辛涼輕劑連翹薄荷赤芍羚羊角蔓荊子滑石淡滲清上重則用石膏口渴用花粉煩渴用竹葉石膏湯熱甚則用黃芩黃連山梔夏季身痛屬濕羌防辛溫宜忌宜用木防己蠶砂雄按豆卷可用暑熱邪傷初在氣分日多不解漸入血分反渴不多飲唇舌絳赤芩連膏知不應必用血藥量佐清氣熱一味足矣輕則用青蒿丹皮汗多忌犀角竹葉心玄參鮮生地細生地木通亦能發汗淡竹葉汪按此乃淡竹葉草故與竹葉心別若熱久痞結瀉心湯選用夏月熱久入血最多蓄血一證徐云歷練之言譫語昏狂看法以小便清長大便必黑為是桃核承氣湯為要藥瘧多用烏梅以酸泄木安土之意雄按邪未衰者忌之用常山草果乃劫其太陰之寒以常山極走使二邪不相併之謂徐云兼治痰雄按內無寒痰者不可浪用用人參生薑曰露薑飲一以固元一以散邪取通神明去穢惡之義雄按必邪衰而正氣已虛者可用此總之久瘧氣餒凡壯膽氣皆可止瘧未必真有瘧鬼雄按有物憑之者間或有之不必凡患瘧疾皆有祟也又瘧疾既久深入血分或結瘧母鱉甲煎丸設用煎方活血通絡可矣徐忠可云幼兒未進穀食者患瘧久不止用冰糖濃湯余試果驗徐云亦一單方汪按冰糖用秋露水煎尤良雄按食谷者瘧久不止須究其所以不止而治之痢疾一證古稱滯下蓋里有滯濁而後下也但滯在氣滯在血冷傷熱傷而滯非一今人以滯為食但以消食並令禁忌飲食而已雄按更有拘泥吃不死之痢疾一言不論痢屬何邪邪之輕重強令納食以致劇者近尤多也蓋所謂吃不死之痢疾者言痢之能吃者乃不死之證非惡谷而強食也夫瘧痢皆起夏秋都因濕熱鬱蒸以致脾胃水穀不運濕熱灼氣血為黏膩先痛後痢痢後不爽若偶食瓜果水寒即病未必即變為熱先宜辛溫疏利之劑雄按雖未必即化為熱然有暑濕內郁本將作痢偶食生冷其病適發者仍須察脈證而施治法未可遽以為寒證也余見多矣故謹贅之若膿血幾十行㽱痛後重初用宣通驅熱如芩連大黃必加甘草以緩之非如傷寒糞堅須用芒硝咸以軟堅直走破泄至陰此不過苦能勝濕寒以逐熱足可卻病古云行血則便膿愈導氣則後重除行血涼血如丹皮桃仁延胡黑楂歸尾紅花之屬導氣如木香檳榔青皮枳朴橘皮之屬世俗通套不過如此蓋瘧傷於經猶可延挨痢關乎臟誤治必危診之大法先明體質強弱肌色蒼嫩更詢起居致病因由初病體堅質實前法可遵久病氣餒神衰雖有腹痛後重亦宜詳審不可概以攻積清奪施治噤口不納水穀下痢都因熱升濁攻必用大苦如芩連石蓮清熱人參輔胃益氣熱氣一開即能進食藥宜頻頻進二三日徐云人參必同清熱之藥用便為合度小兒熱病最多者以體屬純陽六氣著人氣血皆化為熱也雄按大人雖非純陽而陰虛體多客邪化熱亦甚易也飲食不化蘊蒸於裡亦從熱化矣然有解表已復熱攻裡熱己復熱利小便愈後復熱養陰滋清熱亦不除者張季明謂元氣無所歸著陽浮則倏熱矣六神湯主之秋深初涼稚年發熱咳嗽雄按大人亦多病此證似春月風溫證但溫乃漸熱之稱涼即漸冷之意春月為病猶是冬令固密之餘秋令感傷恰值夏月發泄之後其體質之虛實不同徐云通人之言也但溫自上受燥自上傷理亦相等均是肺氣受病世人誤認暴感風寒混投三陽發散津劫燥甚喘急告危若果暴涼外束身熱痰嗽只宜蔥豉湯或蘇梗前胡杏仁枳桔之屬僅一二劑亦可更有粗工亦知熱病與瀉白散加芩連之屬不知愈苦助燥必增他變當以辛涼甘潤之方氣燥自平而愈慎勿用苦燥劫爍胃汁雄按夏令發泄所以伏暑之證多於伏寒也秋燥一證氣分先受治肺為急若延綿數十日之久病必入血分又非輕浮肺藥可治須審體質證端古謂治病當活潑潑地如盤走珠耳沈堯封曰在天為燥在地為金燥亦五氣之一也雄按以五氣而論則燥為涼邪陰凝則燥乃其本氣但秋燥二字皆從火者以秋承夏後火之餘焰未息也若火既就之陰竭則燥是其標氣治分溫潤涼潤二法然金曰從革故本氣病少標氣病多此聖人制字之所以從火而內經云燥者潤之也海峰云燥氣勝復片言而析是何等筆力然燥萬物者莫熯乎火故火未有不燥而燥未有不從火來溫熱二證論火即所以論燥也若非論燥仲景條內兩渴字從何處得來且熱病條云口燥渴明將燥字點出喻氏云古人以燥熱為暑故用白虎湯主治此悟徹之言也明乎此則溫熱二證火氣兼燥夫復何疑雄按今人以暑為陰邪又謂暑中有濕皆囈語也徐洄溪曰此卷議論和平精切字字金玉可法可傳得古人之真詮而融化之不僅名家可稱大家矣敬服敬服黃退菴曰先生乃吳中之名醫也始習幼科後學力日進擴充其道於內科一門可稱集大成焉論溫證雖宗河間而用方工細可謂青出於藍但欲讀其書者須先將仲景以下諸家之説用過工夫然後探究葉氏方意所從來庶不為無根之萍也雄按葉氏醫案乃後人所輯惟此卷幼科要略為先生手定華氏刻於醫案後以傳世徐氏以為字字金玉奈大方家視為幼科治法不過附庸於此集皆不甚留意而習幼科者謂此書為大方之指南更不過而問焉即闡發葉氏如東扶鞠通虛谷者亦皆忽略而未之及也余謂雖為小兒説法大人豈有他殊故於溫熱論後附載春溫夏暑秋燥諸條舉一反三不僅為活幼之慈航矣
