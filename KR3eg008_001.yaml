body:
  text: 卷一內經伏氣溫熱篇素問生氣通天論曰冬傷於寒春必溫病張仲景曰冬時嚴寒萬類深藏君子固密則不傷於寒雄按傷而即病者為傷寒不即病者為溫熱章虛谷曰冬寒伏於少陰鬱而化熱乘春陽上升而外發者為實證金匱真言論曰夫精者身之本也故藏於精者春不病溫王啓元曰精氣伏藏則陽不妄升故春無溫病尤拙吾曰冬傷於寒者春月溫病之由而冬不藏精者又冬時受寒之源也吳鞠通曰不藏精非專主房勞說一切人事之能動搖其精者皆是即冬時天氣應寒而陽不潛藏如春日之發泄甚至桃李反花之類亦是也章虛谷曰經論溫病有內伏而發外者有外感隨時而成者其由內伏發外者又有虛實二證上條為實證此條為虛證也熱論篇曰凡病傷寒而成溫者先夏至日者為病溫後夏至日者為病暑暑當與汗出勿止王啓元曰此以熱之微甚為義也陽熱未盛故曰溫陽熱大盛故曰暑楊上善曰冬傷於寒輕者夏至以前發為溫病重者夏至以後發為暑病林觀子曰少陰真氣既虧邪必深入郁久化熱自內而出傷寒序例云暑病者熱極重於溫是暑病者其實熱病也沈堯封曰傷寒有五熱病乃其一耳餘論俱散失矣章虛谷曰此言凡病傷寒則不獨指冬時之寒也蓋寒邪化熱隨時皆有也雄按脈要精微論曰彼春之暖為夏之暑夫暖即溫也熱之漸也然夏未至則不熱故病發猶曰溫其首先犯肺者乃外感溫邪若夏至後則漸熱故病發名曰暑蓋六月節曰小暑六月中曰大暑與冬至後之小寒大寒相對待是病暑即病熱也乃仲聖以夏月外感熱病名曰暍者別於伏氣之熱病而言也說文云暍傷暑也漢書武帝紀云夏大旱民多暍死故暑也熱也暍也皆夏令一氣之名也後人不察妄騰口說甚至講太極推先天非不辨也其實與病情無涉而於醫理反混淆也淦按此言其常也然春時亦有熱病夏日亦有溫病溫熱之輕者也熱溫之重者也故古人往往互稱刺熱篇曰肝熱病者小便先黃腹痛多臥身熱熱爭則狂言及驚脅滿痛手足躁不得安臥庚辛甚甲乙大汗氣逆則庚辛日死刺足厥陰少陽其逆則頭痛員員脈引沖頭也吳鞠通曰肝病小便先黃者肝脈絡陰器又肝主疏泄肝病則失其疏泄之職故小便先黃也腹痛多臥木病克脾土也熱爭邪熱盛而與正氣相爭也狂言及驚手厥陰心包病也兩厥陰同氣熱爭則手厥陰亦病也脅滿痛肝脈行身之兩旁脅其要路也手足躁不得安臥肝主風風淫四末又木病剋土脾主四肢木病熱必吸少陰腎中真陰陰傷故騷擾不得安臥也庚辛金日剋木故甚甲乙肝木旺時故汗出而愈氣逆謂病重而不順其可愈之理故逢其不勝之日而死也厥陰少陽並刺者病在臟兼瀉其腑也逆則頭痛以下肝主升病極而上升之故自庚辛日甚以下之理餘臟仿此心熱病者先不樂數日乃熱熱爭則卒心痛煩悶善嘔頭痛面赤無汗壬癸甚丙丁大汗氣逆則壬癸死刺手少陰太陽吳鞠通曰心病先不樂者心包名膻中居心下代君用事經謂膻中為臣使之官喜樂出焉心病故不樂也卒心痛凡實痛皆邪正相爭熱爭故卒然心痛也煩悶心主火故煩膻中氣不舒故悶嘔肝病也木火同氣熱甚而肝病亦見也且邪居膈上多善嘔也頭痛火升也面赤火色也無汗汗為心液熱閉液干汗不得通也章虛谷曰人身生陽之氣根於腎臟始發於肝木木生火火生土土生金金生水水又生木如是生生不息則安和無患也邪伏血氣之中必隨生陽之氣而動動甚則病發然其發也隨氣所注而無定處故難經言溫病之脈行在諸經不知何經之動也如仲景所論或發於陰經或發於陽經正合難經之言也今內經按生氣之序首列肝次以心脾肺腎以明邪隨生氣而動其於不定之中自有一定之理足以印證難經仲景之言而軒岐越人仲景之一脈相承更可見矣脾熱病者先頭重頰痛煩心顏青欲嘔身熱熱爭則腰痛不可用俯仰腹滿泄而頷痛甲乙甚戊己大汗氣逆則甲乙死刺足太陰陽明吳鞠通曰脾病頭先重者脾屬濕土性重經謂濕之中人也首如裹故脾病頭先重也頰少陽部也土之與木此負則彼勝土病而木病亦見也煩心脾脈注心也顏青欲嘔亦木病也腰痛不可用俯仰脾病則胃不能獨治陽明主約束而利機關故痛而至於不可俯仰也腹滿泄脾經本病頷痛亦木病也肺熱病者先淅然厥起毫毛惡風寒舌上黃身熱熱爭則喘咳痛走胸膺背不得太息頭痛不堪汗出而寒丙丁甚庚辛大汗氣逆則丙丁死刺手太陰陽明出血如大豆立已吳鞠通曰肺病先惡風寒者肺主氣又主皮毛肺病則氣膹郁不得捍衛皮毛也舌上黃者肺氣不化則濕熱聚而為黃苔也章虛谷曰若外邪初感而非內熱其苔必白喘氣鬱極也咳火剋金也胸膺背之腑也皆天氣主之肺主天氣肺氣鬱極故痛也走者不定之詞不得太息熱閉肺臟也頭痛不堪亦天氣膹郁熱不得泄直上衝腦也鬱熱而腠開汗出其熱暫泄則寒也略參章氏腎熱病者先腰痛胻酸苦渴數飲身熱熱爭則項痛而強胻寒且酸足下熱不欲言其逆則項痛員員淡淡然戊己甚壬癸大汗氣逆則戊己死刺足少陰太陽吳鞠通曰腎病腰先痛者腰為腎之府又腎脈貫脊會於督之長強穴胻腎脈入跟中以上腨內太陽之脈亦下貫腨內腨即胻也酸熱鑠液也苦渴數飲腎主五液而惡燥病熱則液傷而燥故苦渴而飲水求救也項太陽之脈從顛入絡腦還出別下項腎病至於熱爭臟病甚而移之腑故項痛而強也胻寒熱極為寒也足下熱腎脈從小指之下邪趨足心湧泉穴病甚而熱也不欲言有無可奈何之苦也邪氣上逆則項更痛員員淡淡一身不能自主難以形狀之病也略參章氏肝熱病者左頰先赤心熱病者顏先赤脾熱病者鼻先赤肺熱病者右頰先赤腎熱病者頤先赤病雖未發見赤色者刺之名曰治未病章虛谷曰此更詳五臟熱邪未發而必先見於色之可辨也左頰顏鼻右頰頤是肝心脾肺腎臟之氣應於面之部位也病雖未發其色先見可見邪本伏於氣血之中隨氣血流行而不覺更可印證難經所云溫病之脈行在諸經不知何經之動也故其發也必隨生氣而動則先見色於面良工望而知其邪動之處乘其始動即刺而泄之使邪勢殺而病自輕即難經所云隨其經之所在而取之者是為上工治未病也用藥之法亦可類推矣治諸熱病以飲之寒水乃刺之必寒衣之居此寒處身寒而止章虛谷曰以其久伏之邪熱從內發故治之必先飲寒水從里逐熱然後刺之從外而泄再衣以寒居處以寒身寒熱除而後止雄按今人不讀內經雖溫熱暑疫諸病一概治同傷寒禁其涼飲厚其衣被閉其戶牖因而致殆者我見實多然飲冷亦須有節過度則有停飲腫滿嘔利等患更有愈後手指足縫出水速投米仁三兩茯苓三兩白朮一兩車前五錢桂心一錢名驅濕保脫湯連服十劑可免腳趾脫落此即諺所謂脫腳傷寒也亦不可不知若飲冷雖多而汗出亦多必無後患太陽之脈色榮顴骨熱病也榮未交曰今且得汗待時而已與厥陰脈爭見者死期不過三日其熱病內連腎章虛谷曰此明外感與伏邪互病之證也與熱論篇之兩感同中有異彼則內外同時受邪內外俱病故不免於死此則外感先發伏邪後發者可生若同發則死期不過三日也云太陽之脈者邪受太陽經脈即一日巨陽受之頭項痛腰脊強者是也色榮顴骨者鮮榮色赤見於顴骨也蓋顴者骨之本骨者腎所主腎臟伏熱之邪已動循榮血見色於顴也榮未交今且得汗待時而已者言太陽經脈外受之邪與榮血中伏熱之邪尚未相交今且使其得汗先解外邪所謂未滿三日可汗之是也其內伏之邪後發待臟氣旺時可已如腎熱病待壬癸日得大汗而已也又如所云見赤色者刺之名治未病亦可也倘與厥陰經脈病證爭見則腎肝皆有邪熱內發其勢必與太陽外邪連合而不可解故比之兩感死期更速不過三日也蓋兩感病起於經必待胃氣盡六日方死此則其熱病內連腎臟本元即絶故死速也少陽之脈色榮頰前熱病也榮未交曰今且得汗待時而已與少陰脈爭見者死期不過三日章虛谷曰上言肝熱病者左頰先赤肝為厥陰膽為少陽相表裡者也外邪受於少陽經脈而肝臟伏熱之色榮於頰前若外內之邪尚未相交今且使其得汗以解外其內發之熱可待臟氣旺時而已若與少陰經脈病證爭見則肝連腎熱而內外邪勢必交合難解死期不過三日也大抵外內之邪發有先後而不交合尚可解救故要緊在榮未交一句下文病名陰陽交亦即榮已交之義也經文止舉太陽少陽兩證不及陽明太陰合病者余竊度之以陽明之腑可用攻瀉之法不至必死非同太陽少陽厥陰其邪連合而無出路則必死也評熱病篇帝曰有病溫者汗出輒復熱而脈躁疾不為汗衰狂言不能食病名為何岐伯曰名陰陽交交者死也葉香岩曰交者陰液外泄陽邪內陷也尤拙吾曰交非交通之謂乃錯亂之謂也陰陽錯亂而不可復理攻其陰則陽捍之不得入攻其陽則陰持之不得通故曰交者死也郭氏謂即是兩感病然兩感是陰陽齊病而非陰陽交病也章虛谷曰陰陽之氣本來相交而相生者今因邪勢瀰漫外感陽分之邪與內發陰分之邪交合為一而本元正氣絶矣故病名陰陽交交者死非陰陽正氣之相交也下文明其所以然之理人之所以汗出者皆生於穀穀生於精今邪氣交爭於骨肉而得汗者是邪卻而精勝也精勝則當能食而不復熱復熱者邪氣也汗出者精氣也今汗出而輒復熱是邪勝也不能食者精無俾也病而留者其壽可立而傾也且夫熱論曰汗出而脈尚躁盛者死今脈不與汗相應此不勝其病也其死明矣狂言者是失志失志者死今見三死不見一生雖愈必死也章虛谷曰汗生於穀穀生於精者謂由本元精氣化水穀以生津液發而為汗邪隨汗泄則邪卻而精勝也精氣勝則當能食以化水穀其邪已泄則不復熱矣乃復熱者邪氣未去也其所出之汗精氣徒泄也故汗出而輒復熱是精卻而邪勝也所以不能食精無俾也俾者倚借之謂其病雖留連其壽可立待而傾也古論云汗出而脈躁盛者死正謂其精卻而邪不去也若邪去而精氣存脈必靜矣今脈與汗不相應則精氣不勝邪氣也其死明矣且狂言是失志失志者死一也汗出復熱精卻邪勝二也汗與脈不相應三也今見三死證不見一生證雖似愈必死也雄按溫證誤作傷寒治而妄發其汗多有此候汪按此條為溫證不可妄表之訓夢隱一語可謂要言不煩蓋溫病誤表縱不成死候亦必不易愈矣麻黃桂枝人猶膽餒最誤人者陶節庵之柴葛解肌湯也陽明脈解篇曰足陽明之脈病惡人與火聞木音則惕然而驚鐘鼓不為動聞木音而驚何也岐伯曰陽明者胃脈也胃者土也故聞木音而驚者土惡木也帝曰其惡火何也岐伯曰陽明主肉其脈血氣盛邪客之則熱熱甚則惡火帝曰其惡人何也岐伯曰陽明厥則喘而惋惋則惡人章虛谷曰土被邪困更畏木克故聞木音而驚也鐘鼓之音屬金土故不為動也熱甚故惡火仲景所云不惡寒反惡熱也邪結而氣厥逆則喘而惋惋者懊憹故惡人也帝曰或喘而死者或喘而生者何也岐伯曰厥逆連臟則死連經則生章虛谷曰邪結在腑則氣阻而喘不能循經達於四肢而又厥逆蓋四肢稟氣於脾胃也邪內入則連臟故死外出則連經故生帝曰病甚則棄衣而走登高而歌或至不食數日逾垣上屋所上之處皆非其素所能也而病反能者何也岐伯曰四肢者諸陽之本也陽盛則四肢實實則能登高也帝曰其棄衣而走者何也岐伯曰熱盛於身故棄衣欲走也帝曰其妄言罵詈不避親疏而不欲食不欲食故妄走也章虛谷曰四肢稟氣於脾胃胃為臟腑之海而陽明行氣於三陽故四肢為諸陽之本也邪盛於胃氣實於四肢則能登高也熱盛於身故棄衣欲走邪亂神明怒氣衝動故妄言罵詈胃中邪實不欲飲食四肢多力則妄走也是大承氣湯之證其邪連經脈必滑大下之可生其邪連臟脈必沉細仲景云陽病見陰脈者死則雖有下證不可用下法矣雄按溫證誤投熱藥補劑亦有此候經證亦有可用白虎湯者沉細之脈亦有因熱邪閉塞使然形證實者下之可生未可概以陰脈見而斷其必死凡熱邪壅遏脈多細軟遲澀按證清解自形滑數不比內傷病服涼藥而脈加數者為虛也汪按大承氣證仲聖謂脈弦者生澀者死洄溪則云弦則尚有可生之機未必盡生澀則斷無不死者也余所見滑大者固下之不必顧忌亦有弦而兼澀下之而愈者若大汗淋漓者可用白虎也生氣通天論曰因於暑汗煩則喘喝靜則多言吳鞠通曰暑為火邪與心同氣心受邪迫汗出而煩煩從火從頁謂心氣不安而面若火鑠也喘喝者火剋金故喘遏郁胸中清廓之氣故欲喝而伸之其或邪不外張而內藏於心則靜心主言暑邪在心雖靜亦欲自言不休也略參拙意刺志論曰氣盛身寒得之傷寒氣虛身熱得之傷暑林觀子曰雖云身寒實指身發熱言也要以意得之雄按雖發熱而仍惡寒不似傷暑之惡熱故曰身寒吳鞠通曰此傷寒暑之辨也經語分明如此奈何世人悉以治寒法治溫暑哉雄按不但寒傷形暑傷氣截然分明而寒為陰邪雖有紅爐暖閣羔酒狐裘而患火病者不可謂寒是陽邪寒必兼火也暑為陽邪雖有襲涼飲冷夾雜陰寒之證亦人事之兼傷非天氣之本然也亦如水火之不相射經云天寒地凍天暑地熱又云陰陽之升降寒暑彰其兆理極明顯奈後賢道在邇而求諸遠遂不覺其立言之失而用藥之非也淦按云得之者推原受病之始分清證因也傷寒傷暑為內經兩大綱是從對待說若春傷於風夏生飧泄云云則從四序說喻氏於內經中又補傷燥可見諸氣感人皆能為病先聖後賢論極昭析何今人治感不論何證但以傷寒藥治之而不知有溫暑燥濕之病陋矣熱論篇帝曰熱病已愈時有所遺者何也岐伯曰諸病遺者熱甚而強食之故有所遺也若此者皆病已衰而熱有所藏因其穀氣相薄兩熱相合故有所遺也帝曰治遺奈何岐伯曰視其虛實調其逆從可使必已也帝曰病熱常何禁之岐伯曰病熱少愈食肉則復多食則遺此其禁也葉香岩曰因食復勞復女勞復而發汗必致亡陽而死章虛谷曰此言病初愈餘熱留藏於經絡血氣中而未淨因食助氣則兩熱相合而復熾故食肉病必復發多食谷則邪遺留必淹纏難愈故當戒口清淡稀粥漸為調養也論疾診尺篇曰尺膚熱甚脈盛躁者病溫也其脈盛而滑者病且出也吳鞠通曰經之辨溫病分明如是何世人悉謂傷寒而悉以傷寒足三陰經溫法治之哉張會卿作類經割裂經文矇混成章由未細心紬繹也尺膚熱甚火爍精也脈盛躁精被火煎沸也脈盛而滑邪機向外也此節以下診溫病之法平人氣象論曰人一呼脈三動一吸脈三動而躁尺熱曰病溫尺不熱脈滑曰病風脈澀曰痹吳鞠通曰呼吸俱三動是六七至脈矣而氣象又急躁若尺部肌膚熱則為病溫蓋溫病必傷金水二臟之津液尺之脈屬腎尺之穴屬肺也此處肌肉熱故知為病溫其不熱而脈兼滑者則為病風風之傷人也陽先受之尺為陰故不熱也如脈動躁而兼澀是氣有餘而血不足病則為痹矣玉版論要曰病溫虛甚死吳鞠通曰病溫之人精血虛甚則無陰以勝溫熱故死熱病篇曰熱病三日而氣口靜人迎躁者取之諸陽五十九刺以瀉其熱而出其汗實其陰以補其不足者吳鞠通曰人迎躁邪在上焦故取之諸陽以泄其陽邪陽氣通則汗隨之實其陰以補其不足者陽盛則陰衰瀉陽則陰得安其位故曰實其陰瀉陽之有餘即所以補陰之不足故曰補其不足也雄按用藥之道亦如此又曰實其陰以補其不足此一句實治溫熱之吃緊大綱蓋熱病未有不耗陰者其耗之未盡則生盡則陽無留戀必脫而死也真能體味斯言思過半矣雄按耗之未盡者尚有一線之生機可望若耗盡而陰竭如旱苗之根已枯矣沛然下雨亦曷濟耶汪按葉氏必以保津液為要細考經文此條可知其理奈何恣用升提溫燥重傷其津耶身熱甚陰陽皆靜者勿刺也其可刺者急取之不汗出則泄所謂勿刺者有死徵也吳鞠通曰陽證陰脈故曰勿刺熱病七日八日動喘而弦者急刺之汗且自出淺刺手大指間吳鞠通曰喘為肺氣實弦為風火鼓蕩故淺刺手大指間以泄肺熱肺之熱痹開則汗出大指間肺之少商穴也熱病七日八日脈微小病者溲血口中乾一日半而死脈代者一日死吳鞠通曰邪氣深入下焦逼血從小便出故溲血腎精告竭陰液不得上潮故口中乾脈至微小不惟陰精竭陽氣亦從而竭矣死象自明倘脈實者可治熱病已得汗出而脈尚躁喘且復熱勿刺膚喘甚者死吳鞠通曰熱不為汗衰金受火克喘而化源欲絶故死然間有可治者熱病不知所痛耳聾不能自收口乾陽熱甚陰頗有寒者熱在骨髓死不可治吳鞠通曰不知所痛正衰不與邪爭也耳聾陰傷精欲脫也不能自收正氣憊也口乾熱甚陽邪獨盛也陰頗有寒熱邪深入陰分外雖似寒而熱在骨髓也故曰死不治其有陰精未至涸竭者間可僥幸得生略參拙意熱病已得汗而脈尚躁甚此陰脈之極也死其得汗而脈靜者生吳鞠通曰汗後脈躁陰虛之極故曰死然雖不可刺能以甘涼藥沃之得法亦有得生者熱病者脈尚躁盛而不得汗者此陽脈之極也死脈盛躁得汗靜者生吳鞠通曰脈躁無汗陽盛之極陽盛而至於極陰無容留之地故亦曰死雖然較前陰陽俱靜有差此證猶可大劑急急救陰亦有活者即已得汗而陽脈躁盛邪強正弱正尚能與邪爭若留得一分津液便有一分生理貴在留之得法耳至陰陽俱靜邪氣深入下焦陰分正無捍邪之意直聽邪之所為不死何待熱病不可刺者有九一曰汗不出大顴發赤楊按陰虛勞損兩顴必赤可與此比類而觀噦者死雄按汗不出大顴赤似屬陽盛噦者厄忒也肺胃之氣不降楊按此是實證必顏赤不僅兩顴赤則厄厄而上逆也治以輕清肅化之劑病似可瘳何以經文即斷為不可刺之死候殆謂熱邪方熾而腎陽欲匱陽已無根病深聲噦之證歟楊按大顴屬腎發赤是伏藏之陽上脫也加以噦則證與色合頃刻而脫故不治則其噦必自下焦而升病由冬不藏精所致更察其脈亦必與上焦陽盛之病有別也二曰泄而腹滿甚者死雄按腹滿者當泄之既泄而滿甚是邪尚踞而陰下脫猶之乎熱不為汗衰也故死又陳遠公云喘滿直視譫語下利一齊同見者不治若有一證未見者或可望生宜用人參麥冬白芍各一兩石膏五錢竹茹三錢名挽脫湯欲脫未脫時亟服之庶幾可挽三曰目不明熱不已者死吳鞠通曰目不明精散而氣脫也經曰精散視歧又曰氣脫者目不明熱猶未已仍爍其精而傷其氣不死得乎汪按此目不明乃難經所謂脫陰者目盲也陰竭而熱猶不已安得不死四曰老人嬰兒熱而腹滿者死雄按腹滿者宜泄之老人嬰兒不任大泄既不任泄熱無出路老弱陰液不充之體涸可立待故曰死五曰汗不出嘔下血者死雄按汗不出熱內逼上干清道以為嘔迫鑠於營而下血陰液兩奪是為死徵六曰舌爛熱不已者死吳鞠通曰陽邪深入則一陰一陽之火結於血分腎水不得上濟故舌本爛熱退猶可生熱仍不止故曰死也汪按此舌爛乃由腎中虛陽故斷為死候與肺胃熱熾大熱口舌糜腐者大異七曰咳而衄汗不出出不至足者死吳鞠通曰咳而衄邪閉肺絡上行清道汗出邪泄可生不然則化源絶矣雄按汗出不至足者肺氣不能下及亦是化源欲絶之徵也八曰髓熱者死九曰熱而痙者死腰折瘛瘲齒噤齘也吳鞠通曰髓熱者邪入至深至於腎部也熱而痙邪入至深至於肝部也此節歷敘熱病之死徵以禁人之刺為刺則必死也然刺固不可亦有可藥而愈者蓋刺法能泄能通開熱邪之閉結最速至於益陰以存津楊云二語乃治溫要領實刺法之所短而湯藥之所長也汪按統觀死候九條大抵由於陰竭者為多吳氏語破的
