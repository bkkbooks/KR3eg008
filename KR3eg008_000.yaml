body:
  text: 唐跋海昌有隱君子焉曰王先生抱道在躬以醫濟世始寓於杭時豫甫髫年即聞其活人無算顧以童子無知未敢輕謁既而先生回籍復遨遊杭禾諸處所至人咸景仰名震吳越間豫益以道阻且長未克侍教為憾今年與秀水莊君眉仙共事申江樂數晨夕見其案頭有先生大著溫熱經緯展讀未竟會先生來訪莊君遂得親承道範十餘年來渴慕之忱於以稍慰且知先生亦以避難僦居於滬自此可常得追隨洵不僅一時之欣幸也同治二年夏五月仁和後學唐文溶謹跋
